<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">细胞周期中的DNA含量与G₀支路</title><desc id="desc">DNA量在S期由2C增至4C，之后维持至胞质分裂后每子细胞回到2C；从G1引出G0支路。</desc><defs><marker id="arr-477f98" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#477f98"/></marker><marker id="arr-568b78" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#568b78"/></marker><marker id="arr-9675a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#9675a5"/></marker><marker id="arr-b68b4a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#b68b4a"/></marker><marker id="arr-b96760" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#b96760"/></marker><marker id="arr-2e424d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#2e424d"/></marker></defs><rect width="1000" height="650" fill="#fbfcfa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><text x="50" y="52" font-size="30" fill="#2e424d" text-anchor="start" font-weight="600">细胞周期中的DNA含量与G₀支路</text><text x="54" y="113" font-size="23" fill="#2e424d" text-anchor="start" font-weight="400">典型二倍体细胞；DNA量按每个细胞计算</text><rect x="180" y="453" width="180" height="48" rx="2" fill="#477f9818" stroke="#477f98" stroke-width="2"/><text x="270.0" y="485" font-size="25" fill="#477f98" text-anchor="middle" font-weight="600">G₁</text><rect x="360" y="453" width="220" height="48" rx="2" fill="#568b7818" stroke="#568b78" stroke-width="2"/><text x="470.0" y="485" font-size="25" fill="#568b78" text-anchor="middle" font-weight="600">S</text><rect x="580" y="453" width="155" height="48" rx="2" fill="#9675a518" stroke="#9675a5" stroke-width="2"/><text x="657.5" y="485" font-size="25" fill="#9675a5" text-anchor="middle" font-weight="600">G₂</text><rect x="735" y="453" width="150" height="48" rx="2" fill="#b68b4a18" stroke="#b68b4a" stroke-width="2"/><text x="810.0" y="485" font-size="25" fill="#b68b4a" text-anchor="middle" font-weight="600">M</text><path d="M160 414L915 414" fill="none" stroke="#a0b0b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 181L160 414" fill="none" stroke="#a0b0b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="139" y="379" font-size="23" fill="#2e424d" text-anchor="end" font-weight="400">2C</text><text x="139" y="235" font-size="23" fill="#2e424d" text-anchor="end" font-weight="400">4C</text><path d="M165 374L910 374" fill="none" stroke="#d2dbd8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><path d="M165 229L910 229" fill="none" stroke="#d2dbd8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><path d="M180 374H360L580 229H873V374H915" fill="none" stroke="#568b78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="299" font-size="23" fill="#568b78" text-anchor="middle" font-weight="400">DNA复制</text><text x="736" y="194" font-size="23" fill="#9675a5" text-anchor="middle" font-weight="400">复制后保持4C</text><text x="881" y="338" font-size="20" fill="#b68b4a" text-anchor="end" font-weight="400">胞质分裂</text><text x="910" y="406" font-size="20" fill="#477f98" text-anchor="end" font-weight="400">子细胞2C</text><path d="M265 453L265 553" fill="none" stroke="#477f98" stroke-width="2.5" marker-end="url(#arr-477f98)"/><text x="311" y="557" font-size="23" fill="#477f98" text-anchor="start" font-weight="400">G₀：离开增殖周期，仍具代谢与特定功能</text><text x="50" y="620" font-size="19" fill="#667e83" text-anchor="start" font-weight="400">横向长度不表示各期时长；倍性与DNA量是不同概念，S期染色体数不因复制而翻倍。