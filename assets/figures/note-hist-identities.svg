<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">不同证据回答不同问题</title><desc id="desc">不同证据回答不同问题；遗传材料：亲缘与祖源、迁徙与混合、采样的时空限制；考古材料：聚落与生产、器物与葬俗、交流及区域差异；文献材料：自称与他称、语言及政治身份、制度与群体边界</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">不同证据回答不同问题</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">遗传材料</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">亲缘与祖源</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">迁徙与混合</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">采样的时空限制</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">考古材料</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">聚落与生产</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">器物与葬俗</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">交流及区域差异</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">文献材料</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">自称与他称</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">语言及政治身份</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">制度与群体边界</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三类材料可相互参照；祖源、文化和身份不能直接画等号。</text></g></svg>