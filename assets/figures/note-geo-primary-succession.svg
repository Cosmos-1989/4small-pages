63 M901 275 Q915 249 924 262 M936 268 Q952 244 960 261" fill="none" stroke="#8aa886" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M532 205 C545 241 548 268 558 293" fill="none" stroke="#3a84a5" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text x="48" y="150" fill="#283c46" font-size="25" font-weight="600" text-anchor="start" >Ⅰ  裸岩有裂隙</text><text x="403" y="150" fill="#283c46" font-size="23" font-weight="600" text-anchor="start" >Ⅱ  细粒、水分和有机质积累</text><text x="768" y="150" fill="#283c46" font-size="24" font-weight="600" text-anchor="start" >Ⅲ  植物可在斑块定居</text><text x="98" y="558" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >岩面初生裸露</text><text x="481" y="558" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >裂隙成为局部基质</text><text x="831" y="558" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >根系利用局部土壤</text></g></svg>