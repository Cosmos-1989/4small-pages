<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">裸岩裂隙中的植被斑块发育</title><desc id="desc">风化碎屑、水分和有机质在裂隙中积累，可支持苔藓、草本及其他植物定居；侵蚀可中断演替。</desc>
