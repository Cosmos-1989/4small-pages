<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc"><title id="title">肯定后件的反模型</title><desc id="desc">在没有下雨但洒水使路湿的模型中，下雨则路湿与路湿两个前提均真，结论下雨为假。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="460" fill="white"/><rect x="30" y="70" width="420" height="100" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="240.0" y="111.5" font-size="24" text-anchor="middle" fill="#2b414d">规则：下雨 → 路湿</text><text x="240.0" y="142.5" font-size="24" text-anchor="middle" fill="#2b414d">事实：路湿</text><rect x="530" y="70" width="420" height="100" rx="11" fill="#f7edf0" stroke="#ccd8de"/><text x="740.0" y="111.5" font-size="24" text-anchor="middle" fill="#2b414d">候选结论：下雨</text><text x="740.0" y="142.5" font-size="24" text-anchor="middle" fill="#2b414d">是否必然成立？</text><rect x="175" y="245" width="630" height="120" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="490.0" y="296.5" font-size="24" text-anchor="middle" fill="#2b414d">一个反模型</text><text x="490.0" y="327.5" font-size="24" text-anchor="middle" fill="#2b414d">没有下雨；洒水车使路面湿润</text><path d="M240 183 L320 232" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M740 183 L660 232" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="490" y="424" font-size="21" text-anchor="middle" fill="#2b414d">所有前提真而结论假，即足以否定这一推理形式的有效性。</text></svg>