<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">宋代社会变化的关联</title><desc id="desc">学校科举、生产市场和国家财政相互联系，制度与地区存在差异。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="63" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">宋代社会变化的关联</text><rect x="65" y="172" width="270" height="175" rx="16" fill="#f2edf5" stroke="#d3dddc" stroke-width="1.5"/><text x="200.0" y="210" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">学校、科举与士人</text><text x="200.0" y="251" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">教育与书籍传播</text><text x="200.0" y="282" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">政策辩论、地方活动</text><rect x="665" y="172" width="270" height="175" rx="16" fill="#eef3e9" stroke="#d3dddc" stroke-width="1.5"/><text x="800.0" y="210" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">农业、手工业与市场</text><text x="800.0" y="251" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">区域生产和商贸</text><text x="800.0" y="282" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">城市与海港网络</text><rect x="365" y="416" width="270" height="148" rx="16" fill="#eaf2f4" stroke="#d3dddc" stroke-width="1.5"/><text x="500.0" y="454" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">国家财政</text><text x="500.0" y="495" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">税收、专卖与信用</text><text x="500.0" y="526" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">行政和军费支出</text><path d="M338 230H648" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="500" y="217" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">知识与需求</text><path d="M756 351L625 401" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="760" y="390" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">物资与税收</text><path d="M367 445L279 362" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="159" y="410" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">任官与政策</text><text x="60" y="620" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">联系示意；不表示全国同步变化，也不代表现代资本主义已经形成。</text></g></svg>