<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">产业资本循环的三个阶段</title><desc id="desc">货币购买劳动力和生产资料，进入生产过程，形成商品资本，再经销售回流为货币。虚线表示回流后再投入，所有阶段均受具体条件制约。</desc><rect width="1000" height="450" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#607984"/></marker></defs><g font-family="'Songti SC','STSong','Noto Serif CJK SC',SimSun,serif" fill="#253d48">
<text x="54" y="43" font-size="26" text-anchor="start" fill="#253d48">购买、生产与销售</text><rect x="40" y="120" width="156" height="116" rx="12" fill="#e8f0f3" stroke="#b6c8ce"/><text x="118" y="164" font-size="23" text-anchor="middle" fill="#253d48">货币资本</text><text x="118" y="206" font-size="24" text-anchor="middle" fill="#253d48">G</text><rect x="228" y="120" width="156" height="116" rx="12" fill="#eef3ed" stroke="#b6c8ce"/><text x="306" y="164" font-size="23" text-anchor="middle" fill="#253d48">劳动力</text><text x="306" y="206" font-size="24" text-anchor="middle" fill="#253d48">和生产资料</text><rect x="416" y="120" width="156" height="116" rx="12" fill="#dfede5" stroke="#b6c8ce"/><text x="494" y="164" font-size="23" text-anchor="middle" fill="#253d48">生产过程</text><text x="494" y="206" font-size="24" text-anchor="middle" fill="#253d48">P</text><rect x="604" y="120" width="156" height="116" rx="12" fill="#f5eadc" stroke="#b6c8ce"/><text x="682" y="164" font-size="23" text-anchor="middle" fill="#253d48">商品资本</text><text x="682" y="206" font-size="24" text-anchor="middle" fill="#253d48">W′</text><rect x="792" y="120" width="156" height="116" rx="12" fill="#e8f0f3" stroke="#b6c8ce"/><text x="870" y="164" font-size="23" text-anchor="middle" fill="#253d48">回流货币</text><text x="870" y="206" font-size="24" text-anchor="middle" fill="#253d48">G′</text><path d="M196 178 H228" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M384 178 H416" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M572 178 H604" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 178 H792" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><text x="215" y="101" font-size="21" text-anchor="middle" fill="#253d48">购买</text><text x="498" y="101" font-size="21" text-anchor="middle" fill="#253d48">价值形成与增殖</text><text x="777" y="101" font-size="21" text-anchor="middle" fill="#253d48">销售</text><path d="M870 245 V320 H118 V245" fill="none" stroke="#607984" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="494" y="306" font-size="23" text-anchor="middle" fill="#253d48">回流后再投入，生产得以重复</text><text x="54" y="375" font-size="22" text-anchor="start" fill="#253d48">商品须适销并完成销售；形成价值与实现价值是不同环节。</text><text x="54" y="411" font-size="21" text-anchor="start" fill="#253d48">箭头表示职能形式转换，未表示各阶段实际历时或价值增幅。</text>
</g></svg>