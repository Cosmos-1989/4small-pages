xt x="212" y="604" font-size="25" fill="#8a729d" text-anchor="start" font-weight="400">矿化</text><text x="176" y="282" font-size="23" fill="#b88d48" text-anchor="middle" font-weight="400">铵</text><text x="806" y="280" font-size="23" fill="#467e99" text-anchor="middle" font-weight="400">硝酸盐</text><text x="500" y="639" font-size="24" fill="#568976" text-anchor="middle" font-weight="400">植物、微生物及食物网</text><text x="45" y="703" font-size="22" fill="#72838a" text-anchor="start" font-weight="400">主要过程示意；未列出厌氧氨氧化、全部中间体和人为输入。</text></g></svg>