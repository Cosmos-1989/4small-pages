<svg xmlns="http://www.w3.org/2000/svg" width="980" height="358" viewBox="0 0 980 358" role="img" aria-labelledby="title desc"><title id="title">实践、认识与证据反馈</title><desc id="desc">问题和资料引出解释与理论，理论经应用检验，新证据和反例反馈到下一轮观察与修正。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="358" fill="white"/><rect x="45" y="83" width="230" height="95" rx="12" fill="#eef3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="160.0" y="122.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">实践与观察</text><text x="160.0" y="152.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="400">问题、经验和资料</text><rect x="375" y="83" width="230" height="95" rx="12" fill="#edf5f2" stroke="#cdd8dc" stroke-width="1.5"/><text x="490.0" y="122.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">解释与理论</text><text x="490.0" y="152.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="400">分析、概括与推论</text><rect x="705" y="83" width="230" height="95" rx="12" fill="#f7f1ec" stroke="#cdd8dc" stroke-width="1.5"/><text x="820.0" y="122.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">应用与检验</text><text x="820.0" y="152.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="400">对照预期和结果</text><path d="M284 130 L365 130" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M614 130 L695 130" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 188 V262 H160 V188" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="250" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">新证据、失败与反例推动修正</text><text x="490" y="326" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">反复检验可以改进认识；重复次数、一次成功都不能自动保证真理。</text></svg>