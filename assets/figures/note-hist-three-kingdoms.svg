<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">魏、蜀汉、吴与晋的政权转换</title><desc id="desc">魏、蜀汉、吴与晋的政权转换；公元 220 年：魏建立；221 年：蜀汉建立；229 年：孙权称帝；263 年：蜀汉灭亡；265 年：晋代魏；280 年：晋灭吴</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">魏、蜀汉、吴与晋的政权转换</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">公元 220 年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">魏建立</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">曹丕代汉；汉末分立此前已形成</text><circle cx="253" cy="197.0" r="9" fill="#5b8b79"/><text x="224" y="205.0" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">221 年</text><text x="285" y="205.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">蜀汉建立</text><text x="285" y="236.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">刘备称帝，延续汉的政治名号</text><circle cx="253" cy="283.0" r="9" fill="#886b95"/><text x="224" y="291.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">229 年</text><text x="285" y="291.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">孙权称帝</text><text x="285" y="322.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">吴此前已作为地区政权存在</text><circle cx="253" cy="369.0" r="9" fill="#b68b4d"/><text x="224" y="377.0" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">263 年</text><text x="285" y="377.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">蜀汉灭亡</text><text x="285" y="408.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">魏军攻灭蜀汉</text><circle cx="253" cy="455.0" r="9" fill="#b76759"/><text x="224" y="463.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">265 年</text><text x="285" y="463.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">晋代魏</text><text x="285" y="494.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">司马炎建立晋朝</text><circle cx="253" cy="541.0" r="9" fill="#42788f"/><text x="224" y="549.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">280 年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">晋灭吴</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">结束三国分立</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">按事件先后排列，间隔不表示历时比例；帝号与地区政权形成须区分。</text></g></svg>