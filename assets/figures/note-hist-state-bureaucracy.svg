<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">职位与治理实践</title><desc id="desc">职位与治理实践；中央机构：决策与政令、人事与财政、军事及监察；地方官署：户籍与赋役、司法与治安、交通及公共工程；基层参与者：胥吏与书役、乡里组织、地方精英及民众</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">职位与治理实践</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">中央机构</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">决策与政令</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">人事与财政</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军事及监察</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">地方官署</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">户籍与赋役</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">司法与治安</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">交通及公共工程</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">基层参与者</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">胥吏与书役</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">乡里组织</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地方精英及民众</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">图示事务类型与参与者；不是某一朝代的官制组织表。</text></g></svg>