<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc"><title id="title">绝对剩余价值与相对剩余价值的条件比较</title><desc id="desc">在同一0到10小时刻度上，原条件为必要劳动4小时加剩余劳动4小时。绝对情形为4加6，相对情形为3加5。所有数字均为理论例示。</desc><rect width="1000" height="525" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#607984"/></marker></defs><g font-family="'Songti SC','STSong','Noto Serif CJK SC',SimSun,serif" fill="#253d48">
<text x="170" y="40" font-size="25" text-anchor="start" fill="#253d48">工作日内部的必要劳动与剩余劳动</text><text x="15" y="129" font-size="22" text-anchor="start" fill="#253d48">原有条件</text><rect x="170" y="95" width="272" height="58" rx="0" fill="#dfece6" stroke="#b6c8ce"/><rect x="442" y="95" width="272" height="58" rx="0" fill="#f3e5d4" stroke="#b6c8ce"/><text x="306.0" y="131" font-size="21" text-anchor="middle" fill="#253d48">必要劳动 4小时</text><text x="578.0" y="131" font-size="21" text-anchor="middle" fill="#253d48">剩余劳动 4小时</text><text x="728" y="131" font-size="20" text-anchor="start" fill="#253d48">共8小时</text><text x="15" y="245" font-size="22" text-anchor="start" fill="#253d48">绝对剩余价值</text><rect x="170" y="211" width="272" height="58" rx="0" fill="#dfece6" stroke="#b6c8ce"/><rect x="442" y="211" width="408" height="58" rx="0" fill="#f3e5d4" stroke="#b6c8ce"/><text x="306.0" y="247" font-size="21" text-anchor="middle" fill="#253d48">必要劳动 4小时</text><text x="646.0" y="247" font-size="21" text-anchor="middle" fill="#253d48">剩余劳动 6小时</text><text x="864" y="247" font-size="20" text-anchor="start" fill="#253d48">共10小时</text><text x="15" y="361" font-size="22" text-anchor="start" fill="#253d48">相对剩余价值</text><rect x="170" y="327" width="204" height="58" rx="0" fill="#dfece6" stroke="#b6c8ce"/><rect x="374" y="327" width="340" height="58" rx="0" fill="#f3e5d4" stroke="#b6c8ce"/><text x="272.0" y="363" font-size="21" text-anchor="middle" fill="#253d48">必要劳动 3小时</text><text x="544.0" y="363" font-size="21" text-anchor="middle" fill="#253d48">剩余劳动 5小时</text><text x="728" y="363" font-size="20" text-anchor="start" fill="#253d48">共8小时</text><path d="M170 412 H850" fill="none" stroke="#607984" stroke-width="1.6"/><path d="M170 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="170" y="449" font-size="20" text-anchor="middle" fill="#253d48">0</text><path d="M238 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="238" y="449" font-size="20" text-anchor="middle" fill="#253d48">1</text><path d="M306 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="306" y="449" font-size="20" text-anchor="middle" fill="#253d48">2</text><path d="M374 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="374" y="449" font-size="20" text-anchor="middle" fill="#253d48">3</text><path d="M442 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="442" y="449" font-size="20" text-anchor="middle" fill="#253d48">4</text><path d="M510 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="510" y="449" font-size="20" text-anchor="middle" fill="#253d48">5</text><path d="M578 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="578" y="449" font-size="20" text-anchor="middle" fill="#253d48">6</text><path d="M646 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="646" y="449" font-size="20" text-anchor="middle" fill="#253d48">7</text><path d="M714 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="714" y="449" font-size="20" text-anchor="middle" fill="#253d48">8</text><path d="M782 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="782" y="449" font-size="20" text-anchor="middle" fill="#253d48">9</text><path d="M850 412 V420" fill="none" stroke="#607984" stroke-width="1.5"/><text x="850" y="449" font-size="20" text-anchor="middle" fill="#253d48">10</text><text x="907" y="449" font-size="20" text-anchor="start" fill="#253d48">小时</text><text x="170" y="490" font-size="21" text-anchor="start" fill="#253d48">两种变化分别与原有条件比较；劳动力按价值交换，劳动强度给定。</text>
</g></svg>