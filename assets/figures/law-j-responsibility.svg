<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">不同法律责任的构成与目的</title><desc id="desc">民事责任、行政处罚和刑事责任分别按照其法定条件判断，不是按轻重排列的连续阶梯；同一行为可能产生不同责任。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#637d87" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Songti SC","STSong","SimSun",serif;fill:#29434c} .head{font-size:29px;font-weight:600}.label{font-size:24px}.small{font-size:21px;fill:#607780}.line{fill:none;stroke:#637d87;stroke-width:2;marker-end:url(#arrow)}.box{stroke-width:1.5;rx:13}</style><rect width="1080" height="590" fill="#fff"/>
    <text x="45" y="43" class="small">从事实与适用规范识别不同责任</text>
    <rect class="box" x="345" y="76" width="390" height="70" fill="#f1f4f3" stroke="#b6c5c3"/>
    <text x="540" y="120" class="head" text-anchor="middle">行为事实与适用规范</text>
    <path class="line" d="M540 146V181H198V215"/><path class="line" d="M540 146V215"/><path class="line" d="M540 146V181H882V215"/>
    <rect class="box" x="45" y="227" width="306" height="225" fill="#edf5f6" stroke="#98b6bd"/>
    <rect class="box" x="387" y="227" width="306" height="225" fill="#f8f2e7" stroke="#cdbb96"/>
    <rect class="box" x="729" y="227" width="306" height="225" fill="#f2eef6" stroke="#b8a8c6"/>
    <text x="198" y="279" class="head" text-anchor="middle">民事责任</text><text x="198" y="325" class="label" text-anchor="middle">恢复权利、填补损害</text><text x="198" y="365" class="label" text-anchor="middle">或承担相应约定后果</text><text x="198" y="419" class="small" text-anchor="middle">核对民事实体与程序</text>
    <text x="540" y="279" class="head" text-anchor="middle">行政处罚</text><text x="540" y="325" class="label" text-anchor="middle">依法惩戒违反</text><text x="540" y="365" class="label" text-anchor="middle">行政管理秩序的行为</text><text x="540" y="419" class="small" text-anchor="middle">核对权限、事实与程序</text>
    <text x="882" y="279" class="head" text-anchor="middle">刑事责任</text><text x="882" y="325" class="label" text-anchor="middle">构成犯罪并满足</text><text x="882" y="365" class="label" text-anchor="middle">相应归责条件</text><text x="882" y="419" class="small" text-anchor="middle">依法定罪、量刑与救济</text>
    <text x="540" y="506" class="label" text-anchor="middle">同一行为可能引起不同责任；不得以行政处罚代替刑事处罚。</text>
    <text x="45" y="558" class="small">关系示意；三列不按损害或处罚轻重排序，也不表示责任必然同时成立。</text></svg>
