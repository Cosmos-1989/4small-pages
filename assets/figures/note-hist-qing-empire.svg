<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">清代不同区域的治理渠道</title><desc id="desc">中央政务通过州县、盟旗与驻扎大臣等多种路径联系不同区域。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="620" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="63" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">清代不同区域的治理渠道</text><rect x="350" y="114" width="300" height="122" rx="16" fill="#f2edf5" stroke="#d3dddc" stroke-width="1.5"/><text x="500.0" y="152" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">皇帝与中央政务</text><text x="500.0" y="193" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">内阁、军机处等</text><rect x="50" y="336" width="275" height="181" rx="16" fill="#eaf2f4" stroke="#d3dddc" stroke-width="1.5"/><text x="187.5" y="374" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">省区州县渠道</text><text x="187.5" y="415" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">督抚与州县</text><text x="187.5" y="446" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">赋税、司法和行政</text><rect x="363" y="336" width="275" height="181" rx="16" fill="#eef3e9" stroke="#d3dddc" stroke-width="1.5"/><text x="500.5" y="374" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">盟旗等渠道</text><text x="500.5" y="415" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">理藩院及盟旗</text><text x="500.5" y="446" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">政治、宗教与礼仪关系</text><rect x="676" y="336" width="275" height="181" rx="16" fill="#f5eee2" stroke="#d3dddc" stroke-width="1.5"/><text x="813.5" y="374" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">驻扎大臣等渠道</text><text x="813.5" y="415" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">驻军与地方机构</text><text x="813.5" y="446" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">具体区域安排不同</text><path d="M420 238L187 321" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M500 238V321" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M580 238L813 321" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="60" y="584" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">不同渠道存在交叉及历时变化；不表示区域面积、人口或权力份额。</text></g></svg>