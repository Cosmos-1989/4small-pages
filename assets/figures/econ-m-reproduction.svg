<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">简单再生产中的两部类补偿</title><desc id="desc">部类I生产资料总量6000，内部补偿4000，向部类II提供2000。部类II消费资料总量3000，内部消费1000，向部类I提供2000。图形非数量比例。</desc><rect width="1000" height="610" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#607984"/></marker></defs><g font-family="'Songti SC','STSong','Noto Serif CJK SC',SimSun,serif" fill="#253d48">
<text x="50" y="42" font-size="25" text-anchor="start" fill="#253d48">社会总产品：9000个价值单位（假设）</text><rect x="50" y="100" width="320" height="130" rx="10" fill="#e4eef2" stroke="#b6c8ce"/><rect x="630" y="100" width="320" height="130" rx="10" fill="#e5eee6" stroke="#b6c8ce"/><text x="210" y="138" font-size="24" text-anchor="middle" fill="#253d48">Ⅰ部类：生产资料</text><text x="210" y="179" font-size="22" text-anchor="middle" fill="#253d48">4000c＋1000v＋1000s</text><text x="210" y="213" font-size="22" text-anchor="middle" fill="#253d48">总产品6000</text><text x="790" y="138" font-size="24" text-anchor="middle" fill="#253d48">Ⅱ部类：消费资料</text><text x="790" y="179" font-size="22" text-anchor="middle" fill="#253d48">2000c＋500v＋500s</text><text x="790" y="213" font-size="22" text-anchor="middle" fill="#253d48">总产品3000</text><path d="M370 150 H630" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="133" font-size="22" text-anchor="middle" fill="#253d48">生产资料2000</text><path d="M630 210 H370" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="193" font-size="22" text-anchor="middle" fill="#253d48">消费资料2000</text><rect x="50" y="350" width="320" height="95" rx="10" fill="#f1f5f7" stroke="#b6c8ce"/><rect x="630" y="350" width="320" height="95" rx="10" fill="#f1f5f1" stroke="#b6c8ce"/><text x="210" y="387" font-size="22" text-anchor="middle" fill="#253d48">内部生产资料补偿4000</text><text x="210" y="421" font-size="20" text-anchor="middle" fill="#253d48">部类内部产品流向</text><text x="790" y="387" font-size="22" text-anchor="middle" fill="#253d48">内部个人消费1000</text><text x="790" y="421" font-size="20" text-anchor="middle" fill="#253d48">部类内部产品流向</text><path d="M210 230 V335" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M790 230 V335" fill="none" stroke="#607984" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="492" font-size="24" text-anchor="middle" fill="#253d48">跨部类交换条件：Ⅰ(v＋s)＝Ⅱc＝2000</text><text x="50" y="542" font-size="21" text-anchor="start" fill="#253d48">假设无外贸、无积累，全部不变资本一年内转移；产品按价值交换。</text><text x="50" y="576" font-size="21" text-anchor="start" fill="#253d48">箭头表示产品去向，线宽及框面积不表示数量比例。</text>
</g></svg>