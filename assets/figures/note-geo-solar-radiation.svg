<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">太阳高度与受光面积</title><desc id="desc">相同宽度的平行光束在太阳高度不同情况下照射水平地面，较低太阳高度对应较宽的地表受光范围。</desc><defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#387d9d"/></marker>
          <marker id="arr-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2c5877"/></marker>
          <marker id="arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d67c65"/></marker>
          <marker id="arr-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#e7af58"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#698f77"/></marker>
          <marker id="arr-earth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#ab977b"/></marker>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbfc"/><stop offset="1" stop-color="#e9f4f5"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f0f1"/><stop offset="1" stop-color="#9fced4"/></linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ddc8"/><stop offset="1" stop-color="#c8b08f"/></linearGradient>
          </defs><rect x="0" y="0" width="1100" height="620" rx="0" fill="#fcfdfb"/><text x="50" y="58" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="28" fill="#243b45" text-anchor="start" font-weight="700">太阳高度与受光面积</text><path d="M50 76L1050 76" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="100" width="972" height="394" rx="20" fill="url(#sky)"/><ellipse cx="109" cy="155" rx="37" ry="37" fill="#fff2d5" stroke="#e7af58" stroke-width="4"/><path d="M70 462 C260 449 436 451 560 464 S864 475 1030 459 L1030 503 H70 Z" fill="#d9c7a8" stroke="#ab977b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 138 L270 446 L332 446 L178 138 Z" fill="#f7dfa7" opacity=".43"/><path d="M116 138L270 446" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><path d="M178 138L332 446" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><path d="M270 447L332 447" fill="none" stroke="#d67c65" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M299 446 A56 56 0 0 0 267 398" fill="none" stroke="#61757b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="369" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243b45" text-anchor="middle" font-weight="400">太阳高度较大</text><text x="305" y="490" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#d67c65" text-anchor="middle" font-weight="600">受光范围较窄</text><path d="M418 305 L728 449 L860 449 L550 305 Z" fill="#f7dfa7" opacity=".45"/><path d="M418 305L728 449" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><path d="M550 305L860 449" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><path d="M728 449L860 449" fill="none" stroke="#d67c65" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M824 449 A76 76 0 0 0 757 419" fill="none" stroke="#61757b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="801" y="270" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243b45" text-anchor="middle" font-weight="400">太阳高度较小</text><text x="812" y="490" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#d67c65" text-anchor="middle" font-weight="600">受光范围较宽</text><text x="558" y="159" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#61757b" text-anchor="middle" font-weight="400">同宽平行光束</text><path d="M50 547L1050 547" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="587" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#61757b" text-anchor="start" font-weight="400">仅比较几何展开；实际吸收还取决于大气、云与地表反照率。</text></svg>