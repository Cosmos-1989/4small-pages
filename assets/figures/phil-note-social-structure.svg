<svg xmlns="http://www.w3.org/2000/svg" width="980" height="362" viewBox="0 0 980 362" role="img" aria-labelledby="title desc"><title id="title">生产力、生产关系与上层建筑的联系</title><desc id="desc">三个层次间有条件制约和反馈关系。经济基础不等于生产力，也不等于一切经济活动；图不表示单因决定或一一对应。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="362" fill="white"/><rect x="30" y="90" width="250" height="105" rx="12" fill="#edf3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="155.0" y="134.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">生产力</text><text x="155.0" y="164.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">劳动者、工具和知识</text><rect x="365" y="90" width="250" height="105" rx="12" fill="#edf5f2" stroke="#cdd8dc" stroke-width="1.5"/><text x="490.0" y="134.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">生产关系</text><text x="490.0" y="164.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">所有制、组织与分配</text><rect x="700" y="90" width="250" height="105" rx="12" fill="#f7f0e9" stroke="#cdd8dc" stroke-width="1.5"/><text x="825.0" y="134.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">上层建筑</text><text x="825.0" y="164.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">政治法律与观念形态</text><path d="M286 118 L357 118" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="80" font-size="18" fill="#273c48" text-anchor="middle" font-weight="400">条件制约</text><path d="M358 173 L287 173" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="226" font-size="18" fill="#273c48" text-anchor="middle" font-weight="400">组织激励</text><path d="M621 118 L692 118" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="657" y="80" font-size="18" fill="#273c48" text-anchor="middle" font-weight="400">现实基础</text><path d="M693 173 L622 173" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="657" y="226" font-size="18" fill="#273c48" text-anchor="middle" font-weight="400">制度反作用</text><text x="490" y="292" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">生产方式：生产力与生产关系的统一。经济基础：一定社会生产关系的总和。</text><text x="490" y="329" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">这是理论中的解释层次；具体历史联系还须考察政治、传统与行动者。</text></svg>