<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">湖泊水量与溶质的不同去向</title><desc id="desc">农业退水输入水与溶质；蒸发主要移走水，出流、沉积和生物地球化学过程也影响浓度。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><path d="M104 329 C231 303 291 338 358 373 C450 420 655 423 753 375 C831 338 906 318 997 331 L997 537 L104 537Z" fill="#e8d6b5" stroke="#bd8553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M291 354 C469 378 629 384 807 354 L790 474 Q550 497 310 474Z" fill="#e7f3f5" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M332 407 Q559 433 767 408" fill="none" stroke="#a6b8b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="399" cy="427" r="4" fill="#bd8553" /><circle cx="452" cy="447" r="4" fill="#bd8553" /><circle cx="487" cy="417" r="4" fill="#bd8553" /><circle cx="559" cy="459" r="4" fill="#bd8553" /><circle cx="603" cy="428" r="4" fill="#bd8553" /><circle cx="669" cy="449" r="4" fill="#bd8553" /><circle cx="728" cy="422" r="4" fill="#bd8553" /><path d="M90 258 C173 273 244 307 307 351" fill="none" stroke="#3a84a5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" /><path d="M791 357 C875 330 937 297 1001 290" fill="none" stroke="#397b70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" /><path d="M497 347 C494 281 499 228 512 183" fill="none" stroke="#d07660" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-warm)" /><path d="M618 343 C623 269 635 227 642 184" fill="none" stroke="#d07660" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-warm)" /><text x="91" y="188" fill="#3a84a5" font-size="24" font-weight="600" text-anchor="start" >灌区退水输入</text><text x="91" y="220" fill="#3a84a5" font-size="22" font-weight="400" text-anchor="start" >水与溶质</text><text x="804" y="218" fill="#397b70" font-size="22" font-weight="400" text-anchor="start" >出流带走水与部分溶质</text><text x="435" y="134" fill="#d07660" font-size="24" font-weight="600" text-anchor="start" >蒸发主要移走水</text><text x="437" y="383" fill="#366b89" font-size="28" font-weight="600" text-anchor="start" >湖水</text><path d="M552 467 Q565 489 585 498" fill="none" stroke="#bd8553" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="614" y="526" fill="#bd8553" font-size="20" font-weight="400" text-anchor="start" >沉积、转化也影响溶质质量</text><text x="122" y="576" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >浓度取决于溶质质量与水量，不能只按蒸发判断</text></g></svg>