<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">两晋南北朝：分立与重组</title><desc id="desc">两晋南北朝：分立与重组；280年：晋灭吴；317年：东晋建立；439年：北魏统一北方；534—535年：北魏分裂；589年：隋灭陈</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">两晋南北朝：分立与重组</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">280年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">晋灭吴</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">主要统治区域一度统一</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">317年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">东晋建立</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">北方多政权并立，南迁持续</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">439年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">北魏统一北方</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">南北政权各有制度与社会发展</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">534—535年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">北魏分裂</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">东魏、西魏及后继政权竞争</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">589年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">隋灭陈</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">南北主要政权重新整合</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">点间距离不代表历时；同时存在的政权仅列主要节点。</text></g></svg>