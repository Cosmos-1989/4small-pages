<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">思想传播与社会参与</title><desc id="desc">思想传播与社会参与；媒介与空间：报刊、大学和社团、翻译与知识交流、传播范围不均；文化与政治议题：白话文学与科学、民主与个人权利、婚姻、教育和伦理；社会参与及分化：学生、工人与商人、五四抗议与组织、不同政治思想路径</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">思想传播与社会参与</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">媒介与空间</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">报刊、大学和社团</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">翻译与知识交流</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">传播范围不均</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">文化与政治议题</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">白话文学与科学</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">民主与个人权利</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">婚姻、教育和伦理</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">社会参与及分化</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">学生、工人与商人</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">五四抗议与组织</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">不同政治思想路径</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三个层面互相联系，栏宽不代表参与规模；思想主张与权利实践有距离。</text></g></svg>