<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">计划配置与粮食分配中的信息问题</title><desc id="desc">生产与上报影响征购调配，进而影响家庭口粮；虚线表示需要进入决策的真实反馈和政策纠错。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="570" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="65" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">计划与口粮：信息和资源的流动</text><rect x="60" y="188" width="270" height="136" rx="18" fill="#edf4f5" stroke="#cad8d8" stroke-width="2"/><text x="195" y="238" font-size="26" fill="#283e49" text-anchor="middle" font-weight="600">生产与上报</text><text x="195" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">劳力、产量与统计</text><path d="M335 256h24" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="188" width="270" height="136" rx="18" fill="#f4edf5" stroke="#cad8d8" stroke-width="2"/><text x="500" y="238" font-size="26" fill="#283e49" text-anchor="middle" font-weight="600">征购与调配</text><text x="500" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">目标、供应与分配</text><path d="M640 256h24" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="188" width="270" height="136" rx="18" fill="#f4f0e7" stroke="#cad8d8" stroke-width="2"/><text x="805" y="238" font-size="26" fill="#283e49" text-anchor="middle" font-weight="600">家庭口粮</text><text x="805" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">实际可得的食物</text><path d="M805 330V390H195V330" fill="none" stroke="#b76759" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="500" y="430" font-size="24" fill="#9c574d" text-anchor="middle" font-weight="400">真实反馈与政策纠错</text><text x="60" y="490" font-size="20" fill="#596b74" text-anchor="start" font-weight="400">当报告失真、征购过量且反馈受压制时，家庭缺粮难以及时进入决策。</text><text x="60" y="534" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">箭头表示制度联系；不是定量模型，不代表所有地区的统一程序。</text></g></svg>