斜向入射波</text><line x1="412" y1="361" x2="233" y2="438" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="412" cy="361" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="80" y="445" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >上冲与回流</text><line x1="615" y1="409" x2="765" y2="451" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="615" cy="409" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="640" y="461" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >此波况下的沿岸净输沙</text><text x="863" y="305" font-size="23" fill="#287e9c" text-anchor="start" font-weight="normal" >海</text><text x="862" y="385" font-size="23" fill="#b77949" text-anchor="start" font-weight="normal" >陆</text>
<line x1="48" y1="494" x2="1052" y2="494" stroke="#d5e2dd" stroke-width="2" />
<text x="50" y="527" font-size="18" fill="#526a72" text-anchor="start" font-weight="normal" >局地净输沙方向随波况而变，不能据此推全年方向。</text>
