<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">富冰冻土消融与热融湖形成条件</title><desc id="desc">地下冰融化可使地面下沉成洼地；补给超过排水和蒸发时才可能积水成湖。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><line x1="550" y1="89" x2="550" y2="532" stroke="#a6b8b7" stroke-width="2" stroke-linecap="round" /><path d="M71 323 Q230 259 482 325 L506 520 L71 520Z" fill="#e8d6b5" stroke="#bd8553" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M596 316 Q704 322 768 371 Q843 423 916 364 Q961 326 1028 318 L1028 520 L596 520Z" fill="#e8d6b5" stroke="#bd8553" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M764 371 Q839 410 916 365 L907 407 Q833 426 772 409Z" fill="#e7f3f5" stroke="#3a84a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="175" cy="368" rx="43" ry="10" fill="#badde8" stroke="#3a84a5" stroke-width="1.4" /><ellipse cx="267" cy="349" rx="38" ry="9" fill="#badde8" stroke="#3a84a5" stroke-width="1.4" /><ellipse cx="352" cy="378" rx="53" ry="11" fill="#badde8" stroke="#3a84a5" stroke-width="1.4" /><ellipse cx="419" cy="344" rx="28" ry="8" fill="#badde8" stroke="#3a84a5" stroke-width="1.4" /><path d="M107 433 Q288 414 467 433 M622 449 Q817 430 1003 449" fill="none" stroke="#a6b8b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/><path d="M538 334 H580" fill="none" stroke="#397b70" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" /><text x="92" y="112" fill="#283c46" font-size="27" font-weight="600" text-anchor="start" >富冰冻土</text><text x="628" y="112" fill="#283c46" font-size="27" font-weight="600" text-anchor="start" >融冰后可能塌陷</text><text x="112" y="284" fill="#3a84a5" font-size="22" font-weight="400" text-anchor="start" >地下冰透镜体</text><path d="M310 292 L327 368" fill="none" stroke="#63757a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="730" y="286" fill="#3a84a5" font-size="22" font-weight="400" text-anchor="start" >洼地积水有条件</text><path d="M837 295 L835 386" fill="none" stroke="#63757a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="129" y="559" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >冰融化使地面失去部分支撑</text><text x="632" y="559" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >补给超过排水和蒸发时可积水</text></g></svg>