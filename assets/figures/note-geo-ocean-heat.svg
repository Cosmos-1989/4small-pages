<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">海气显热与蒸发潜热可不同向</title><desc id="desc">若近海面空气比海面暖，显热可传向海洋；若存在水汽梯度，海面仍可蒸发并向空气输送潜热。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><rect x="80" y="343" width="940" height="220" rx="0" fill="#e7f3f5" /><path d="M80 344 Q190 331 310 344 T550 344 T790 344 T1020 344" fill="none" stroke="#3a84a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 170 Q288 133 472 164 T842 169 Q932 183 1010 163" fill="none" stroke="#a6b8b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 11"/><path d="M355 213 C362 257 360 293 359 331" fill="none" stroke="#d07660" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-warm)" /><path d="M744 326 C739 288 736 246 744 198" fill="none" stroke="#3a84a5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" /><circle cx="689" cy="244" r="4.5" fill="#3a84a5" /><circle cx="705" cy="219" r="4.5" fill="#3a84a5" /><circle cx="724" cy="259" r="4.5" fill="#3a84a5" /><circle cx="762" cy="223" r="4.5" fill="#3a84a5" /><circle cx="779" cy="267" r="4.5" fill="#3a84a5" /><circle cx="796" cy="243" r="4.5" fill="#3a84a5" /><text x="258" y="93" fill="#d07660" font-size="25" font-weight="600" text-anchor="start" >近海面空气较暖</text><text x="97" y="256" fill="#d07660" font-size="23" font-weight="400" text-anchor="start" >显热可向海水传递</text><path d="M340 269 L353 301" fill="none" stroke="#63757a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="688" y="110" fill="#3a84a5" font-size="25" font-weight="600" text-anchor="start" >蒸发供湿</text><text x="770" y="265" fill="#3a84a5" font-size="23" font-weight="400" text-anchor="start" >潜热可向空气传递</text><path d="M762 271 L745 244" fill="none" stroke="#63757a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="127" y="464" fill="#366b89" font-size="28" font-weight="600" text-anchor="start" >海面</text><text x="126" y="553" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >示意为满足相应温度与水汽条件时的通量方向，未表示净热收支</text></g></svg>