<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">抬升、凝结与降水</title><desc id="desc">暖湿气流沿迎风坡抬升并冷却，达到饱和后可能形成云和降水；背风坡下沉通常增温。</desc><defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#387d9d"/></marker>
          <marker id="arr-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2c5877"/></marker>
          <marker id="arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d67c65"/></marker>
          <marker id="arr-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#e7af58"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#698f77"/></marker>
          <marker id="arr-earth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#ab977b"/></marker>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbfc"/><stop offset="1" stop-color="#e9f4f5"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f0f1"/><stop offset="1" stop-color="#9fced4"/></linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ddc8"/><stop offset="1" stop-color="#c8b08f"/></linearGradient>
          </defs><rect x="0" y="0" width="1100" height="620" rx="0" fill="#fcfdfb"/><text x="50" y="58" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="28" fill="#243b45" text-anchor="start" font-weight="700">抬升、凝结与降水</text><path d="M50 76L1050 76" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="101" width="947" height="380" rx="18" fill="url(#sky)"/><rect x="77" y="448" width="200" height="72" rx="0" fill="url(#sea)"/><path d="M256 450 C347 442 396 356 468 258 C494 219 514 214 539 249 C639 359 708 432 834 452 L1024 452 L1024 521 H256 Z" fill="url(#land)" stroke="#ab977b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 465 Q160 454 254 463" fill="none" stroke="#387d9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M139 340 C229 327 342 341 438 257" fill="none" stroke="#387d9d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M481 249 C469 210 471 186 498 160" fill="none" stroke="#387d9d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><ellipse cx="487" cy="213" rx="55" ry="26" fill="#ffffff" stroke="#abc7cf" stroke-width="2"/><ellipse cx="540" cy="193" rx="56" ry="31" fill="#ffffff" stroke="#abc7cf" stroke-width="2"/><ellipse cx="592" cy="214" rx="49" ry="23" fill="#ffffff" stroke="#abc7cf" stroke-width="2"/><ellipse cx="529" cy="224" rx="93" ry="28" fill="#ffffff" stroke="#abc7cf" stroke-width="2"/><path d="M461 257L454 288" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 260L485 291" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M521 257L514 288" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M552 261L545 292" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M624 264 C689 316 723 369 815 405" fill="none" stroke="#d67c65" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-warm)"/><path d="M164 446 C153 415 174 395 164 374" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M206 446 C195 415 216 395 206 374" fill="none" stroke="#387d9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="99" y="305" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#387d9d" text-anchor="start" font-weight="400">海面供湿</text><text x="301" y="258" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#387d9d" text-anchor="middle" font-weight="400">抬升冷却</text><text x="545" y="144" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243b45" text-anchor="middle" font-weight="400">凝结成云</text><text x="670" y="243" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#2c5877" text-anchor="start" font-weight="400">云粒增长后可降水</text><text x="820" y="348" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#d67c65" text-anchor="middle" font-weight="400">下沉增温</text><text x="850" y="487" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#ab977b" text-anchor="middle" font-weight="400">背风坡</text><text x="370" y="479" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#ab977b" text-anchor="middle" font-weight="400">迎风坡</text><path d="M50 547L1050 547" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="587" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#61757b" text-anchor="start" font-weight="400">云底与降水位置并非固定；背风坡是否干燥需结合实际风、湿度和地形。</text></svg>