<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">人为增温与气候系统响应</title><desc id="desc">人为排放增加温室气体，使向太空的长波辐射收支改变，并通过海洋、冰雪和水循环产生长期响应。</desc><defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#387d9d"/></marker>
          <marker id="arr-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2c5877"/></marker>
          <marker id="arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d67c65"/></marker>
          <marker id="arr-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#e7af58"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#698f77"/></marker>
          <marker id="arr-earth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#ab977b"/></marker>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbfc"/><stop offset="1" stop-color="#e9f4f5"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f0f1"/><stop offset="1" stop-color="#9fced4"/></linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ddc8"/><stop offset="1" stop-color="#c8b08f"/></linearGradient>
          </defs><rect x="0" y="0" width="1100" height="620" rx="0" fill="#fcfdfb"/><text x="50" y="58" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="28" fill="#243b45" text-anchor="start" font-weight="700">人为增温与气候系统响应</text><path d="M50 76L1050 76" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="75" y="103" width="950" height="400" rx="18" fill="url(#sky)"/><path d="M100 426 C273 411 408 433 562 421 S867 432 1004 419 L1004 512 H100 Z" fill="url(#land)" stroke="#ab977b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="138" y="351" width="25" height="75" rx="0" fill="#9eaaa5"/><rect x="189" y="369" width="24" height="56" rx="0" fill="#9eaaa5"/><path d="M126 427 L126 377 L140 377 L140 351 L164 351 L164 385 L190 385 L190 367 L214 367 L214 427Z" fill="#bfc8c2" stroke="#8b9d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 332 C215 306 235 294 280 290" fill="none" stroke="#61757b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-deep)"/><text x="123" y="294" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#243b45" text-anchor="start" font-weight="400">人为排放</text><text x="274" y="281" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#243b45" text-anchor="start" font-weight="400">温室气体增加</text><ellipse cx="320" cy="157" rx="31" ry="31" fill="#fff2d5" stroke="#e7af58" stroke-width="3"/><path d="M343 178 C383 227 414 284 461 346" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><text x="300" y="221" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="20" fill="#e7af58" text-anchor="middle" font-weight="400">太阳短波</text><path d="M378 363 C469 264 634 271 724 362" fill="none" stroke="#b8d8dd" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M420 379 C503 309 599 313 682 379" fill="none" stroke="#91c0c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/><ellipse cx="540" cy="413" rx="84" ry="84" fill="#d4e8e3" stroke="#5d9ba4" stroke-width="2"/><path d="M475 375 Q504 357 531 380 L516 399 L485 396 Z" fill="#698f77"/><path d="M570 429 Q607 430 599 462 L569 470 L554 449 Z" fill="#698f77"/><path d="M541 350 C541 299 541 251 541 207" fill="none" stroke="#d67c65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-warm)"/><path d="M577 212 C615 264 614 310 590 346" fill="none" stroke="#d67c65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-warm)"/><path d="M665 319 C695 268 707 221 715 172" fill="none" stroke="#d67c65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-warm)"/><text x="488" y="173" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#d67c65" text-anchor="middle" font-weight="400">地表长波</text><text x="647" y="302" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#d67c65" text-anchor="start" font-weight="400">向下长波</text><text x="746" y="166" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#d67c65" text-anchor="middle" font-weight="400">向外长波收支改变</text><path d="M711 395 C773 380 806 366 848 344" fill="none" stroke="#2c5877" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-deep)"/><path d="M712 416 C775 416 806 424 852 438" fill="none" stroke="#387d9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="861" y="335" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#2c5877" text-anchor="start" font-weight="400">海洋储热</text><text x="861" y="446" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#387d9d" text-anchor="start" font-weight="400">冰雪与水循环</text><text x="526" y="495" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243b45" text-anchor="middle" font-weight="400">地气系统储热增加</text><path d="M50 547L1050 547" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="587" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#61757b" text-anchor="start" font-weight="400">概念路径不量化温升或反馈强度；各区域响应与风险须分别评估。</text></svg>