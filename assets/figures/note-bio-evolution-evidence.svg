<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc"><title id="title">系统树表达共同祖先，不表达等级</title><desc id="desc">鱼、蛙、哺乳类与蜥蜴及鸟类呈嵌套分支，羊膜动物包括小鼠、蜥蜴和鸽。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="665" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">系统树表达共同祖先，不表达等级</text><path d="M650 420L650 510" fill="none" stroke="#294451" stroke-width="3"/><path d="M650 420L790 420" fill="none" stroke="#294451" stroke-width="3"/><path d="M650 510L790 510" fill="none" stroke="#294451" stroke-width="3"/><path d="M490 330L490 465.0" fill="none" stroke="#294451" stroke-width="3"/><path d="M490 330L790 330" fill="none" stroke="#294451" stroke-width="3"/><path d="M490 465.0L650 465.0" fill="none" stroke="#294451" stroke-width="3"/><path d="M330 240L330 397.5" fill="none" stroke="#294451" stroke-width="3"/><path d="M330 240L790 240" fill="none" stroke="#294451" stroke-width="3"/><path d="M330 397.5L490 397.5" fill="none" stroke="#294451" stroke-width="3"/><path d="M170 150L170 318.75" fill="none" stroke="#294451" stroke-width="3"/><path d="M170 150L790 150" fill="none" stroke="#294451" stroke-width="3"/><path d="M170 318.75L330 318.75" fill="none" stroke="#294451" stroke-width="3"/><path d="M80 234.375L170 234.375" fill="none" stroke="#294451" stroke-width="3"/><circle cx="790" cy="150" r="6" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="812" y="159" font-size="28" fill="#294451" text-anchor="start">鲤鱼</text><circle cx="790" cy="240" r="6" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="812" y="249" font-size="28" fill="#294451" text-anchor="start">蛙</text><circle cx="790" cy="330" r="6" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="812" y="339" font-size="28" fill="#294451" text-anchor="start">小鼠</text><circle cx="790" cy="420" r="6" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="812" y="429" font-size="28" fill="#294451" text-anchor="start">蜥蜴</text><circle cx="790" cy="510" r="6" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="812" y="519" font-size="28" fill="#294451" text-anchor="start">鸽</text><circle cx="265" cy="318.75" r="11" fill="#5d8e78" stroke="none" stroke-width="2"/><text x="260" y="324" font-size="14" fill="white" text-anchor="start">1</text><circle cx="430" cy="397.5" r="11" fill="#92749d" stroke="none" stroke-width="2"/><text x="425" y="403" font-size="14" fill="white" text-anchor="start">2</text><text x="70" y="584" font-size="23" fill="#5d8e78" text-anchor="start">① 四足动物祖先的肢体构造</text><text x="530" y="584" font-size="23" fill="#92749d" text-anchor="start">② 羊膜动物的共同祖先</text><text x="50" y="639" font-size="20" fill="#687e83" text-anchor="start">只画五个代表类群；枝长不按时间或变化量，树梢位置不代表进化等级。</text></g></svg>