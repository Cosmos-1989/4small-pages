<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：海洋温跃层与同深度水温差</title><desc id="desc">表层受热和风浪混合可形成垂向温跃层；同一深度的侧向低温舌还可能涉及不同水团交换。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#3384a2"/></marker>
<marker id="ad" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#23627d"/></marker>
<marker id="ag" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#668a76"/></marker>
<marker id="ar" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#bb7057"/></marker>
<marker id="am" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526872"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cce9ed"/><stop offset="1" stop-color="#e7f4f3"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcc7"/><stop offset="1" stop-color="#c8ab88"/></linearGradient>
</defs><rect width="1100" height="560" fill="#fbfcfa"/><text x="45" y="57" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="25" fill="#243842" font-weight="700" text-anchor="start" >海水垂向结构 · 定性示意</text><line x1="45" y1="73" x2="1055" y2="73" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><path d="M76 137 C235 129 384 138 553 133 L553 453 H76Z" fill="#dbeef0" stroke="#6b97a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 137 C235 129 384 138 553 133 L553 221 C386 222 229 225 76 219Z" fill="#cce9ea" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 219 C235 225 386 222 553 221 L553 335 C365 351 224 347 76 338Z" fill="#a7cdd8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 338 C224 347 365 351 553 335 L553 453 H76Z" fill="#739fb5" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76 137 C235 129 384 138 553 133 M76 219 C229 225 386 222 553 221 M76 338 C224 347 365 351 553 335" fill="none" stroke="#4b8ca3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="118" y="188" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#23627d" font-weight="700" text-anchor="start" >表层混合层</text><text x="122" y="286" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#23627d" font-weight="700" text-anchor="start" >温跃层</text><text x="124" y="411" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#fff" font-weight="700" text-anchor="start" >深层水</text><path d="M695 137H1014 M695 137V453" fill="none" stroke="#243842" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M696 147H978" fill="none" stroke="#526872" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#am)"/><path d="M695 142V440" fill="none" stroke="#526872" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#am)"/><text x="1001" y="122" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#526872" font-weight="400" text-anchor="end" >水温较高</text><text x="690" y="475" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#526872" font-weight="400" text-anchor="start" >深度增加</text><path d="M925 155 C923 191 917 211 884 230 C825 267 790 280 758 315 C742 336 736 399 734 438" fill="none" stroke="#bb7057" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M704 221H946 M704 337H820" fill="none" stroke="#b5c4c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/><line x1="808" y1="285" x2="891" y2="279" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="808" cy="285" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="898" y="283" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >水温梯度较大</text><path d="M474 280 C528 277 574 274 618 270" fill="none" stroke="#3384a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)" stroke-dasharray="7 6"/><text x="459" y="329" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >同深度侧向交换需另证</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >无实测温度或深度刻度；单凭水温不能确定水团源地及流速。</text></svg>