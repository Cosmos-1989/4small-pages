<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">唐代制度的主要联系</title><desc id="desc">中央机构经州县行政联系户籍赋役、军事动员和跨区域往来。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="63" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">唐代制度：中央、地方与动员</text><rect x="345" y="112" width="310" height="118" rx="16" fill="#eaf2f4" stroke="#d3dddc" stroke-width="1.5"/><text x="500.0" y="150" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">中央政务</text><text x="500.0" y="191" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">三省、六部等机构</text><rect x="345" y="288" width="310" height="118" rx="16" fill="#eef3e9" stroke="#d3dddc" stroke-width="1.5"/><text x="500.0" y="326" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">州县行政</text><text x="500.0" y="367" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">任官、登记与执行</text><path d="M500 232V272" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="60" y="462" width="252" height="115" rx="16" fill="#f5eee2" stroke="#d3dddc" stroke-width="1.5"/><text x="186.0" y="500" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">户籍与赋役</text><text x="186.0" y="541" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">土地、租庸调等</text><rect x="375" y="462" width="252" height="115" rx="16" fill="#f2edf5" stroke="#d3dddc" stroke-width="1.5"/><text x="501.0" y="500" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">军事动员</text><text x="501.0" y="541" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">府兵、边军等</text><rect x="689" y="462" width="252" height="115" rx="16" fill="#edf4f5" stroke="#d3dddc" stroke-width="1.5"/><text x="815.0" y="500" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">往来与管控</text><text x="815.0" y="541" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">使节、商旅、僧侣</text><path d="M415 408L186 447" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M500 408V447" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M585 408L815 447" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="60" y="627" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">制度功能示意；时期、地区及不同身份的实际安排有别。</text></g></svg>