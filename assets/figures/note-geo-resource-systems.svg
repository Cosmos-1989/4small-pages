<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">流域水资源的补给、取用与回归</title><desc id="desc">山地降水与上游来水补给河流和含水层，农业及城镇取水，部分回归水进入河道，河道还承载下游和生态需水。</desc>
<defs>
