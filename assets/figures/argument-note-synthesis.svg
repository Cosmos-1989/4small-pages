<svg xmlns="http://www.w3.org/2000/svg" width="980" height="515" viewBox="0 0 980 515" role="img" aria-labelledby="title desc"><title id="title">围绕问题组织不同材料</title><desc id="desc">不同文体承担不同证明任务；先核对来源、范围和口径，再综合而不简单累计证据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="515" fill="white"/><rect x="28" y="55" width="235" height="90" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="145.5" y="92.5" font-size="23" text-anchor="middle" fill="#2d414b">法规与制度</text><text x="145.5" y="123.5" font-size="23" text-anchor="middle" fill="#2d414b">规则要求是什么</text><rect x="28" y="190" width="235" height="90" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="145.5" y="227.5" font-size="23" text-anchor="middle" fill="#2d414b">行动与统计</text><text x="145.5" y="258.5" font-size="23" text-anchor="middle" fill="#2d414b">做了什么、怎样变化</text><rect x="28" y="325" width="235" height="90" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="145.5" y="362.5" font-size="23" text-anchor="middle" fill="#2d414b">访谈与意见</text><text x="145.5" y="393.5" font-size="23" text-anchor="middle" fill="#2d414b">谁怎样理解或评价</text><rect x="372" y="190" width="235" height="90" rx="10" fill="#f8f2e9" stroke="#d1dde2"/><text x="489.5" y="227.5" font-size="23" text-anchor="middle" fill="#2d414b">范围与口径</text><text x="489.5" y="258.5" font-size="23" text-anchor="middle" fill="#2d414b">来源、对象、时间</text><rect x="716" y="190" width="235" height="90" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="833.5" y="227.5" font-size="23" text-anchor="middle" fill="#2d414b">围绕问题综合</text><text x="833.5" y="258.5" font-size="23" text-anchor="middle" fill="#2d414b">支持、补充或分歧</text><path d="M270 100 L364 235" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270 235 L364 235" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M270 370 L364 235" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M614 235 L708 235" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><text x="490" y="475" font-size="22" text-anchor="middle" fill="#2d414b">同一原始调查的多次转述，不能当作多份独立证据。</text></svg>