<svg xmlns="http://www.w3.org/2000/svg" width="980" height="515" viewBox="0 0 980 515" role="img" aria-labelledby="title desc">
<title id="title">出口总值与国内增加值</title><desc id="desc">教学假设：单件产品使用价值70的进口投入，本国增加值30，出口总值100。条段宽度按70比30准确绘制。假定进口投入不含返回的国内增加值且全部转入产品；数值不是实测贸易数据。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="515" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="490" y="46" font-size="27" text-anchor="middle" fill="#253e48">单件产品的价值分解（假设）</text><text x="490" y="105" font-size="25" text-anchor="middle" fill="#253e48">出口总值：100个价值单位</text><rect x="80" y="145" width="574.0" height="120" rx="0" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><rect x="654.0" y="145" width="246.0" height="120" rx="0" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="367.0" y="191" font-size="25" text-anchor="middle" fill="#253e48">进口投入价值</text><text x="367.0" y="235" font-size="32" text-anchor="middle" fill="#39798d">70</text><text x="777.0" y="191" font-size="25" text-anchor="middle" fill="#253e48">国内增加值</text><text x="777.0" y="235" font-size="32" text-anchor="middle" fill="#557d66">30</text><line x1="80" y1="283" x2="80" y2="297" stroke="#5f747d" stroke-width="1.5"/><line x1="80" y1="297" x2="654.0" y2="297" stroke="#5f747d" stroke-width="1.5"/><line x1="654.0" y1="283" x2="654.0" y2="297" stroke="#5f747d" stroke-width="1.5"/><text x="367.0" y="334" font-size="22" text-anchor="middle" fill="#253e48">来自境外的投入品价值</text><line x1="654.0" y1="283" x2="654.0" y2="297" stroke="#5f747d" stroke-width="1.5"/><line x1="654.0" y1="297" x2="900" y2="297" stroke="#5f747d" stroke-width="1.5"/><line x1="900" y1="283" x2="900" y2="297" stroke="#5f747d" stroke-width="1.5"/><text x="777.0" y="334" font-size="22" text-anchor="middle" fill="#253e48">本国生产形成的价值</text><text x="490" y="394" font-size="26" text-anchor="middle" fill="#253e48">出口100＝进口投入70＋国内增加值30</text><text x="490" y="440" font-size="22" text-anchor="middle" fill="#5f747d">假定进口投入不含返回的国内增加值，并全部用于该产品。</text><text x="490" y="479" font-size="22" text-anchor="middle" fill="#5f747d">条段按70∶30绘制；国内增加值包含工资等多类收入。</text>
</g></svg>
