<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">晚清的制度改革</title><desc id="desc">晚清的制度改革；1898年：戊戌变法与政变；1901年：清末新政展开；1905年：停止科举；1908—1909年：预备立宪与咨议局；1911年：皇族内阁与保路运动</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">晚清的制度改革</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1898年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">戊戌变法与政变</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">改革诏令密集发布，随后大部分被撤销</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1901年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">清末新政展开</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">军事、教育、工商及法律改革</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1905年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">停止科举</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">新式学校成为人才培养的重要途径</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1908—1909年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">预备立宪与咨议局</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">皇权广泛保留，政治参与逐渐扩大</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1911年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">皇族内阁与保路运动</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">政治信任和中央地方关系发生危机</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>