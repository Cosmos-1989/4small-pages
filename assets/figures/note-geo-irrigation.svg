><path d="M265 266 L265 316" fill="none" stroke="#bd8553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M257 267 H273 M257 317 H273" fill="none" stroke="#bd8553" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="294" y="260" fill="#bd8553" font-size="20" font-weight="400" text-anchor="start" >可用水头须克服沿程损失</text><text x="94" y="585" fill="#63757a" font-size="18" font-weight="400" text-anchor="start" >纵剖面仅表示相对高程；实际供水还取决于河道、渠线与田块条件</text></g></svg>