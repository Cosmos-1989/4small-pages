ine x1="696" y1="248" x2="756" y2="248" stroke="#8f9893" stroke-width="1.7" /><text x="769" y="254" font-size="24" fill="#273b45" text-anchor="start" font-weight="bold" >E</text><text x="816" y="254" font-size="21" fill="#526a72" text-anchor="start" font-weight="normal" >淋溶层*</text><line x1="696" y1="314" x2="756" y2="314" stroke="#8f9893" stroke-width="1.7" /><text x="769" y="320" font-size="24" fill="#273b45" text-anchor="start" font-weight="bold" >B</text><text x="816" y="320" font-size="21" fill="#526a72" text-anchor="start" font-weight="normal" >下层土</text><line x1="696" y1="388" x2="756" y2="388" stroke="#8f9893" stroke-width="1.7" /><text x="769" y="394" font-size="24" fill="#273b45" text-anchor="start" font-weight="bold" >C</text><text x="816" y="394" font-size="21" fill="#526a72" text-anchor="start" font-weight="normal" >母质</text><line x1="696" y1="446" x2="756" y2="446" stroke="#8f9893" stroke-width="1.7" /><text x="769" y="452" font-size="24" fill="#273b45" text-anchor="start" font-weight="bold" >R</text><text x="816" y="452" font-size="21" fill="#526a72" text-anchor="start" font-weight="normal" >岩石</text><line x1="506" y1="270" x2="173" y2="265" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="506" cy="270" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="70" y="256" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >淋溶与迁移</text><line x1="539" y1="314" x2="151" y2="355" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="539" cy="314" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="70" y="363" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >淀积或性状改变</text><text x="732" y="474" font-size="19" fill="#526a72" text-anchor="start" font-weight="normal" >* E 层并非普遍存在</text>
