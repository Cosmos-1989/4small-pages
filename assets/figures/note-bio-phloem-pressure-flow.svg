<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">一条源库通路的韧皮部压力流</title><desc id="desc">糖装载引起水进入筛管，源端较高膨压驱动汁液向库端流动，卸载后水与邻近木质部交换；单通路不代表全株固定方向。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#4b91ad"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#659b7a"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#c59a51"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#b87770"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, STSong, SimSun, serif" stroke-linecap="round" stroke-linejoin="round"><text x="62" y="36" font-size="21" fill="#4b91ad" text-anchor="start">木质部</text><text x="314" y="36" font-size="21" fill="#659b7a" text-anchor="start">筛管</text><rect x="86" y="65" width="62" height="323" rx="15" fill="#e5f1f6" stroke="#4b91ad" stroke-width="2"/><rect x="309" y="65" width="76" height="323" rx="15" fill="#e5eed9" stroke="#659b7a" stroke-width="2"/><path d="M313 160 L381 160" stroke="#659b7a" stroke-width="3" fill="none" /><circle cx="322" cy="160" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="337" cy="160" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="353" cy="160" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="369" cy="160" r="3" fill="white" stroke="none" stroke-width="1.5"/><path d="M313 259 L381 259" stroke="#659b7a" stroke-width="3" fill="none" /><circle cx="322" cy="259" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="337" cy="259" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="353" cy="259" r="3" fill="white" stroke="none" stroke-width="1.5"/><circle cx="369" cy="259" r="3" fill="white" stroke="none" stroke-width="1.5"/><path d="M117 348 L117 102" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M347 177 L347 242" stroke="#659b7a" stroke-width="4" fill="none" marker-end="url(#g)"/><path d="M155 105 L300 105" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="227" y="91" font-size="18" fill="#4b91ad" text-anchor="middle">水</text><path d="M303 350 L158 350" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="227" y="334" font-size="18" fill="#4b91ad" text-anchor="middle">水</text><path d="M556 85 C598 40 666 69 675 109 C629 124 593 113 556 85" stroke="#659b7a" stroke-width="2" fill="#dceacb" /><text x="555" y="147" font-size="19" fill="#334b55" text-anchor="start">源：成熟叶</text><rect x="539" y="286" width="161" height="79" rx="35" fill="#f3e5ca" stroke="#c59a51" stroke-width="2"/><text x="552" y="405" font-size="19" fill="#334b55" text-anchor="start">库：储藏器官</text><path d="M548 101 L398 101" stroke="#c59a51" stroke-width="3" fill="none" marker-end="url(#o)"/><text x="420" y="87" font-size="18" fill="#c59a51" text-anchor="start">糖装载</text><path d="M398 319 L526 319" stroke="#c59a51" stroke-width="3" fill="none" marker-end="url(#o)"/><text x="430" y="303" font-size="18" fill="#c59a51" text-anchor="start">糖卸载</text><text x="399" y="139" font-size="18" fill="#659b7a" text-anchor="start">较高膨压</text><text x="399" y="365" font-size="18" fill="#659b7a" text-anchor="start">较低膨压</text><circle cx="333" cy="101" r="4" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="361" cy="119" r="4" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="336" cy="147" r="4" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="360" cy="188" r="4" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="334" cy="226" r="4" fi