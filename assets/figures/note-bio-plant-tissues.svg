"/><circle cx="710" cy="433" r="24" fill="#fbfcfa" stroke="#477f98" stroke-width="1.5"/><circle cx="815" cy="433" r="31" fill="#c8e0ea" stroke="#477f98" stroke-width="4"/><circle cx="815" cy="433" r="24" fill="#fbfcfa" stroke="#477f98" stroke-width="1.5"/><text x="732" y="547" font-size="24" fill="#477f98" text-anchor="middle" font-weight="400">木质部：靠内侧</text><text x="296" y="576" font-size="21" fill="#2e424d" text-anchor="middle" font-weight="400">典型真双子叶植物幼茎横切面</text><text x="50" y="620" font-size="19" fill="#667e83" text-anchor="start" font-weight="400">只示一种常见排列；根、叶及其他类群的组织位置不同，不能据此概括所有维管植物。</text></g></svg>