<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">元朝治理的制度组合</title><desc id="desc">元朝治理的制度组合；区域行政：中书省与行省、路、府、州、县、达鲁花赤及其他官员；身份与资源：贵族分封关系、军户、工匠户等、差别待遇与实际参用；交通与交流：驿站及水陆运输、大都与草原上都、港口及多种知识往来</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">元朝治理的制度组合</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">区域行政</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">中书省与行省</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">路、府、州、县</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">达鲁花赤及其他官员</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">身份与资源</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">贵族分封关系</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军户、工匠户等</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">差别待遇与实际参用</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">交通与交流</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">驿站及水陆运输</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">大都与草原上都</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">港口及多种知识往来</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">制度有多种来源；身份分类不等于财富与权力的固定四级阶梯。</text></g></svg>