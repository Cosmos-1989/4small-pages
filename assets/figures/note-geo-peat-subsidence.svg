<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">泥炭地排水后的沉降机制</title><desc id="desc">排水降低地下水位，泥炭发生干燥收缩并接触氧气，分解导致固体质量减少。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><line x1="550" y1="90" x2="550" y2="537" stroke="#a6b8b7" stroke-width="2" stroke-linecap="round" /><rect x="65" y="307" width="430" height="211" rx="0" fill="#896850" /><path d="M65 386 Q175 379 280 386 T495 386" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><rect x="592" y="307" width="430" height="211" rx="0" fill="#896850" /><path d="M592 386 Q702 379 807 386 T1022 386" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><path d="M65 308 Q250 289 495 307" fill="none" stroke="#283c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 304 l-5 -55 m5 55 l19 -34 M281 304 l8 -69 m-8 69 l-23 -35 M410 306 l-8 -52 m8 52 l19 -31" fill="none" stroke="#397b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M65 386 Q256 373 495 386" fill="none" stroke="#3a84a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="89" y="113" fill="#283c46" font-size="26" font-weight="600" text-anchor="start" >排水前：泥炭较湿</text><text x="92" y="411" fill="white" font-size="23" font-weight="400" text-anchor="start" >较高地下水位</text><rect x="592" y="308" width="430" height="36" rx="0" fill="white" /><path d="M592 343 Q809 331 1022 343" fill="none" stroke="#283c46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M650 342 l-4 -40 m4 40 l18 -25 M802 341 l3 -47 m-3 47 l-16 -24 M939 343 l-7 -41 m7 41 l17 -23" fill="none" stroke="#397b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M592 451 Q811 440 1022 451" fill="none" stroke="#3a84a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M592 386 Q807 377 1022 386" fill="none" stroke="#a6b8b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin=