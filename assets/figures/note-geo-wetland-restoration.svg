<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">河道与河漫滩重新连通</title><desc id="desc">顺直河道恢复弯曲及洪泛连通后，部分水与湿地土壤、植被接触的机会增加，可能发生颗粒沉降和营养盐转化。</desc>
