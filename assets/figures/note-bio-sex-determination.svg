<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc"><title id="title">常见XX/XY组成与发育调控</title><desc id="desc">左侧为X卵分别与X或Y精子结合的典型组合，右侧为SRY和SOX9相关的典型睾丸分化路径，并指出卵巢同样有主动网络。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="665" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">常见XX/XY组成与发育调控</text><text x="240" y="118" font-size="27" fill="#294451" text-anchor="middle" font-weight="600">典型配子组合</text><text x="730" y="118" font-size="27" fill="#294451" text-anchor="middle" font-weight="600">性腺分化依赖调控网络</text><text x="293" y="175" font-size="25" fill="#3f7d96" text-anchor="middle">卵细胞：X</text><text x="65" y="272" font-size="23" fill="#294451" text-anchor="start">X精子</text><text x="65" y="397" font-size="23" fill="#294451" text-anchor="start">Y精子</text><rect x="190" y="205" width="205" height="100" rx="15" fill="#edf3f4" stroke="#d5e0e0" stroke-width="2"/><text x="292" y="269" font-size="34" fill="#3f7d96" text-anchor="middle" font-weight="600">XX</text><rect x="190" y="330" width="205" height="100" rx="15" fill="#f1edf4" stroke="#d5e0e0" stroke-width="2"/><text x="292" y="394" font-size="34" fill="#92749d" text-anchor="middle" font-weight="600">XY</text><text x="293" y="485" font-size="25" fill="#294451" text-anchor="middle">理论约各占½</text><rect x="555" y="172" width="355" height="75" rx="15" fill="#f2edf5" stroke="#d5e0e0" stroke-width="2"/><text x="733" y="218" font-size="25" fill="#294451" text-anchor="middle">SRY及相关调控因素</text><path d="M732 253L732 285" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="294" width="355" height="75" rx="15" fill="#eaf2f3" stroke="#d5e0e0" stroke-width="2"/><text x="733" y="341" font-size="23" fill="#294451" text-anchor="middle">SOX9等网络 · 时序与剂量</text><path d="M732 376L732 408" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="417" width="355" height="75" rx="15" fill="#edf4ea" stroke="#d5e0e0" stroke-width="2"/><text x="733" y="464" font-size="25" fill="#294451" text-anchor="middle">典型睾丸分化路径</text><text x="550" y="548" font-size="23" fill="#5d8e78" text-anchor="start">卵巢分化也有主动的调控网络</text><text x="550" y="583" font-size="25" fill="#92749d" text-anchor="start">核型 ≠ 全部性发育表型</text><text x="50" y="639" font-size="20" fill="#687e83" text-anchor="start">常见人类模式；假定正常分离与受精，不涵盖全部核型及性发育变异。</text></g></svg>