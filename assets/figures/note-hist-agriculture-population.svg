<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">人口过程与统计口径</title><desc id="desc">人口过程与统计口径；人口过程：出生与死亡、迁入与迁出、婚姻和家庭决策；登记口径：户、口与丁、登记地域及身份、漏登及行政失控</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">人口过程与统计口径</text><rect x="60.0" y="108" width="420.0" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">人口过程</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">出生与死亡</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">迁入与迁出</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">婚姻和家庭决策</text><rect x="500.0" y="108" width="420.0" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="522.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">登记口径</text><text x="522.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">户、口与丁</text><text x="522.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">登记地域及身份</text><text x="522.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">漏登及行政失控</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">户籍变化包含人口过程与登记制度变化两方面信息。</text></g></svg>