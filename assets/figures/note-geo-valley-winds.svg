<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">夜间冷空气沿坡面和河谷下泄</title><desc id="desc">夜间坡面辐射冷却形成较密空气，沿坡流向谷底；若低地有通道，气流可沿河谷继续流动。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><path d="M95 174 Q266 221 366 375 Q444 490 535 489 Q636 490 725 372 Q834 209 1011 172 L1011 559 L95 559Z" fill="#dfe6e2" stroke="#9aa6a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 440 Q500 474 551 474 Q633 474 694 435" fill="none" stroke="#366b89" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M275 263 C345 324 395 397 464 455" fill="none" stroke="#3a84a5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" /><path d="M838 256 C767 327 701 408 622 455" fill="none" stroke="#3a84a5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" /><path d="M511 445 C546 426 581 437 607 451" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="793" cy="106" r="32" fill="#d7dddf" /><circle cx="806" cy="98" r="27" fill="white" /><text x="105" y="110" fill="#283c46" font-size="24" font-weight="600" text-anchor="start" >夜间辐射冷却</text><text x="216" y="211" fill="#3a84a5" font-size="22" font-weight="400" text-anchor="start" >较密空气沿坡下泄</text><text x="801" y="217" fill="#3a84a5" font-size="22" font-weight="400" text-anchor="end" >较密空气沿坡下泄</text><text x="429" y="534" fill="#366b89" font-size="22" font-weight="400" text-anchor="start" >谷底可形成冷空气汇聚</text><path d="M620 581 H830" fill="none" stroke="#397b70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" /><text x="849" y="589" fill="#397b70" font-size="18" font-weight="400" text-anchor="start" >若有通道，可沿谷继续流动</text></g></svg>