<svg xmlns="http://www.w3.org/2000/svg" width="980" height="365" viewBox="0 0 980 365" role="img" aria-labelledby="title desc"><title id="title">本体论与认识论的两个问题</title><desc id="desc">左右并列区分存在与意识的本原问题，以及知识的根据和限度问题。两者不能简单等同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="365" fill="white"/><text x="248" y="43" font-size="25" fill="#577991" text-anchor="middle" font-weight="600">本体论问题</text><text x="732" y="43" font-size="25" fill="#487e78" text-anchor="middle" font-weight="600">认识论问题</text><text x="248" y="90" font-size="22" fill="#273c48" text-anchor="middle" font-weight="400">存在与意识何者是本原？</text><text x="732" y="90" font-size="22" fill="#273c48" text-anchor="middle" font-weight="400">认识何以可能，又有何限度？</text><rect x="28" y="121" width="440" height="70" rx="12" fill="#eef3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="248.0" y="163.0" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">唯物主义：物质第一性</text><rect x="28" y="213" width="440" height="70" rx="12" fill="#f7f1ec" stroke="#cdd8dc" stroke-width="1.5"/><text x="248.0" y="255.0" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">唯心主义：精神或理念第一性</text><rect x="512" y="121" width="440" height="70" rx="12" fill="#edf5f2" stroke="#cdd8dc" stroke-width="1.5"/><text x="732.0" y="163.0" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">知识的根据、对象与范围</text><rect x="512" y="213" width="440" height="70" rx="12" fill="#f6f3f7" stroke="#cdd8dc" stroke-width="1.5"/><text x="732.0" y="255.0" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">认识能力的条件与边界</text><path d="M490 20 L490 300" fill="none" stroke="#71858e" stroke-width="2" stroke-dasharray="6 5"/><text x="490" y="332" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">两个问题相互联系；不能用本体论标签代替对具体知识主张的论证。</text></svg>