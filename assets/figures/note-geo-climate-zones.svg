<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">气候类型的多因素控制</title><desc id="desc">太阳辐射、大气环流、海陆和洋流、地形共同影响一个地区多年温度及降水季节组合。</desc><defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#387d9d"/></marker>
          <marker id="arr-deep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2c5877"/></marker>
          <marker id="arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d67c65"/></marker>
          <marker id="arr-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#e7af58"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#698f77"/></marker>
          <marker id="arr-earth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#ab977b"/></marker>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbfc"/><stop offset="1" stop-color="#e9f4f5"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f0f1"/><stop offset="1" stop-color="#9fced4"/></linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ddc8"/><stop offset="1" stop-color="#c8b08f"/></linearGradient>
          </defs><rect x="0" y="0" width="1100" height="620" rx="0" fill="#fcfdfb"/><text x="50" y="58" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="28" fill="#243b45" text-anchor="start" font-weight="700">气候类型的多因素控制</text><path d="M50 76L1050 76" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="77" y="103" width="945" height="407" rx="18" fill="url(#sky)"/><ellipse cx="153" cy="160" rx="39" ry="39" fill="#fff2d5" stroke="#e7af58" stroke-width="3"/><path d="M183 172 C286 198 352 213 425 235" fill="none" stroke="#e7af58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-sun)"/><text x="109" y="246" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243b45" text-anchor="start" font-weight="400">纬度辐射</text><path d="M382 164 C491 114 625 126 695 181" fill="none" stroke="#2c5877" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-deep)"/><text x="492" y="126" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#2c5877" text-anchor="middle" font-weight="400">环流与水汽</text><rect x="90" y="406" width="330" height="105" rx="0" fill="url(#sea)"/><path d="M86 408 Q170 398 255 407 T421 407" fill="none" stroke="#387d9d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 408 C501 399 540 316 586 280 C608 260 628 297 649 337 C702 407 798 407 1022 404 L1022 511 H420 Z" fill="url(#land)" stroke="#ab977b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 338 C235 325 325 347 458 366" fill="none" stroke="#387d9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="123" y="389" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#387d9d" text-anchor="start" font-weight="400">海陆与洋流</text><text x="644" y="275" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#ab977b" text-anchor="middle" font-weight="400">地形与高度</text><ellipse cx="848" cy="258" rx="150" ry="113" fill="#fffdf6" stroke="#b7c5bd" stroke-width="2" opacity=".94"/><path d="M767 256 Q848 182 929 256" fill="none" stroke="#d67c65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M767 280 Q848 354 929 280" fill="none" stroke="#387d9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="848" y="249" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#d67c65" text-anchor="middle" font-weight="700">多年温度</text><text x="848" y="291" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#387d9d" text-anchor="middle" font-weight="700">降水及季节性</text><text x="839" y="383" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="29" fill="#243b45" text-anchor="middle" font-weight="700">气候类型</text><path d="M840 312L840 347" fill="none" stroke="#698f77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><path d="M50 547L1050 547" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="587" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#61757b" text-anchor="start" font-weight="400">示意影响路径，未画固定气候带边界；分类需长期温度与降水资料。</text></svg>