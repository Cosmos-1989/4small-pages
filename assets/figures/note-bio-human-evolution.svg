<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc"><title id="title">现生类人猿亲缘与古人群基因交流</title><desc id="desc">人和黑猩猩、倭黑猩猩的共同祖先较近，但没有一种现存猿是人的直接祖先；另有智人与尼安德特人的基因交流简图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="670" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">现生类人猿亲缘与古人群基因交流</text><path d="M340 415L340 500" fill="none" stroke="#294451" stroke-width="3"/><path d="M340 415L430 415" fill="none" stroke="#294451" stroke-width="3"/><path d="M340 500L430 500" fill="none" stroke="#294451" stroke-width="3"/><path d="M260 330L260 457.5" fill="none" stroke="#294451" stroke-width="3"/><path d="M260 330L430 330" fill="none" stroke="#294451" stroke-width="3"/><path d="M260 457.5L340 457.5" fill="none" stroke="#294451" stroke-width="3"/><path d="M180 245L180 393.75" fill="none" stroke="#294451" stroke-width="3"/><path d="M180 245L430 245" fill="none" stroke="#294451" stroke-width="3"/><path d="M180 393.75L260 393.75" fill="none" stroke="#294451" stroke-width="3"/><path d="M100 160L100 319.375" fill="none" stroke="#294451" stroke-width="3"/><path d="M100 160L430 160" fill="none" stroke="#294451" stroke-width="3"/><path d="M100 319.375L180 319.375" fill="none" stroke="#294451" stroke-width="3"/><path d="M60 239.6875L100 239.6875" fill="none" stroke="#294451" stroke-width="3"/><circle cx="430" cy="160" r="5" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="447" y="168" font-size="24" fill="#294451" text-anchor="start">猩猩</text><circle cx="430" cy="245" r="5" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="447" y="253" font-size="24" fill="#294451" text-anchor="start">大猩猩</text><circle cx="430" cy="330" r="5" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="447" y="338" font-size="24" fill="#294451" text-anchor="start">人</text><circle cx="430" cy="415" r="5" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="447" y="423" font-size="24" fill="#294451" text-anchor="start">黑猩猩</text><circle cx="430" cy="500" r="5" fill="#3f7d96" stroke="none" stroke-width="2"/><text x="447" y="508" font-size="24" fill="#294451" text-anchor="start">倭黑猩猩</text><rect x="665" y="167" width="285" height="355" rx="15" fill="#f5eff3" stroke="#d5e0e0" stroke-width="2"/><text x="807" y="219" font-size="24" fill="#92749d" text-anchor="middle" font-weight="600">部分古人群交流</text><text x="807" y="294" font-size="27" fill="#294451" text-anchor="middle">智人</text><text x="807" y="437" font-size="27" fill="#294451" text-anchor="middle">尼安德特人</text><path d="M785 316V389" fill="none" stroke="#92749d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><path d="M830 402V331" fill="none" stroke="#92749d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="806" y="479" font-size="21" fill="#687e83" text-anchor="middle">遗传交流≠直接祖先</text><text x="65" y="590" font-size="27" fill="#294451" text-anchor="start">共同祖先不等于任何一种现存类人猿</text><text x="50" y="644" font-size="20" fill="#687e83" text-anchor="start">枝长不表示分歧年代；右侧只是交流关系，不是完整古人类谱系树。</text></g></svg>