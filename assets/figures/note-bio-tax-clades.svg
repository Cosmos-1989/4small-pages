<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 445" role="img" aria-labelledby="title desc"><title id="title">单系、并系与多系分组</title><desc id="desc">相同树形的三种分组。单系包含全部后代，并系遗漏后代，多系依相似性组合不同支系。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#596f79"/></marker></defs><rect width="1080" height="445" fill="#fffefa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><text x="180" y="43" font-size="27" fill="#5d8e78" text-anchor="middle">单系群</text><text x="180" y="79" font-size="19" fill="#687e83" text-anchor="middle">一个祖先及其全部后代</text><path d="M235 125H295" fill="none" stroke="#5d8e78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="298" cy="125" r="7" fill="#5d8e78" /><text x="317" y="132" font-size="23" fill="#294451" text-anchor="start">甲</text><path d="M235 185H295" fill="none" stroke="#5d8e78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="298" cy="185" r="7" fill="#5d8e78" /><text x="317" y="192" font-size="23" fill="#294451" text-anchor="start">乙</text><path d="M235 245H295" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="298" cy="245" r="7" fill="#b6c0c2" /><text x="317" y="252" font-size="23" fill="#294451" text-anchor="start">丙</text><path d="M235 305H295" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="298" cy="305" r="7" fill="#b6c0c2" /><text x="317" y="312" font-size="23" fill="#294451" text-anchor="start">丁</text><path d="M90 215H135M135 125V305M135 305H235M135 215H185M185 155V245M185 245H235M185 155H235M235 125V185" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M185 155H235M235 125V185" fill="none" stroke="#5d8e78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="235" cy="155" r="6" fill="#5d8e78" /><text x="180" y="355" font-size="18" fill="#687e83" text-anchor="middle">选取的成员以颜色标出</text><text x="540" y="43" font-size="27" fill="#d6ae61" text-anchor="middle">并系群</text><text x="540" y="79" font-size="19" fill="#687e83" text-anchor="middle">包含祖先，遗漏部分后代</text><path d="M595 125H655" fill="none" stroke="#d6ae61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="658" cy="125" r="7" fill="#d6ae61" /><text x="677" y="132" font-size="23" fill="#294451" text-anchor="start">甲</text><path d="M595 185H655" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="658" cy="185" r="7" fill="#b6c0c2" /><text x="677" y="192" font-size="23" fill="#294451" text-anchor="start">乙</text><path d="M595 245H655" fill="none" stroke="#d6ae61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="658" cy="245" r="7" fill="#d6ae61" /><text x="677" y="252" font-size="23" fill="#294451" text-anchor="start">丙</text><path d="M595 305H655" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="658" cy="305" r="7" fill="#b6c0c2" /><text x="677" y="312" font-size="23" fill="#294451" text-anchor="start">丁</text><path d="M450 215H495M495 125V305M495 305H595M495 215H545M545 155V245M545 245H595M545 155H595M595 125V185" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M545 245V155H595M595 125V155M545 245H595" fill="none" stroke="#d6ae61" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="545" cy="200" r="6" fill="#d6ae61" /><path d="M595 155V185" fill="none" stroke="#c1c6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="540" y="355" font-size="18" fill="#687e83" text-anchor="middle">选取的成员以颜色标出</text><text x="900" y="43" font-size="27" fill="#92749d" text-anchor="middle">多系分组</text><text x="900" y="79" font-size="19" fill="#687e83" text-anchor="middle">将不同支系的成员相并</text><path d="M955 125H1015" fill="none" stroke="#92749d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1018" cy="125" r="7" fill="#92749d" /><text x="1037" y="132" font-size="23" fill="#294451" text-anchor="start">甲</text><path d="M955 185H1015" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1018" cy="185" r="7" fill="#b6c0c2" /><text x="1037" y="192" font-size="23" fill="#294451" text-anchor="start">乙</text><path d="M955 245H1015" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1018" cy="245" r="7" fill="#b6c0c2" /><text x="1037" y="252" font-size="23" fill="#294451" text-anchor="start">丙</text><path d="M955 305H1015" fill="none" stroke="#92749d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1018" cy="305" r="7" fill="#92749d" /><text x="1037" y="312" font-size="23" fill="#294451" text-anchor="start">丁</text><path d="M810 215H855M855 125V305M855 305H955M855 215H905M905 155V245M905 245H955M905 155H955M955 125V185" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M970 125C900 125 900 305 970 305" fill="none" stroke="#92749d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="900" y="355" font-size="18" fill="#687e83" text-anchor="middle">选取的成员以颜色标出</text><text x="35" y="410" font-size="21" fill="#687e83" text-anchor="start">三个面板采用同一假想系统树；支长不代表年代或变化量。</text></g></svg>