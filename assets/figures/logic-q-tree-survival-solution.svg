<svg xmlns="http://www.w3.org/2000/svg" width="980" height="805" viewBox="0 0 980 805" role="img" aria-labelledby="title desc"><title id="title">树苗预测的推理参照</title><desc id="desc">四个预测的恰一假约束，经矛盾判断、肯定前件及量词变形得到结论。填空参考只用于答案区。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="805" fill="white"/><rect x="125" y="28" width="730" height="88" rx="11" fill="#eef4f7" stroke="#ccd8de"/><text x="490.0" y="79.0" font-size="23" text-anchor="middle" fill="#2b414d">四人的预测中恰有一个错误</text><path d="M490 119 L490 142" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="146" width="730" height="88" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="490.0" y="181.5" font-size="23" text-anchor="middle" fill="#2b414d">小何与小津的预测相互矛盾</text><text x="490.0" y="212.5" font-size="23" text-anchor="middle" fill="#2b414d">① 不能同真，至少有一假</text><path d="M490 237 L490 260" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="264" width="730" height="88" rx="11" fill="#eef4f7" stroke="#ccd8de"/><text x="490.0" y="299.5" font-size="23" text-anchor="middle" fill="#2b414d">所以小海与小天的预测都正确</text><text x="490.0" y="330.5" font-size="23" text-anchor="middle" fill="#2b414d">小海预测小天的树能成活</text><path d="M490 355 L490 378" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="382" width="730" height="88" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="490.0" y="417.5" font-size="23" text-anchor="middle" fill="#2b414d">结合小天的条件预测</text><text x="490.0" y="448.5" font-size="23" text-anchor="middle" fill="#2b414d">② 肯定前件，肯定后件</text><path d="M490 473 L490 496" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="500" width="730" height="88" rx="11" fill="#eef4f7" stroke="#ccd8de"/><text x="490.0" y="535.5" font-size="23" text-anchor="middle" fill="#2b414d">栽种的树不会有不成活的</text><text x="490.0" y="566.5" font-size="23" text-anchor="middle" fill="#2b414d">③ 四棵树都会成活</text><path d="M490 591 L490 614" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="125" y="618" width="730" height="88" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="490.0" y="669.0" font-size="23" text-anchor="middle" fill="#2b414d">小何预测正确；小津预测错误</text><text x="490" y="771" font-size="20" text-anchor="middle" fill="#2b414d">经典二值逻辑；四个“成活”命题按题设取真或假。</text></svg>