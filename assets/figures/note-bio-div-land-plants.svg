<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 610" role="img" aria-labelledby="title desc"><title id="title">陆生植物主要谱系</title><desc id="desc">苔藓植物与维管植物分支；维管植物包括石松和真叶植物，后者包括蕨类与种子植物；种子植物分为裸子和被子植物。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#596f79"/></marker></defs><rect width="1020" height="610" fill="#fffefa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><path d="M600 375V470" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M600 375H745" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M600 470H745" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 280V422.5" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 280H745" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 422.5H600" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 185V351.25" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 185H745" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 351.25H450" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 90V268.125" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 90H745" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 268.125H300" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 179.0625H150" fill="none" stroke="#596f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="745" cy="90" r="6" fill="#5d8e78" /><text x="767" y="98" font-size="26" fill="#294451" text-anchor="start">苔藓植物</text><circle cx="745" cy="185" r="6" fill="#5d8e78" /><text x="767" y="193" font-size="26" fill="#294451" text-anchor="start">石松类</text><circle cx="745" cy="280" r="6" fill="#5d8e78" /><text x="767" y="288" font-size="26" fill="#294451" text-anchor="start">蕨类</text><circle cx="745" cy="375" r="6" fill="#5d8e78" /><text x="767" y="383" font-size="26" fill="#294451" text-anchor="start">裸子植物</text><circle cx="745" cy="470" r="6" fill="#5d8e78" /><text x="767" y="478" font-size="26" fill="#294451" text-anchor="start">被子植物</text><circle cx="80" cy="179.0625" r="10" fill="#5c8caf" /><text x="80" y="186" font-size="19" fill="white" text-anchor="middle">①</text><circle cx="225" cy="268.125" r="10" fill="#5d8e78" /><text x="225" y="275" font-size="19" fill="white" text-anchor="middle">②</text><circle cx="525" cy="422.5" r="10" fill="#92749d" /><text x="525" y="429" font-size="19" fill="white" text-anchor="middle">③</text><text x="40" y="532" font-size="21" fill="#5c8caf" text-anchor="start">① 陆生植物的胚受母体保护</text><text x="40" y="566" font-size="21" fill="#5d8e78" text-anchor="start">② 维管组织：木质部与韧皮部</text><text x="520" y="532" font-size="21" fill="#92749d" text-anchor="start">③ 花粉、胚珠与种子</text><text x="520" y="566" font-size="19" fill="#687e83" text-anchor="start">枝长无时间含义；省略藻类和灭绝支系。</text></g></svg>