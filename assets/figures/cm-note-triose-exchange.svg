<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc"><title id="title">磷酸丙糖与无机磷酸的跨膜交换</title><desc id="desc">叶绿体内膜的磷酸丙糖／磷酸转运蛋白交换碳同化产物与无机磷酸。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#82969b"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="430" fill="white"/><rect x="40" y="100" width="315" height="120" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="197.5" y="139.0" text-anchor="middle" font-size="22" fill="#2d414b">叶绿体基质</text><text x="197.5" y="168.0" text-anchor="middle" font-size="22" fill="#2d414b">卡尔文循环产物</text><text x="197.5" y="197.0" text-anchor="middle" font-size="22" fill="#2d414b">磷酸丙糖与淀粉</text><rect x="625" y="100" width="315" height="120" rx="10" fill="#f5eee5" stroke="#cbd9dc"/><text x="782.5" y="139.0" text-anchor="middle" font-size="22" fill="#2d414b">细胞质</text><text x="782.5" y="168.0" text-anchor="middle" font-size="22" fill="#2d414b">蔗糖合成</text><text x="782.5" y="197.0" text-anchor="middle" font-size="22" fill="#2d414b">释放无机磷酸</text><path d="M 360 130 L 618 130" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="490" y="112" text-anchor="middle" font-size="21" fill="#2d414b">磷酸丙糖</text><path d="M 620 192 L 365 192" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="490" y="224" text-anchor="middle" font-size="21" fill="#2d414b">无机磷酸 Pi</text><text x="490" y="304" text-anchor="middle" font-size="20" fill="#2d414b">交换发生在叶绿体包膜内膜；箭头表示典型光照下的净流向。</text></svg>