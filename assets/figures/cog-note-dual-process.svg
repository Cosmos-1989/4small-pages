<svg xmlns="http://www.w3.org/2000/svg" width="980" height="505" viewBox="0 0 980 505" role="img" aria-labelledby="title desc"><title id="title">双过程理论的加工区分</title><desc id="desc">将较自主的类型1加工与依赖工作记忆和控制的类型2加工并列，说明两者互动且不保证类型2正确。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="505" fill="white"/><rect x="30" y="95" width="420" height="160" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="240.0" y="151.0" font-size="23" text-anchor="middle" fill="#2b414d">类型1加工</text><text x="240.0" y="182.0" font-size="23" text-anchor="middle" fill="#2b414d">较自主，常不需工作记忆持续控制</text><text x="240.0" y="213.0" font-size="23" text-anchor="middle" fill="#2b414d">可包含熟练反应与启发式</text><rect x="530" y="95" width="420" height="160" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="740.0" y="151.0" font-size="23" text-anchor="middle" fill="#2b414d">类型2加工</text><text x="740.0" y="182.0" font-size="23" text-anchor="middle" fill="#2b414d">依赖工作记忆与认知控制</text><text x="740.0" y="213.0" font-size="23" text-anchor="middle" fill="#2b414d">支持假设检验与多步推理</text><path d="M466 157 L514 157" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M514 201 L466 201" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="160" y="325" width="660" height="90" rx="11" fill="#f8f2e8" stroke="#ccd8de"/><text x="490.0" y="377.0" font-size="24" text-anchor="middle" fill="#2b414d">经验、知识、任务与动机共同影响表现</text><text x="490" y="474" font-size="20" text-anchor="middle" fill="#2b414d">分类描述加工特征；不对应两个独立脑区，也不等于“一错一对”。</text></svg>