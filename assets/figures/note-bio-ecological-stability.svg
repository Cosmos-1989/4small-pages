end="url(#a-283e49)"/><g transform="translate(48 320) rotate(-90)"><text x="0" y="0" font-size="25" fill="#283e49" text-anchor="middle" font-weight="400">系统功能相对参照水平</text></g><text x="520" y="556" font-size="26" fill="#283e49" text-anchor="middle" font-weight="400">时间 →</text><path d="M125 180H895" stroke="#72838a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><text x="870" y="158" font-size="23" fill="#72838a" text-anchor="start" font-weight="400">参照</text><rect x="292" y="119" width="43" height="386" rx="0" fill="#f4e3d6" stroke="none"/><text x="313" y="101" font-size="24" fill="#b88d48" text-anchor="middle" font-weight="400">扰动</text><path d="M130 180H292L335 295C430 282 580 212 850 183" stroke="#467e99" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 180H292L335 445C391 400 438 240 525 192C573 177 650 180 850 180" stroke="#568976" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="320" font-size="24" fill="#467e99" text-anchor="start" font-weight="400">下降较小，恢复较慢</text><text x="400" y="427" font-size="24" fill="#568976" text-anchor="start" font-weight="400">下降较大，恢复较快</text><path d="M362 181V292" stroke="#467e99" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M361 181H380M361 292H380" stroke="#467e99" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="620" font-size="23" fill="#72838a" text-anchor="start" font-weight="400">抵抗、恢复与长期时间波动是不同维度，需分别测量。</text></g></svg>