<svg xmlns="http://www.w3.org/2000/svg" width="980" height="585" viewBox="0 0 980 585" role="img" aria-labelledby="title desc">
<title id="title">贸易差额的互斥分组加总</title><desc id="desc">假设伙伴组甲顺差25、伙伴组乙顺差15、其余伙伴逆差10，总顺差30。瀑布图的纵轴为价值单位，从零开始。中间条表示差额对累计值的增减，全部伙伴条由零开始。全部数值均为教学假设，非实测数据。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="585" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="80" y="43" font-size="27" text-anchor="start" fill="#253e48">按互斥伙伴组分解贸易差额</text><text x="80" y="83" font-size="22" text-anchor="start" fill="#5f747d">价值单位（假设）</text><line x1="100" y1="400" x2="910" y2="400" stroke="#253e48" stroke-width="1.8"/><text x="85" y="407" font-size="21" text-anchor="end" fill="#5f747d">0</text><line x1="100" y1="340" x2="910" y2="340" stroke="#e4ebee" stroke-width="1"/><text x="85" y="347" font-size="21" text-anchor="end" fill="#5f747d">10</text><line x1="100" y1="280" x2="910" y2="280" stroke="#e4ebee" stroke-width="1"/><text x="85" y="287" font-size="21" text-anchor="end" fill="#5f747d">20</text><line x1="100" y1="220" x2="910" y2="220" stroke="#e4ebee" stroke-width="1"/><text x="85" y="227" font-size="21" text-anchor="end" fill="#5f747d">30</text><line x1="100" y1="160" x2="910" y2="160" stroke="#e4ebee" stroke-width="1"/><text x="85" y="167" font-size="21" text-anchor="end" fill="#5f747d">40</text><line x1="100" y1="140" x2="100" y2="400" stroke="#253e48" stroke-width="1.8"/><rect x="150" y="250" width="110" height="150" rx="0" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="205" y="233" font-size="27" text-anchor="middle" fill="#253e48">＋25</text><text x="205" y="440" font-size="23" text-anchor="middle" fill="#253e48">伙伴组甲</text><rect x="350" y="160" width="110" height="90" rx="0" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="405" y="143" font-size="27" text-anchor="middle" fill="#253e48">＋15</text><text x="405" y="440" font-size="23" text-anchor="middle" fill="#253e48">伙伴组乙</text><rect x="550" y="160" width="110" height="60" rx="0" fill="#f5e8e2" stroke="#c9d7db" stroke-width="1.3"/><text x="605" y="143" font-size="27" text-anchor="middle" fill="#b56c52">－10</text><text x="605" y="440" font-size="23" text-anchor="middle" fill="#253e48">其余伙伴</text><rect x="750" y="220" width="110" height="180" rx="0" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="805" y="203" font-size="27" text-anchor="middle" fill="#253e48">30</text><text x="805" y="440" font-size="23" text-anchor="middle" fill="#253e48">全部伙伴</text><line x1="260" y1="250" x2="350" y2="250" stroke="#5f747d" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="460" y1="160" x2="550" y2="160" stroke="#5f747d" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="660" y1="220" x2="750" y2="220" stroke="#5f747d" stroke-width="1.8" stroke-dasharray="5 4"/><text x="490" y="505" font-size="27" text-anchor="middle" fill="#253e48">总差额＝25＋15－10＝30</text><text x="490" y="549" font-size="22" text-anchor="middle" fill="#5f747d">分组互斥且覆盖整体；差额变化不能单独确定出口或进口变化。</text>
</g></svg>
