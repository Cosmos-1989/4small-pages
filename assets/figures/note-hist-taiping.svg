<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">宗教、制度与战争</title><desc id="desc">宗教、制度与战争；宗教动员：拜上帝会、宗教与反清结合、王权及严格纪律；制度与执行：土地平均分配理想、赋税与地方治理、《资政新篇》改革；战争后果：围城、饥饿与疫病、人口迁徙和暴力、地方军事财政扩张</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">宗教、制度与战争</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">宗教动员</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">拜上帝会</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">宗教与反清结合</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">王权及严格纪律</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">制度与执行</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">土地平均分配理想</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">赋税与地方治理</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">《资政新篇》改革</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">战争后果</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">围城、饥饿与疫病</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">人口迁徙和暴力</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地方军事财政扩张</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">纲领不等于执行；后果来自战争及治理，栏宽不表示规模或数量。</text></g></svg>