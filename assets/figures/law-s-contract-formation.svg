<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">合同成立、效力与履行</title><desc id="desc">三组问题分别对应合意、法律拘束力与具体义务完成状态，不能互相替代。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="1000" height="480" fill="#fff"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="42" y="42" font-size="27" text-anchor="start" fill="#293f47" font-weight="bold">合同分析的三个问题</text><rect x="42" y="88" width="268" height="182" rx="12" fill="#edf5f5" stroke="#a6bfc3" stroke-width="1.6"/><text x="176" y="132" font-size="30" text-anchor="middle" fill="#293f47" font-weight="bold">成立</text><text x="176" y="183" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">是否已达成合意？</text><text x="176" y="218" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">形式、承诺与接受履行</text><rect x="366" y="88" width="268" height="182" rx="12" fill="#f0f3e9" stroke="#a6bfc3" stroke-width="1.6"/><text x="500" y="132" font-size="30" text-anchor="middle" fill="#293f47" font-weight="bold">效力</text><text x="500" y="183" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">是否有法律拘束力？</text><text x="500" y="218" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">能力、真实意思与合法性</text><rect x="690" y="88" width="268" height="182" rx="12" fill="#fbf2e3" stroke="#a6bfc3" stroke-width="1.6"/><text x="824" y="132" font-size="30" text-anchor="middle" fill="#293f47" font-weight="bold">履行</text><text x="824" y="183" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">是否依约完成义务？</text><text x="824" y="218" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">期限、质量、通知与协助</text><path d="M313 178H355" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M638 178H679" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="42" y="312" width="916" height="94" rx="12" fill="#f6f4f5" stroke="#c5b9c0" stroke-width="1.6"/><text x="500" y="351" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">已成立不等于当然有效；未完成签字也不等于合同必不成立。</text><text x="500" y="385" font-size="21" text-anchor="middle" fill="#60757b" font-weight="normal">物权登记、批准等特殊要求仍须依具体制度另行判断。</text><text x="42" y="453" font-size="19" text-anchor="start" fill="#60757b" font-weight="normal">箭头表示分析联系；不是所有合同均须遵循同一种形式程序。</text></g></svg>