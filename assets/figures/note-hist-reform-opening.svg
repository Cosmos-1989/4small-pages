<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">改革开放时期的主要节点</title><desc id="desc">改革开放时期的主要节点；1978年：政策重心转向经济建设；1980年代初：农村改革与经济特区；1980年代：城市与企业改革；1989年：抗议与军队镇压；1992年后：市场经济改革加速；2001年12月：加入世界贸易组织</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">改革开放时期的主要节点</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1978年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">政策重心转向经济建设</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">思想讨论、纠错和地方探索相互推动</text><circle cx="253" cy="197.0" r="9" fill="#5b8b79"/><text x="224" y="205.0" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1980年代初</text><text x="285" y="205.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">农村改革与经济特区</text><text x="285" y="236.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">家庭承包、乡镇企业及对外开放</text><circle cx="253" cy="283.0" r="9" fill="#886b95"/><text x="224" y="291.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1980年代</text><text x="285" y="291.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">城市与企业改革</text><text x="285" y="322.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">企业自主权和价格机制逐渐调整</text><circle cx="253" cy="369.0" r="9" fill="#b68b4d"/><text x="224" y="377.0" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1989年</text><text x="285" y="377.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">抗议与军队镇压</text><text x="285" y="408.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">政治危机影响国内政策和对外关系</text><circle cx="253" cy="455.0" r="9" fill="#b76759"/><text x="224" y="463.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1992年后</text><text x="285" y="463.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">市场经济改革加速</text><text x="285" y="494.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">财税、金融、国企及保障制度调整</text><circle cx="253" cy="541.0" r="9" fill="#42788f"/><text x="224" y="549.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">2001年12月</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">加入世界贸易组织</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">贸易规则、市场准入和国际分工变化</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>