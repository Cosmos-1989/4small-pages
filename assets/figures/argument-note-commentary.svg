<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" role="img" aria-labelledby="title desc"><title id="title">短评段落中的判断、证据与解释</title><desc id="desc">判断、材料和解释是论证功能，不是强制段落数量或模板。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="490" fill="white"/><rect x="85" y="32" width="810" height="85" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="490.0" y="67.0" font-size="23" text-anchor="middle" fill="#2d414b">集中判断</text><text x="490.0" y="98.0" font-size="23" text-anchor="middle" fill="#2d414b">回应一个明确的问题</text><path d="M490 123 L490 155" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="85" y="165" width="810" height="85" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="490.0" y="200.0" font-size="23" text-anchor="middle" fill="#2d414b">相关材料</text><text x="490.0" y="231.0" font-size="23" text-anchor="middle" fill="#2d414b">只选择承担证明任务的事实</text><path d="M490 256 L490 288" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="85" y="298" width="810" height="85" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="490.0" y="333.0" font-size="23" text-anchor="middle" fill="#2d414b">连接理由</text><text x="490.0" y="364.0" font-size="23" text-anchor="middle" fill="#2d414b">说明材料为何支持判断及其条件</text><text x="490" y="450" font-size="22" text-anchor="middle" fill="#2d414b">按论证功能组织文字；不规定必须三段或固定句数。</text></svg>