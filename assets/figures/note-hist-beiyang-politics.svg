<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">政治权力与社会资源</title><desc id="desc">政治权力与社会资源；北京政府：外交承认与条约、议会、内阁和法律、中央财政与外债；区域军政集团：军队及地方税收、竞争、结盟与交易、行政建设存在差异；社会组织：商会、工会和学校、报刊与公共讨论、抗议及地方动员</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">政治权力与社会资源</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">北京政府</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">外交承认与条约</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">议会、内阁和法律</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">中央财政与外债</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">区域军政集团</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军队及地方税收</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">竞争、结盟与交易</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">行政建设存在差异</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">社会组织</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">商会、工会和学校</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">报刊与公共讨论</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">抗议及地方动员</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">各方相互制约；此图不是机构隶属图，也不表示全国各地的同一状态。</text></g></svg>