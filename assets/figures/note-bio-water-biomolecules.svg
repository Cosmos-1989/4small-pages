<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">水的极性和氢键</title><desc id="d">每个水分子为弯曲构型；实线表示分子内O—H共价键，虚线连接不同分子的O与H以表示氢键。</desc><defs><marker id="a28434b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#28434b"/></marker><marker id="a467d9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#467d9b"/></marker><marker id="a548c7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#548c7d"/></marker><marker id="ab18a4d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b18a4d"/></marker><marker id="a8b709d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#8b709d"/></marker><marker id="abd7067" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#bd7067"/></marker><marker id="a637780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#637780"/></marker></defs><rect width="1000" height="650" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="55" y="58" font-size="30" fill="#28434b" text-anchor="start">部分电荷使水分子形成动态相互作用</text><path d="M400 325L340.69828196921173 279.0837039974163" fill="none" stroke="#b8b9b2" stroke-width="10"/><path d="M400 325L459.30171803078827 279.0837039974163" fill="none" stroke="#b8b9b2" stroke-width="10"/><circle cx="400" cy="325" r="28" fill="#bd7067" stroke="none" stroke-width="2"/><text x="400" y="333" font-size="25" fill="white" text-anchor="middle">O</text><text x="365" y="373" font-size="23" fill="