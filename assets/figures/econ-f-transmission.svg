<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="610" viewBox="0 0 1140 610" role="img" aria-labelledby="title desc">
<title id="title">货币政策影响实体经济的渠道</title><desc id="desc">央行操作与沟通可通过利率融资成本、资产负债表、汇率与预期渠道影响支出，再影响产出、就业与一般价格。强度、方向与时滞依条件而定。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#36758a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family='"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif'><rect x="30" y="195" width="190" height="130" rx="8" fill="#eef4f6" stroke="#cad5d9" stroke-width="1.3"/><text x="125" y="240" font-size="26" text-anchor="middle" fill="#253f49" font-weight="normal">央行操作</text><text x="125" y="277" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">与政策沟通</text><rect x="290" y="40" width="280" height="120" rx="8" fill="#faf9f5" stroke="#cad5d9" stroke-width="1.3"/><text x="430" y="86" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">利率与融资成本</text><text x="430" y="125" font-size="21" text-anchor="middle" fill="#253f49" font-weight="normal">借款、储蓄与信用</text><path d="M220,260 C260,260 260,100 285,100" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M570,100 C620,100 620,260 665,260" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="290" y="210" width="280" height="120" rx="8" fill="#faf9f5" stroke="#cad5d9" stroke-width="1.3"/><text x="430" y="256" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">资产与资产负债表</text><text x="430" y="295" font-size="21" text-anchor="middle" fill="#253f49" font-weight="normal">估值、抵押与风险</text><path d="M220,260 C260,260 260,270 285,270" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M570,270 C620,270 620,260 665,260" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="290" y="380" width="280" height="120" rx="8" fill="#faf9f5" stroke="#cad5d9" stroke-width="1.3"/><text x="430" y="426" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">汇率与预期</text><text x="430" y="465" font-size="21" text-anchor="middle" fill="#253f49" font-weight="normal">相对价格与行为</text><path d="M220,260 C260,260 260,440 285,440" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><path d="M570,440 C620,440 620,260 665,260" fill="none" stroke="#36758a" stroke-width="2.1" marker-end="url(#arrow)"/><rect x="675" y="195" width="190" height="130" rx="8" fill="#edf3ee" stroke="#cad5d9" stroke-width="1.3"/><text x="770" y="242" font-size="25" text-anchor="middle" fill="#253f49" font-weight="normal">消费与投资</text><text x="770" y="282" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">等支出决策</text><path d="M865,260 L915,260" fill="none" stroke="#36758a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="925" y="195" width="180" height="130" rx="8" fill="#f5eeeb" stroke="#cad5d9" stroke-width="1.3"/><text x="1015" y="240" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">产出与就业</text><text x="1015" y="279" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">一般价格</text><text x="610" y="544" font-size="21" text-anchor="middle" fill="#253f49" font-weight="normal">传导受风险、需求、供给约束及制度条件影响。</text><text x="610" y="581" font-size="21" text-anchor="middle" fill="#253f49" font-weight="normal">效果有时滞，图中箭头不表示必然或等量变化。</text></g></svg>