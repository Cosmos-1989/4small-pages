roke-linecap="round" stroke-linejoin="round" marker-end="url(#abd6b68)"/><text x="485" y="370" font-size="19" text-anchor="middle" fill="#bd6b68">肾小管周围毛细血管</text><path d="M142 167V212H268V275Q268 318 311 318Q352 318 352 275V212H497V285H589V413" fill="none" stroke="#587f9e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 172V194" fill="none" stroke="#587f9e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a587f9e)"/><text x="80" y="207" font-size="19" text-anchor="middle" fill="#587f9e">滤过</text><path d="M142 141V161" fill="none" stroke="#587f9e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a587f9e)"/><text x="218" y="190" font-size="18" text-anchor="middle" fill="#354c59">近端</text><text x="311" y="277" font-size="18" text-anchor="middle" fill="#354c59">髓袢</text><text x="441" y="190" font-size="18" text-anchor="middle" fill="#354c59">远端</text><text x="650" y="296" font-size="18" text-anchor="middle" fill="#354c59">集合管</text><path d="M226 220V344" fill="none" stroke="#528d85" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a528d85)"/><text x="197" y="277" font-size="18" text-anchor="end" fill="#528d85">重吸收</text><path d="M426 344V221" fill="none" stroke="#94749e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94749e)"/><text x="447" y="280" font-size="18" text-anchor="start" fill="#94749e">分泌</text><path d="M589 374V429" fill="none" stroke="#587f9e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a587f9e)"/><text x="595" y="458" font-size="19" text-anchor="middle" fill="#354c59">至肾盂和输尿管</text><text x="294" y="420" font-size="18" text-anchor="middle" fill="#587f9e">蓝色粗线：管腔路径</text></g></svg>