<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">长期并用的货币形态</title><desc id="desc">长期并用的货币形态；铜钱：铸造与钱重、日常小额交换、流通及银钱比价；白银：重量与成色、税收及较大交易、全球流动与汇兑；纸币：发行及接受制度、兑换或财政支持、信用与物价变化</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">长期并用的货币形态</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">铜钱</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">铸造与钱重</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">日常小额交换</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">流通及银钱比价</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">白银</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">重量与成色</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">税收及较大交易</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">全球流动与汇兑</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">纸币</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">发行及接受制度</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">兑换或财政支持</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">信用与物价变化</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">各栏概括主要特征；具体用途随时期和地区而变。</text></g></svg>