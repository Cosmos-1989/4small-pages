<svg xmlns="http://www.w3.org/2000/svg" width="980" height="399" viewBox="0 0 980 399" role="img" aria-labelledby="title desc"><title id="title">连接结构改变与系统连通性的变化</title><desc id="desc">两个三角形通过一条桥接边连接。删去该边后，顶点数量不变，边数由七到六，连通分量由一变二；删去其他冗余边则未必断开整体。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="399" fill="white"/><text x="245" y="36" font-size="25" fill="#577991" text-anchor="middle" font-weight="600">保留桥接边</text><text x="735" y="36" font-size="25" fill="#956e81" text-anchor="middle" font-weight="600">仅删去桥接边</text><path d="M70 110 L70 235" fill="none" stroke="#71858e" stroke-width="2"/><path d="M70 235 L200 174" fill="none" stroke="#71858e" stroke-width="2"/><path d="M200 174 L70 110" fill="none" stroke="#71858e" stroke-width="2"/><path d="M290 174 L420 110" fill="none" stroke="#71858e" stroke-width="2"/><path d="M420 110 L420 235" fill="none" stroke="#71858e" stroke-width="2"/><path d="M420 235 L290 174" fill="none" stroke="#71858e" stroke-width="2"/><path d="M200 174 L290 174" fill="none" stroke="#a37b4c" stroke-width="2"/><circle cx="70" cy="110" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="70" y="117" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">A</text><circle cx="70" cy="235" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="70" y="242" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">B</text><circle cx="200" cy="174" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="200" y="181" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">C</text><circle cx="290" cy="174" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="290" y="181" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">D</text><circle cx="420" cy="110" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="420" y="117" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">E</text><circle cx="420" cy="235" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="420" y="242" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">F</text><text x="245" y="291" font-size="19" fill="#273c48" text-anchor="middle" font-weight="400">6个顶点，7条边，1个连通分量</text><path d="M560 110 L560 235" fill="none" stroke="#71858e" stroke-width="2"/><path d="M560 235 L690 174" fill="none" stroke="#71858e" stroke-width="2"/><path d="M690 174 L560 110" fill="none" stroke="#71858e" stroke-width="2"/><path d="M780 174 L910 110" fill="none" stroke="#71858e" stroke-width="2"/><path d="M910 110 L910 235" fill="none" stroke="#71858e" stroke-width="2"/><path d="M910 235 L780 174" fill="none" stroke="#71858e" stroke-width="2"/><text x="735" y="174" font-size="24" fill="#956e81" text-anchor="middle" font-weight="400">×</text><circle cx="560" cy="110" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="560" y="117" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">A</text><circle cx="560" cy="235" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="560" y="242" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">B</text><circle cx="690" cy="174" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="690" y="181" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">C</text><circle cx="780" cy="174" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="780" y="181" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">D</text><circle cx="910" cy="110" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="910" y="117" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">E</text><circle cx="910" cy="235" r="18" fill="white" stroke="#577991" stroke-width="2"/><text x="910" y="242" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">F</text><text x="735" y="291" font-size="19" fill="#273c48" text-anchor="middle" font-weight="400">6个顶点，6条边，2个连通分量</text><path d="M490 53 L490 306" fill="none" stroke="#71858e" stroke-width="2" stroke-dasharray="6 5"/><text x="490" y="341" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">连通性取决于结构：删去环上的冗余边，未必使整体断开。</text><text x="490" y="371" font-size="19" fill="#273c48" text-anchor="middle" font-weight="400">这是有限图的类比示例，不是所有量变都会引起质变的经验定律。</text></svg>