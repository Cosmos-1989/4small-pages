<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">隋代运输与国家动员</title><desc id="desc">产粮区通过运河和自然河道连接洛阳及北方；州县组织征发和运粮。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="63" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">隋代运输与国家动员</text><rect x="60" y="145" width="238" height="132" rx="16" fill="#eef3e9" stroke="#d3dddc" stroke-width="1.5"/><text x="179.0" y="183" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">江南等产粮区</text><text x="179.0" y="224" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">粮食与物资</text><rect x="380" y="145" width="239" height="132" rx="16" fill="#eaf2f4" stroke="#d3dddc" stroke-width="1.5"/><text x="499.5" y="183" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">运河与自然水道</text><text x="499.5" y="224" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">转运、航运、维护</text><rect x="701" y="145" width="238" height="132" rx="16" fill="#f2edf5" stroke="#d3dddc" stroke-width="1.5"/><text x="820.0" y="183" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">洛阳与北方</text><text x="820.0" y="224" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">都城供应、军事需求</text><path d="M300 211H365" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M621 211H686" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="335" y="385" width="330" height="112" rx="16" fill="#f5eee2" stroke="#d3dddc" stroke-width="1.5"/><text x="500.0" y="423" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">州县与征发管理</text><text x="500.0" y="464" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">赋役、工程及运粮组织</text><path d="M500 383V292" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="500" y="327" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">组织与负担</text><text x="60" y="568" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">关系示意；不表示实际河道、河长或运输量。</text></g></svg>