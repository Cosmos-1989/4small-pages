<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">合作、北伐与分裂</title><desc id="desc">合作、北伐与分裂；1924年：第一次国共合作；1925年：五卅运动与省港大罢工；1926年：北伐战争开始；1927年：清党与合作破裂；1928年：东北易帜</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">合作、北伐与分裂</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1924年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">第一次国共合作</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">共产党党员以个人身份加入国民党</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1925年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">五卅运动与省港大罢工</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">群众运动扩大政治参与</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1926年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">北伐战争开始</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">军队行动与地方社会动员相互配合</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1927年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">清党与合作破裂</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">上海和武汉相继发生政治分裂与镇压</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1928年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">东北易帜</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">形式上的统一仍保留区域军权</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>