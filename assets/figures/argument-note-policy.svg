<svg xmlns="http://www.w3.org/2000/svg" width="980" height="530" viewBox="0 0 980 530" role="img" aria-labelledby="title desc"><title id="title">政策行动与预期结果之间的条件</title><desc id="desc">投入、产出与结果不同。虚线表示机制成立的条件须验证；不是已经估计的因果效应。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="530" fill="white"/><rect x="20" y="90" width="290" height="112" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="165.0" y="138.5" font-size="23" text-anchor="middle" fill="#2d414b">投入与行动</text><text x="165.0" y="169.5" font-size="23" text-anchor="middle" fill="#2d414b">人员、资金、规则</text><rect x="345" y="90" width="290" height="112" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="490.0" y="138.5" font-size="23" text-anchor="middle" fill="#2d414b">直接产出</text><text x="490.0" y="169.5" font-size="23" text-anchor="middle" fill="#2d414b">设施、服务、执法</text><rect x="670" y="90" width="290" height="112" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="815.0" y="138.5" font-size="23" text-anchor="middle" fill="#2d414b">预期结果</text><text x="815.0" y="169.5" font-size="23" text-anchor="middle" fill="#2d414b">可及性、行为、风险</text><path d="M317 146 L338 146" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M642 146 L663 146" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="182" y="296" width="616" height="85" rx="10" fill="#f8f2e9" stroke="#d1dde2"/><text x="490.0" y="331.0" font-size="23" text-anchor="middle" fill="#2d414b">作用条件与替代解释</text><text x="490.0" y="362.0" font-size="23" text-anchor="middle" fill="#2d414b">需求、执行、其他措施、外部环境</text><path d="M490 287 L165 210" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M490 287 L490 210" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M490 287 L815 210" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="490" y="450" font-size="22" text-anchor="middle" fill="#2d414b">比较备选方案的成本、公平、风险与可行性。</text><text x="490" y="490" font-size="21" text-anchor="middle" fill="#2d414b">预期作用路径仍须经验检验，结果也用于后续调整。</text></svg>