<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">战国改革中的人口与资源动员</title><desc id="desc">战国改革中的人口与资源动员；户籍与土地：记录人口和资源；赋税与兵役：征发粮钱及劳力；仓储与运输：集中调配与供给；军政组织：战争及行政动员</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="520" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="65" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">战国改革中的人口与资源动员</text><rect x="55.0" y="205" width="188.5" height="146" rx="18" fill="#eaf2f4" stroke="#c9d8d8" stroke-width="2"/><text x="149.25" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">户籍与土地</text><text x="149.25" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">记录人口和资源</text><path d="M247.5 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="277.5" y="205" width="188.5" height="146" rx="18" fill="#eef3e9" stroke="#c9d8d8" stroke-width="2"/><text x="371.75" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">赋税与兵役</text><text x="371.75" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">征发粮钱及劳力</text><path d="M470.0 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="500.0" y="205" width="188.5" height="146" rx="18" fill="#f2edf5" stroke="#c9d8d8" stroke-width="2"/><text x="594.25" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">仓储与运输</text><text x="594.25" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">集中调配与供给</text><path d="M692.5 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="722.5" y="205" width="188.5" height="146" rx="18" fill="#f5eee2" stroke="#c9d8d8" stroke-width="2"/><text x="816.75" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">军政组织</text><text x="816.75" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">战争及行政动员</text><text x="60" y="442" font-size="19" fill="#63747a" text-anchor="start" font-weight="400">箭头仅表示组织联系；动员同时带来家庭负担和行政成本。</text></g></svg>