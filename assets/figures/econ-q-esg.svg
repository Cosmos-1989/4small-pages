<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515"><title>ESG投入与企业经营效益</title><desc>依题中定性曲线表示；横轴合并标注时间与ESG投入，不能从曲线识别单位投入回报或具体作用机制。</desc><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#294752"/></marker></defs><g font-family="&quot;Songti SC&quot;, &quot;STSong&quot;, &quot;SimSun&quot;, serif"><text x="450" y="38" text-anchor="middle" font-size="27" fill="#294752">ESG投入与企业经营效益</text><path d="M105,340L820,340" fill="none" stroke="#294752" stroke-width="2" marker-end="url(#a)"/><path d="M105,435L105,85" fill="none" stroke="#294752" stroke-width="2" marker-end="url(#a)"/><path d="M107,340 C170,380 235,385 300,335 S420,165 550,148 S680,143 735,149" fill="none" stroke="#347d91" stroke-width="3.2" /><text x="83" y="369" text-anchor="middle" font-size="19" fill="#294752">O</text><text x="106" y="70" text-anchor="start" font-size="22" fill="#294752">企业经营效益</text><text x="810" y="394" text-anchor="end" font-size="22" fill="#294752">时间、ESG投入</text><text x="450" y="485" text-anchor="middle" font-size="21" fill="#294752">横轴未给出时间与投入的对应关系；曲线无数量刻度</text></g></svg>