<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">甲骨占卜记录的三个证据层次</title><desc id="desc">甲骨占卜记录的三个证据层次；物质载体：龟甲兽骨及灼裂；文字记录：占问、占断与验证；历史解释：日期、人名与事件</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="520" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="65" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">甲骨占卜记录的三个证据层次</text><rect x="55.0" y="205" width="262.6666666666667" height="146" rx="18" fill="#eaf2f4" stroke="#c9d8d8" stroke-width="2"/><text x="186.33333333333334" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">物质载体</text><text x="186.33333333333334" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">龟甲兽骨及灼裂</text><path d="M321.6666666666667 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="351.6666666666667" y="205" width="262.6666666666667" height="146" rx="18" fill="#eef3e9" stroke="#c9d8d8" stroke-width="2"/><text x="483.0" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">文字记录</text><text x="483.0" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">占问、占断与验证</text><path d="M618.3333333333334 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="648.3333333333334" y="205" width="262.6666666666667" height="146" rx="18" fill="#f2edf5" stroke="#c9d8d8" stroke-width="2"/><text x="779.6666666666667" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">历史解释</text><text x="779.6666666666667" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">日期、人名与事件</text><text x="60" y="442" font-size="19" fill="#63747a" text-anchor="start" font-weight="400">占问不等于事件已经发生；须核对验证辞、出土背景及释读。</text></