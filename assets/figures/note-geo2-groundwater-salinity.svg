<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：地下水水头与灌溉盐分去向</title><desc id="desc">地下水由高水力水头向低水头流动；灌溉淋洗可把土壤盐分带向地下水，若缺少排水出口仍可能积盐。</desc><defs>
