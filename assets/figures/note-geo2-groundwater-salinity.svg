,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >水头较高</text><line x1="841" y1="342" x2="918" y2="161" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="841" cy="342" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="924" y="165" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >水头较低</text><line x1="497" y1="328" x2="578" y2="166" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="497" cy="328" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="584" y="170" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >灌溉淋洗可携盐下渗</text><line x1="937" y1="401" x2="781" y2="445" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="937" cy="401" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="605" y="452" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >含盐水需有排水出口</text><text x="320" y="420" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#23627d" font-weight="400" text-anchor="start" >地下水由高水头向低水头运动</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >水位变化不等于完整水头图；箭头不表示流速或盐度实测值。</text></svg>