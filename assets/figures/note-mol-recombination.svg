<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">同源染色单体交叉互换</title><desc id="desc">两条非姐妹染色单体由A-B和a-b组合，在两位点之间交换后成为A-b和a-B。</desc><defs><marker id="arrb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#347b94"/></marker><marker id="arrc" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d5735f"/></marker><marker id="arrm" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#5c7280"/></marker></defs><rect width="1000" height="600" fill="#fffdfa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="112" y="70" text-anchor="start" font-size="28" fill="#263f4a" font-weight="bold" >交换前</text><text x="455" y="70" text-anchor="start" font-size="28" fill="#263f4a" font-weight="bold" >减数分裂前期Ⅰ</text><text x="797" y="70" text-anchor="start" font-size="28" fill="#263f4a" font-weight="bold" >一次交换后</text><line x1="71" y1="203" x2="296" y2="203" stroke="#d5735f" stroke-width="13" stroke-linecap="round"  /><line x1="71" y1="325" x2="296" y2="325" stroke="#347b94" stroke-width="13" stroke-linecap="round"  /><text x="115" y="181" text-anchor="middle" font-size="25" fill="#d5735f" font-weight="bold" >A</text><text x="249" y="181" text-anchor="middle" font-size="25" fill="#d5735f" font-weight="bold" >B</text><text x="115" y="367" text-anchor="middle" font-size="25" fill="#347b94" font-weight="bold" >a</text><text x="249" y="367" text-anchor="middle" font-size="25" fill="#347b94" font-weight="bold" >b</text><path d="M374 203L468 203Q502 203 537 264T648 325" fill="none" stroke="#d5735f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M374 325L468 325Q502 325 537 264T648 203" 