          <marker id="arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#d67c65"/></marker>
          <marker id="arr-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#e7af58"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#698f77"/></marker>
          <marker id="arr-earth" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#ab977b"/></marker>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6fbfc"/><stop offset="1" stop-color="#e9f4f5"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f0f1"/><stop offset="1" stop-color="#9fced4"/></linearGradient>
          <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ddc8"/><stop offset="1" stop-color="#c8b08f"/></linearGradient>
