<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">地表能量交换</title><desc id="desc">白天太阳短波进入并部分反射；地表与大气交换长波辐射、感热和潜热，且与地下交换热量。</desc><defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#387d9d"/></marker>
