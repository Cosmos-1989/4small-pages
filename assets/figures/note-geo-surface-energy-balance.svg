d="M690 432 C690 351 698 274 710 211" fill="none" stroke="#387d9d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M819 433 C828 353 830 275 832 218" fill="none" stroke="#d67c65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-warm)"/><path d="M940 450 C937 467 934 484 935 507" fill="none" stroke="#ab977b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-earth)"/><text x="150" y="310" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#243b45" text-anchor="start" font-weight="400">太阳短波</text><text x="302" y="262" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="20" fill="#243b45" text-anchor="start" font-weight="400">反射</text><text x="422" y="140" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#d67c65" text-anchor="start" font-weight="400">大气向下长波</text><text x="534" y="164" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="20" fill="#2c5877" text-anchor="start" font-weight="400">地表向上长波</text><text x="678" y="189" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#387d9d" text-anchor="start" font-weight="700">潜热</text><text x="785" y="190" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#d67c65" text-anchor="start" font-weight="700">感热</text><text x="916" y="407" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#ab977b" text-anchor="middle" font-weight="400">地中热</text><path d="M50 547L1050 547" fill="none" stroke="#d8e3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="587" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#61757b" text-anchor="start" font-weight="400">箭头表示所画情境的通量方向，长短与粗细均不表示通量大小。</text></svg>