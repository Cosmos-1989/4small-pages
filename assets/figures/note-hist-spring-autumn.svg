<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">东周时期的两类盟誓</title><desc id="desc">东周时期的两类盟誓；诸国之间的会盟：诸侯与盟国参与、军事援助及政治承诺、共同秩序与强国利益、会盟内容因时因事而变；统治集团内部的盟誓：主盟者与参加者、忠诚约束和家族斗争、誓辞诉诸神灵与惩罚、侯马、温县盟书为证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">东周时期的两类盟誓</text><rect x="60.0" y="108" width="420.0" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">诸国之间的会盟</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">诸侯与盟国参与</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军事援助及政治承诺</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">共同秩序与强国利益</text><text x="82.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">会盟内容因时因事而变</text><rect x="500.0" y="108" width="420.0" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="522.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">统治集团内部的盟誓</text><text x="522.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">主盟者与参加者</text><text x="522.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">忠诚约束和家族斗争</text><text x="522.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">誓辞诉诸神灵与惩罚</text><text x="522.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">侯马、温县盟书为证</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">相关材料涉及春秋晚期至战国早期；盟书主持者、年代及释读仍有讨论。</text></g></svg>