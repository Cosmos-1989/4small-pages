<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：峡谷聚落选址与来风侧林带</title><desc id="desc">峡谷聚落须兼顾取水、洪水和坡面风险；若林带位于来风侧，可减少近地面风对房屋的直接影响。</desc><defs>
