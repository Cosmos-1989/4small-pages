<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" role="img" aria-labelledby="title desc"><title id="title">秦代县廷联系</title><desc id="desc">县廷在上级郡府与乡里间传递命令报告，管理司法仓储邮传及税役；非完整官署复原。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="615" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">秦代县廷的文书与资源联系</text><rect x="355" y="108" width="290" height="113" rx="16" fill="#edf4f5" stroke="#cedcdb" stroke-width="1.5"/><text x="500.0" y="147" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">上级郡府</text><text x="500.0" y="185" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">命令、考核及资源调配</text><rect x="355" y="319" width="290" height="133" rx="16" fill="#f2edf5" stroke="#cedcdb" stroke-width="1.5"/><text x="500.0" y="358" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">县廷</text><text x="500.0" y="396" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">律令、吏员与文书</text><text x="500.0" y="427" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">处理本县日常事务</text><rect x="64" y="321" width="230" height="133" rx="16" fill="#eef3e9" stroke="#cedcdb" stroke-width="1.5"/><text x="179.0" y="360" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">乡里</text><text x="179.0" y="398" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">人口与土地记录</text><text x="179.0" y="429" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">征发及情况报告</text><rect x="706" y="321" width="230" height="133" rx="16" fill="#f5eee2" stroke="#cedcdb" stroke-width="1.5"/><text x="821.0" y="360" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">事务与设施</text><text x="821.0" y="398" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">司法、仓储、邮传</text><text x="821.0" y="429" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">赋税、劳役及运输</text><path d="M452 228V310" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M548 310V228" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="428" y="276" font-size="20" fill="#42788f" text-anchor="end" font-weight="400">命令</text><text x="571" y="276" font-size="20" fill="#886b95" text-anchor="start" font-weight="400">报告</text><path d="M347 366H302" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M302 407H347" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M653 366H698" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M698 407H653" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="60" y="535" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">依据秦简所见事务概括，不复原某县的完整部门与官职。</text><text x="60" y="562" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">文书规范与实际执行有差距，须观察欠税、流动人口与信息延误。</text></g></svg>