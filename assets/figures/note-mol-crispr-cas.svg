<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">向导识别、DNA 切割与修复分支</title><desc id="desc">以一种 Cas9 系统为例，向导 RNA 引导识别含相邻 PAM 的目标 DNA，切割后可经不同修复途径得到不同序列。</desc>
<defs>
 <marker id="arr-b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#4b7fa4"/></marker>
 <marker id="arr-t" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3b877a"/></marker>
 <marker id="arr-p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#aa6484"/></marker>
 <marker id="arr-g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#c38d47"/></marker>
</defs>
<style>text{font-family:'Songti SC',STSong,SimSun,'Noto Serif CJK SC',serif;fill:#263847}.major{font-size:25px;font-weight:600}.label{font-size:21px;font-weight:600}.minor{font-size:18px;fill:#516672}.small{font-size:16px;fill:#627681}.blue{fill:none;stroke:#4b7fa4;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr-b)}.teal{fill:none;stroke:#3b877a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr-t)}.pink{fill:none;stroke:#aa6484;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr-p)}.gold{fill:none;stroke:#c38d47;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr-g)}.lead{fill:none;stroke:#708692;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="57" y="67" class="major">靶序列识别</text>
<path d="M88 233H330M670 233H905M88 285H905" stroke="#4b7fa4" stroke-width="7" stroke-linecap="round"/>
<path d="M330 233Q500 96 670 233" fill="none" stroke="#4b7fa4" stroke-width="6" stroke-linecap="round"/>
<g stroke="#b9cbd2" stroke-width="2"><path d="M162 235v48M204 235v48M246 235v48M288 235v48M330 235v48M372 235v48M414 235v48M456 235v48M498 235v48M540 235v48M582 235v48M624 235v48M666 235v48M708 235v48M750 235v48M792 235v48"/></g>
<rect x="280" y="219" width="428" height="82" rx="13" fill="#e5f3ed" fill-opacity=".8" stroke="#6a9f89"/>
<rect x="708" y="219" width="91" height="82" rx="10" fill="#f6e7c8" fill-opacity=".85" stroke="#d1a35e"/>
<text x="748" y="206" class="minor" text-anchor="middle">PAM</text>
<text x="492" y="112" class="small" text-anchor="middle">被置换的 DNA 链</text>
<path d="M315 179Q334 209 334 258H670" fill="none" stroke="#aa6484" stroke-width="7" stroke-linecap="round"/>
<text x="190" y="176" class="label" text-anchor="middle">向导 RNA</text><path d="M259 170L304 179" class="lead"/>
<g stroke="#aa6484" stroke-width="1.8" opacity=".7"><path d="M372 261v20M414 261v20M456 261v20M498 261v20M540 261v20M582 261v20M624 261v20M666 261v20"/></g>
<path d="M593 179l14 20M593 275l14 20" stroke="#c66f71" stroke-width="4" stroke-linecap="round"/>
<text x="597" y="331" class="minor" text-anchor="middle">Cas9 切割两条 DNA 链</text>
<path class="teal" d="M497 356Q364 375 270 409"/><path class="pink" d="M587 357Q726 376 802 409"/>
<rect x="78" y="425" width="366" height="84" rx="14" fill="#f4f8f6" stroke="#b3d2c3"/>
<text x="261" y="458" class="label" text-anchor="middle">端连接等修复</text><text x="261" y="488" class="small" text-anchor="middle">可能出现不同插入或缺失</text>
<rect x="590" y="425" width="354" height="84" rx="14" fill="#faf5f8" stroke="#d9b8ca"/>
<text x="768" y="458" class="label" text-anchor="middle">模板引导修复</text><text x="768" y="488" class="small" text-anchor="middle">提供合适模板时可能定向改变</text>
<text x="498" y="542" class="small" text-anchor="middle">不同 Cas 蛋白的 PAM 与切割方式不同；编辑结果必须测序验证</text>
</svg>
