<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">海洋活动：管控与交换并存</title><desc id="desc">海洋活动：管控与交换并存；官方往来：使节与朝贡、官方远航与贸易、外交与军事行动；获准商贸：许可及口岸管理、市场与海关征税、地区、对象各有规定；禁令之外：未经许可的航行、走私与武装活动、商贸网络和海防冲突</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">海洋活动：管控与交换并存</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">官方往来</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">使节与朝贡</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">官方远航与贸易</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">外交与军事行动</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">获准商贸</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">许可及口岸管理</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">市场与海关征税</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地区、对象各有规定</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">禁令之外</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">未经许可的航行</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">走私与武装活动</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">商贸网络和海防冲突</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">活动可能交叠；海禁不意味着所有官方和民间联系同时停止。</text></g></svg>