<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc"><title id="title">线粒体代谢与核内转录的联系</title><desc id="desc">线粒体代谢物与氧化还原信号可影响核内染色质和转录网络。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#82969b"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="460" fill="white"/><rect x="20" y="65" width="265" height="120" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="152.5" y="104.0" text-anchor="middle" font-size="22" fill="#2d414b">线粒体基质</text><text x="152.5" y="133.0" text-anchor="middle" font-size="22" fill="#2d414b">乙酰辅酶A</text><text x="152.5" y="162.0" text-anchor="middle" font-size="22" fill="#2d414b">柠檬酸形成</text><rect x="360" y="65" width="260" height="120" rx="10" fill="#f5eee5" stroke="#cbd9dc"/><text x="490.0" y="104.0" text-anchor="middle" font-size="22" fill="#2d414b">细胞质／细胞核</text><text x="490.0" y="133.0" text-anchor="middle" font-size="22" fill="#2d414b">柠檬酸裂解</text><text x="490.0" y="162.0" text-anchor="middle" font-size="22" fill="#2d414b">生成乙酰辅酶A</text><rect x="695" y="65" width="260" height="120" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="825.0" y="104.0" text-anchor="middle" font-size="22" fill="#2d414b">细胞核</text><text x="825.0" y="133.0" text-anchor="middle" font-size="22" fill="#2d414b">组蛋白乙酰化</text><text x="825.0" y="162.0" text-anchor="middle" font-size="22" fill="#2d414b">转录调节</text><path d="M 293 125 L 352 125" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="322" y="102" text-anchor="middle" font-size="17" fill="#2d414b">柠檬酸</text><path d="M 627 125 L 688 125" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="225" y="284" width="530" height="87" rx="10" fill="#edf5ef" stroke="#cbd9dc"/><text x="490.0" y="335.5" text-anchor="middle" font-size="22" fill="#2d414b">线粒体活性氧 → 信号网络 → 核内转录调节</text><text x="490" y="425" text-anchor="middle" font-size="20" fill="#2d414b">示意两条关联路径，实际环节和调控结果取决于细胞条件。</text></svg>