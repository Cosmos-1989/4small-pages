<svg xmlns="http://www.w3.org/2000/svg" width="980" height="414" viewBox="0 0 980 414" role="img" aria-labelledby="title desc"><title id="title">公共文化服务与文化产业的不同配置逻辑</title><desc id="desc">左侧强调基本权益、公共责任与公平可及，右侧强调文化产品和服务的生产经营。公共采购和社会参与可能连接两种配置方式。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="414" fill="white"/><text x="246" y="41" font-size="25" fill="#577991" text-anchor="middle" font-weight="600">公共文化服务</text><text x="734" y="41" font-size="25" fill="#a37b4c" text-anchor="middle" font-weight="600">文化产业</text><rect x="30" y="76" width="430" height="150" rx="12" fill="#eef3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="245.0" y="128.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">基本文化权益与可及性</text><text x="245.0" y="158.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">公共责任、财政保障、社会参与</text><text x="245.0" y="188.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">评价：覆盖、公平、质量和便利</text><rect x="520" y="76" width="430" height="150" rx="12" fill="#f8f2e9" stroke="#cdd8dc" stroke-width="1.5"/><text x="735.0" y="128.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">文化产品与服务的生产经营</text><text x="735.0" y="158.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">市场交易、需求和经营风险</text><text x="735.0" y="188.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">评价：文化价值、效益与合规</text><rect x="180" y="267" width="620" height="75" rx="12" fill="#eef5f1" stroke="#cdd8dc" stroke-width="1.5"/><text x="490.0" y="311.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">公共采购、社会运营等可以连接两种逻辑</text><path d="M246 235 V250 H335 V260" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M734 235 V250 H645 V260" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="387" font-size="19" fill="#273c48" text-anchor="middle" font-weight="400">分析目标和配置方式，再看具体组织；不能把二者当作互不相交的机构名单。</text></svg>