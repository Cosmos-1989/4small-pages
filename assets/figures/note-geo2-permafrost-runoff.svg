<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：活动层加深可能改变产流路径</title><desc id="desc">冻结层较浅时下渗受限、侧向汇流较明显；活动层加深后，下渗与地下径流可能增强，使部分地表径流减少。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#3384a2"/></marker>
<marker id="ad" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#23627d"/></marker>
<marker id="ag" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#668a76"/></marker>
<marker id="ar" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#bb7057"/></marker>
<marker id="am" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526872"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cce9ed"/><stop offset="1" stop-color="#e7f4f3"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcc7"/><stop offset="1" stop-color="#c8ab88"/></linearGradient>
</defs><rect width="1100" height="560" fill="#fbfcfa"/><text x="45" y="57" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="25" fill="#243842" font-weight="700" text-anchor="start" >冻土活动层 · 两种可能的产流路径</text><line x1="45" y1="73" x2="1055" y2="73" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><path d="M80 198 C215 201 355 264 525 302 L525 454 H80Z" fill="#e7d4b9" stroke="#92765e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 287 C218 296 362 333 525 338 L525 454 H80Z" fill="#d8e9e8" stroke="#7ea9af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 287 C218 296 362 333 525 338" fill="none" stroke="#5194a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="95" y="132" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243842" font-weight="700" text-anchor="start" >活动层较浅</text><path d="M158 153 C185 194 226 232 306 272" fill="none" stroke="#3384a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><path d="M307 276 C369 279 432 300 496 312" fill="none" stroke="#23627d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad)"/><text x="180" y="351" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#23627d" font-weight="400" text-anchor="start" >侧向汇流较明显</text><text x="124" y="429" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#526872" font-weight="400" text-anchor="start" >冻结／低渗层</text><path d="M585 198 C720 201 860 264 1030 302 L1030 454 H585Z" fill="#e7d4b9" stroke="#92765e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M585 357 C723 366 867 403 1030 408 L1030 454 H585Z" fill="#d8e9e8" stroke="#7ea9af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M585 357 C723 366 867 403 1030 408" fill="none" stroke="#5194a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="600" y="132" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="23" fill="#243842" font-weight="700" text-anchor="start" >活动层加深后</text><path d="M663 153 C690 194 731 232 811 272" fill="none" stroke="#3384a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><path d="M811 273 C816 320 847 360 919 387" fill="none" stroke="#23627d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad)"/><text x="723" y="361" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#23627d" font-weight="400" text-anchor="start" >地下路径可能增强</text><text x="629" y="429" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#526872" font-weight="400" text-anchor="start" >冻结／低渗层</text><line x1="551" y1="114" x2="551" y2="457" stroke="#d9e5e1" stroke-width="2" stroke-linecap="round" /><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >情景只说明可能机制；河网变化还受降水、融水和植被影响。</text></svg>