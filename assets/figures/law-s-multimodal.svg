<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">多式联运的对外义务与内部安排</title><desc id="desc">客户和经营人签全程合同，经营人分别组织铁路和水运，内部责任与外部义务区分。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="1000" height="480" fill="#fff"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="42" y="42" font-size="27" text-anchor="start" fill="#293f47" font-weight="bold">对外合同与分段运输安排</text><rect x="55" y="91" width="238" height="112" rx="12" fill="#edf4f5" stroke="#a6bfc3" stroke-width="1.6"/><text x="174" y="138" font-size="28" text-anchor="middle" fill="#293f47" font-weight="bold">客户／托运人</text><rect x="622" y="91" width="325" height="112" rx="12" fill="#eef3e9" stroke="#a6bfc3" stroke-width="1.6"/><text x="785" y="138" font-size="28" text-anchor="middle" fill="#293f47" font-weight="bold">多式联运经营人</text><path d="M305 130H611" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><text x="458" y="111" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">全程运输合同</text><path d="M610 177H306" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><text x="458" y="204" font-size="21" text-anchor="middle" fill="#293f47" font-weight="normal">经营人对全程负责</text><rect x="225" y="306" width="242" height="98" rx="12" fill="#faf2e4" stroke="#a6bfc3" stroke-width="1.6"/><text x="346" y="349" font-size="26" text-anchor="middle" fill="#293f47" font-weight="normal">A：铁路区段</text><rect x="622" y="306" width="242" height="98" rx="12" fill="#f4eff6" stroke="#a6bfc3" stroke-width="1.6"/><text x="743" y="349" font-size="26" text-anchor="middle" fill="#293f47" font-weight="normal">B：水运区段</text><path d="M727 214V258H348V295" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M834 214V295" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="508" y="249" font-size="20" text-anchor="middle" fill="#60757b" font-weight="normal">内部委托与责任安排</text><path d="M480 355H606" fill="none" stroke="#567f7f" stroke-width="2.3" marker-end="url(#arrow)"/><text x="544" y="385" font-size="20" text-anchor="middle" fill="#60757b" font-weight="normal">货物衔接</text><text x="42" y="458" font-size="19" text-anchor="start" fill="#60757b" font-weight="normal">分段委托不改变对外全程义务；内部违约与追偿分别判断，不预设连带。</text></g></svg>