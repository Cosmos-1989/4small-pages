<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">技术年代需要区分的证据</title><desc id="desc">技术年代需要区分的证据；存世实物：载体与制作痕迹、出土或保存情境、目前已知最早例；文献记述：术语与操作方法、文本成书及版本、记载不等于普及；传播与应用：路线及中介人员、成本和使用环境、改造与长期并存</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">技术年代需要区分的证据</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">存世实物</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">载体与制作痕迹</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">出土或保存情境</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">目前已知最早例</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">文献记述</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">术语与操作方法</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">文本成书及版本</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">记载不等于普及</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">传播与应用</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">路线及中介人员</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">成本和使用环境</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">改造与长期并存</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">“目前已知最早”是证据范围的限定，不等于发明的绝对起点。</text></g></svg>