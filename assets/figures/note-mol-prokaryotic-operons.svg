<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">乳糖操纵子的阻遏与诱导</title><desc id="desc">上下比较乳糖操纵子的阻遏与诱导，并注明葡萄糖影响转录强度。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#3f7182"/></marker>
 <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#a5647b"/></marker>
 <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#b68642"/></marker>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfcf9"/><stop offset="1" stop-color="#f5f8f5"/></linearGradient>
 <linearGradient id="nucleus" x2="0" y2="1"><stop stop-color="#eaf1fb"/><stop offset="1" stop-color="#f5f8fe"/></linearGradient>
</defs>
<style>
 text{font-family:'Songti SC',STSong,SimSun,'Noto Serif CJK SC',serif;fill:#243d47}
 .h{font-size:24px;font-weight:700}.lab{font-size:20px;font-weight:600}.mid{font-size:18px}.sm{font-size:16px;fill:#5d7077}.tiny{font-size:14px;fill:#65777e}
 .dna{fill:none;stroke:#4d7184;stroke-width:9;stroke-linecap:round}.dna2{fill:none;stroke:#98b5bc;stroke-width:4;stroke-linecap:round}
 .flow{fill:none;stroke:#3f7182;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
 .flow2{fill:none;stroke:#a5647b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow2)}
 .flow3{fill:none;stroke:#b68642;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow3)}
 .guide{fill:none;stroke:#9fb4ba;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .card{fill:#fff;stroke:#d9e4e0;stroke-width:1.8}
</style>
<rect width="1000" height="560" fill="url(#paper)"/>

<text x="62" y="53" class="h">乳糖操纵子：底物信号改变阻遏蛋白结合</text>
<rect x="46" y="92" width="908" height="177" rx="22" class="card"/>
<rect x="46" y="287" width="908" height="213" rx="22" class="card"/>
<circle cx="104" cy="150" r="30" fill="#e9d4dc" stroke="#b97d91" stroke-width="2"/><text x="104" y="158" text-anchor="middle" class="lab">无</text>
<text x="151" y="145" class="lab">缺少乳糖</text><text x="151" y="170" class="sm">阻遏蛋白结合操纵序列</text>
<path class="dna" d="M155 221H846"/><path class="dna2" d="M155 232H846"/>
<rect x="300" y="204" width="100" height="34" rx="7" fill="#c9dfe5" stroke="#7197a4" stroke-width="2"/>
<rect x="412" y="204" width="79" height="34" rx="7" fill="#f3d9df" stroke="#b97d91" stroke-width="2"/>
<rect x="505" y="204" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<rect x="602" y="204" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<rect x="699" y="204" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<text x="349" y="227" text-anchor="middle" class="sm">启动子</text><text x="451" y="227" text-anchor="middle" class="sm">操纵序列</text>
<text x="548" y="226" text-anchor="middle" class="sm">lacZ</text><text x="645" y="226" text-anchor="middle" class="sm">lacY</text><text x="742" y="226" text-anchor="middle" class="sm">lacA</text>
<path d="M437 173q14-42 36 0l-8 26h-21Z" fill="#b97d91" stroke="#8c5268" stroke-width="2"/><circle cx="452" cy="160" r="5" fill="#fff"/>
<path class="guide" d="M461 150l30-26H603"/><text x="607" y="127" class="sm">阻遏蛋白阻碍转录</text>
<path d="M246 191q7-27 34-23q23 4 27 22q-18-7-31 4Z" fill="#91afbd" stroke="#52788b" stroke-width="2"/><text x="231" y="181" class="tiny" text-anchor="end">聚合酶</text>
<path d="M490 180l18 18m0-18l-18 18" stroke="#be6270" stroke-width="4" stroke-linecap="round"/>
<circle cx="104" cy="347" r="30" fill="#dfeeda" stroke="#8cb384" stroke-width="2"/><text x="104" y="355" text-anchor="middle" class="lab">有</text>
<text x="151" y="340" class="lab">乳糖进入细胞</text><text x="151" y="366" class="sm">异乳糖结合阻遏蛋白</text>
<path class="dna" d="M155 426H846"/><path class="dna2" d="M155 437H846"/>
<rect x="300" y="409" width="100" height="34" rx="7" fill="#c9dfe5" stroke="#7197a4" stroke-width="2"/>
<rect x="412" y="409" width="79" height="34" rx="7" fill="#f3d9df" stroke="#b97d91" stroke-width="2"/>
<rect x="505" y="409" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<rect x="602" y="409" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<rect x="699" y="409" width="86" height="34" rx="6" fill="#d9e9d7" stroke="#8caf84"/>
<text x="349" y="432" text-anchor="middle" class="sm">启动子</text><text x="451" y="432" text-anchor="middle" class="sm">操纵序列</text>
<text x="548" y="431" text-anchor="middle" class="sm">lacZ</text><text x="645" y="431" text-anchor="middle" class="sm">lacY</text><text x="742" y="431" text-anchor="middle" class="sm">lacA</text>
<path d="M275 392q7-27 34-23q23 4 27 22q-18-7-31 4Z" fill="#91afbd" stroke="#52788b" stroke-width="2"/><path class="flow" d="M340 383H510"/>
<path d="M424 332q14-42 36 0l-8 26h-21Z" fill="#b97d91" stroke="#8c5268" stroke-width="2"/><circle cx="451" cy="328" r="10" fill="#dfb76a" stroke="#ad853c" stroke-width="1.5"/>
<text x="503" y="328" class="sm">异乳糖使阻遏蛋白脱离 DNA</text>
<path d="M504 463q110 24 278 0" fill="none" stroke="#5b9a7b" stroke-width="4" stroke-linecap="round"/>
<path d="M783 462l-14-8 2 16Z" fill="#5b9a7b"/><text x="648" y="487" text-anchor="middle" class="sm">产生多顺反子 mRNA</text>
<text x="55" y="537" class="sm">注：葡萄糖降低时，cAMP–CRP 还可提高转录水平。</text>

</svg>
