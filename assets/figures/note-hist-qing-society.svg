<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">清代社会经济：扩张与约束</title><desc id="desc">清代社会经济：扩张与约束；农业与资源：战后恢复、垦殖、水利与作物推广、生态压力、土地差异；市场与生产：区域专业化、远途商贸及契约、价格波动、财富差异；人口与治理：人口与家庭变化、税政和救灾需求、地方人员与财政约束</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">清代社会经济：扩张与约束</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">农业与资源</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">战后恢复、垦殖</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">水利与作物推广</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">生态压力、土地差异</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">市场与生产</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">区域专业化</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">远途商贸及契约</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">价格波动、财富差异</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">人口与治理</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">人口与家庭变化</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">税政和救灾需求</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地方人员与财政约束</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">因素互相联系；无统一口径的增长率与因果权重不作量化。</text></g></svg>