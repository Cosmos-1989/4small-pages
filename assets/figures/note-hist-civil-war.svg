<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">国共关系与战争阶段</title><desc id="desc">国共关系与战争阶段；1927年：第一次合作破裂；1934—1936年：红军长征；1937—1945年：抗日合作；1945—1946年：战后谈判与全面内战；1948—1949年：主要战役与政权转移</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">国共关系与战争阶段</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1927年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">第一次合作破裂</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">清党、武装起义与根据地战争</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1934—1936年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">红军长征</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">各支主力先后转移到西北</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1937—1945年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">抗日合作</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">合作与竞争并存，双方保留自身组织</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1945—1946年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">战后谈判与全面内战</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">接收、军队整编和政府组成难以协调</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1948—1949年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">主要战役与政权转移</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">三大战役、渡江作战与海峡两岸分治</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>