<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：含氧矿井水的酸生成与岩溶迁移</title><desc id="desc">废弃煤矿积水接触氧气后，黄铁矿可氧化并释放酸、铁与硫酸根；含铁水可沿断层破碎带和岩溶通道迁移至泉眼。</desc><defs>
