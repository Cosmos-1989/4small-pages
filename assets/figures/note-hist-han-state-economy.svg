<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" role="img" aria-labelledby="title desc"><title id="title">汉代财政资源</title><desc id="desc">农业租赋劳役与盐铁市场政策支持财政，铸币规范以虚线表示管理联系，官府组织军队官署与运输工程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="667" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">汉代财政的资源与支出</text><rect x="55" y="122" width="275" height="134" rx="16" fill="#eef3e9" stroke="#cedcdb" stroke-width="1.5"/><text x="192.5" y="161" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">农业与家庭生产</text><text x="192.5" y="199" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">粮钱租赋与劳役</text><text x="192.5" y="230" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">依身份、地区而异</text><rect x="363" y="122" width="275" height="134" rx="16" fill="#edf4f5" stroke="#cedcdb" stroke-width="1.5"/><text x="500.5" y="161" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">盐铁与市场</text><text x="500.5" y="199" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">经营及税收政策</text><text x="500.5" y="230" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">组织方式持续调整</text><rect x="671" y="122" width="275" height="134" rx="16" fill="#f2edf5" stroke="#cedcdb" stroke-width="1.5"/><text x="808.5" y="161" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">铸币与钱币管理</text><text x="808.5" y="199" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">规范铸造与流通</text><text x="808.5" y="230" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">不等于独立收入</text><rect x="368" y="342" width="264" height="105" rx="16" fill="#f5eee2" stroke="#cedcdb" stroke-width="1.5"/><text x="500.0" y="381" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">官府资源</text><text x="500.0" y="419" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">粮食、钱币与劳力</text><path d="M190 263Q190 304 372 352" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 264V332" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M808 263Q808 304 628 352" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M500 454V491" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="532" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">官署与军队　·　运输与工程　·　其他支出</text><text x="60" y="584" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">实线表示资源组织方向，虚线表示管理联系；不表示各项财政收入占比。</text><text x="60" y="611" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">粮食、钱币、布帛和劳役不能简单相加；所铸钱币也不全是财政收入。</text></g></svg>