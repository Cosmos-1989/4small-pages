<circle cx="694" cy="178" r="4" fill="#909b9e"/><circle cx="365" cy="300" r="4" fill="#bd7160"/><circle cx="643" cy="364" r="4" fill="#628ba1"/>
<text x="744" y="69" class="label">下风向降灰</text><text x="744" y="96" class="minor">依风场与喷发而异</text>
<text x="61" y="119" class="label">火山碎屑密度流</text><text x="61" y="146" class="minor">高温物质可沿坡下行</text>
<text x="763" y="264" class="label">火山泥流</text><text x="763" y="291" class="minor">有水参与时沿谷地移动</text>
<path d="M463 199Q481 305 491 500" fill="none" stroke="#a26d5b" stroke-width="6" stroke-dasharray="13 9"/>
<text x="386" y="462" class="minor">岩浆通道</text>
<text x="500" y="543" class="small" text-anchor="middle">不同路径并非同一次喷发必然同时出现</text>
</svg>
