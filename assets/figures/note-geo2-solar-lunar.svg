<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：正午太阳高度与傍晚西方盈蛾眉月</title><desc id="desc">对北回归线以北、正午太阳位于南方的观测点，同日向北约五度正午太阳高度约降低五度；傍晚西方蛾眉月通常在盈相。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#3384a2"/></marker>
<marker id="ad" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#23627d"/></marker>
<marker id="ag" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#668a76"/></marker>
<marker id="ar" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#bb7057"/></marker>
<marker id="am" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526872"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cce9ed"/><stop offset="1" stop-color="#e7f4f3"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcc7"/><stop offset="1" stop-color="#c8ab88"/></linearGradient>
</defs><rect width="1100" height="560" fill="#fbfcfa"/><text x="45" y="57" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="25" fill="#243842" font-weight="700" text-anchor="start" >太阳高度与月相 · 分时段示意</text><line x1="45" y1="73" x2="1055" y2="73" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="82" y="111" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="22" fill="#526872" font-weight="400" text-anchor="start" >同日正午（北回归线以北）</text><path d="M72 378H748" fill="none" stroke="#71888c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="768" y1="95" x2="768" y2="453" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><circle cx="221" cy="378" r="5" fill="#243842" stroke="none" stroke-width="2"/><circle cx="587" cy="378" r="5" fill="#243842" stroke="none" stroke-width="2"/><path d="M221 378 L318 176 M587 378 L650 207" fill="none" stroke="#bb7057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="318" cy="176" r="23" fill="#e2b75f" stroke="none" stroke-width="2"/><circle cx="650" cy="207" r="23" fill="#e2b75f" stroke="none" stroke-width="2"/><path d="M222 332 A48 48 0 0 1 263 350 M588 332 A48 48 0 0 1 618 351" fill="none" stroke="#bb7057" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="98" y="426" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#bb7057" font-weight="400" text-anchor="start" >较低纬：正午高度较高</text><text x="452" y="426" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#bb7057" font-weight="400" text-anchor="start" >较高纬：约低 5°</text><path d="M798 378 H1034" fill="none" stroke="#71888c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M821 240 C855 199 917 185 990 205" fill="none" stroke="#8fa3a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M921 236 C893 234 878 266 892 291 C905 311 934 314 950 293 C927 293 912 278 912 261 C912 250 915 243 921 236Z" fill="#dfcd82" stroke="#8d8150" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="915" y="130" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="20" fill="#526872" font-weight="400" text-anchor="middle" >另一个时段：日落后</text><text x="914" y="350" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#243842" font-weight="400" text-anchor="middle" >西方可见盈蛾眉月</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >角度和轨迹不按比例；同日纬度比较与傍晚月相是不同观测情景。</text></svg>