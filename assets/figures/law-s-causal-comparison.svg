<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">蛋糕案例中的因果比较</title><desc id="desc">题设4名食用者发病，2名未食用者未发病，比较与蛋糕检测共同支持调查，但不是排除所有混杂的实验。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="1000" height="480" fill="#fff"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="42" y="42" font-size="27" text-anchor="start" fill="#293f47" font-weight="bold">聚餐中的比较与独立检验</text><rect x="42" y="86" width="426" height="151" rx="12" fill="#f8efe5" stroke="#a6bfc3" stroke-width="1.6"/><text x="255" y="128" font-size="27" text-anchor="middle" fill="#293f47" font-weight="bold">吃蛋糕：4人</text><text x="255" y="175" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">4人出现症状</text><text x="255" y="211" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">其他晚餐食物相同</text><rect x="532" y="86" width="426" height="151" rx="12" fill="#edf4f5" stroke="#a6bfc3" stroke-width="1.6"/><text x="745" y="128" font-size="27" text-anchor="middle" fill="#293f47" font-weight="bold">未吃：2人</text><text x="745" y="175" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">2人未出现症状</text><text x="745" y="211" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">其他晚餐食物相同</text><path d="M256 248V280H500V301" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M745 248V280H500" fill="none" stroke="#718a92" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="163" y="316" width="674" height="92" rx="12" fill="#edf2e9" stroke="#a6bfc3" stroke-width="1.6"/><text x="500" y="350" font-size="24" text-anchor="middle" fill="#293f47" font-weight="normal">比较线索 ＋ 蛋糕检验 ＋ 病历和时间联系</text><text x="500" y="386" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">综合评价食物、发病与损害之间的联系</text><text x="42" y="454" font-size="19" text-anchor="start" fill="#60757b" font-weight="normal">题给人数不是随机试验；体质等差异未全部控制，不能单独排除所有其他原因。</text></g></svg>