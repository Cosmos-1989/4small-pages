<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">复制增加DNA量，不改变染色体组数</title><desc id="desc">复制前两条同源染色体各含一DNA分子，复制后两条X形染色体各含两个姐妹染色单体。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="650" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">复制增加DNA量，不改变染色体组数</text><text x="245" y="130" font-size="29" fill="#294451" text-anchor="middle" font-weight="600">复制前</text><text x="745" y="130" font-size="29" fill="#294451" text-anchor="middle" font-weight="600">复制后</text><ellipse cx="245" cy="300" rx="145" ry="145" fill="#eaf2f3" stroke="#c6d9d8" stroke-width="2"/><ellipse cx="745" cy="300" rx="145" ry="145" fill="#eaf2f3" stroke="#c6d9d8" stroke-width="2"/><path d="M195 230.0L195 370.0" fill="none" stroke="#3f7d96" stroke-width="10"/><circle cx="195" cy="300" r="6" fill="#fffefa" stroke="#3f7d96" stroke-width="3"/><path d="M290 230.0L290 370.0" fill="none" stroke="#bb695c" stroke-width="10"/><circle cx="290" cy="300" r="6" fill="#fffefa" stroke="#bb695c" stroke-width="3"/><path d="M683 230.0L707 370.0M707 230.0L683 370.0" fill="none" stroke="#3f7d96" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="695" cy="300" r="6" fill="#fffefa" stroke="#3f7d96" stroke-width="3"/><path d="M778 230.0L802 370.0M802 230.0L778 370.0" fill="none" stroke="#bb695c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="790" cy="300" r="6" fill="#fffefa" stroke="#bb695c" stroke-width="3"/><path d="M425 300L565 300" fill="none" stroke="#687e83" stroke-width="4" marker-end="url(#arrow)"/><text x="495" y="263" font-size="24" fill="#294451" text-anchor="middle">DNA复制</text><text x="245" y="490" font-size="26" fill="#294451" text-anchor="middle">2条染色体 · 2个DNA分子</text><text x="745" y="490" font-size="26" fill="#294451" text-anchor="middle">2条染色体 · 4个DNA分子</text><text x="245" y="540" font-size="28" fill="#3f7d96" text-anchor="middle">2n＝2，2C</text><text x="745" y="540" font-size="28" fill="#bb695c" text-anchor="middle">2n＝2，4C</text><text x="50" y="624" font-size="20" fill="#687e83" text-anchor="start">以2n＝2为例；X形两臂表示两条姐妹，尚未分离时仍计作一条染色体。</text></g></svg>