<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：潜在蒸散需求与实际蒸散</title><desc id="desc">潜在蒸散是在水分充足等参考条件下的大气蒸发需求；实际蒸散还受土壤水、植被和能量共同限制。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#3384a2"/></marker>
<marker id="ad" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#23627d"/></marker>
<marker id="ag" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#668a76"/></marker>
<marker id="ar" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#bb7057"/></marker>
<marker id="am" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526872"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cce9ed"/><stop offset="1" stop-color="#e7f4f3"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcc7"/><stop offset="1" stop-color="#c8ab88"/></linearGradient>
</defs><rect width="1100" height="560" fill="#fbfcfa"/><text x="45" y="57" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="25" fill="#243842" font-weight="700" text-anchor="start" >山地水分 · 潜在与实际蒸散</text><line x1="45" y1="73" x2="1055" y2="73" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><path d="M78 327 C183 302 269 219 369 187 C471 155 590 212 694 258 C797 309 914 328 1023 318 L1023 452 H78Z" fill="#e3dac5" stroke="#958d73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M75 410 C185 393 276 326 373 304 C474 276 562 322 687 356 C803 388 918 399 1024 385" fill="none" stroke="#a5c4c0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M344 185 C393 168 447 168 501 184" fill="none" stroke="#a7a077" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M485 177 C488 123 496 105 518 89" fill="none" stroke="#bb7057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M594 215 C601 160 617 139 640 126" fill="none" stroke="#bb7057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M480 331 C484 290 507 264 531 244" fill="none" stroke="#3384a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><path d="M750 369 C763 333 787 307 808 289" fill="none" stroke="#3384a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><line x1="642" y1="134" x2="743" y2="123" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="642" cy="134" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="747" y="127" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >大气潜在蒸散需求</text><line x1="529" y1="271" x2="388" y2="397" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="529" cy="271" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="160" y="403" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >实际蒸散受水分限制</text><line x1="760" y1="369" x2="859" y2="437" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="760" cy="369" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="865" y="442" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >土壤可用水</text><text x="127" y="158" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="19" fill="#526872" font-weight="400" text-anchor="start" >山地剖面</text><text x="532" y="451" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >还受辐射、湿度、风与植被影响</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >两类蒸散无数值比例；比较需指定参考面和同一计算时段。</text></svg>