<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc"><title id="title">改变求解方向与检验候选方案</title><desc id="desc">倒推生成候选路径，再正向检验。认知策略不赋予逆命题普遍有效性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="510" fill="white"/><rect x="28" y="90" width="250" height="110" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="153.0" y="137.5" font-size="23" text-anchor="middle" fill="#2d414b">已知条件</text><text x="153.0" y="168.5" font-size="23" text-anchor="middle" fill="#2d414b">当前资源与规则</text><rect x="702" y="90" width="250" height="110" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="827.0" y="137.5" font-size="23" text-anchor="middle" fill="#2d414b">目标</text><text x="827.0" y="168.5" font-size="23" text-anchor="middle" fill="#2d414b">需要实现的结果</text><path d="M694 118 L286 118" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="490" y="90" font-size="22" text-anchor="middle" fill="#2d414b">回溯：寻找候选条件与步骤</text><path d="M286 183 L694 183" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><text x="490" y="221" font-size="22" text-anchor="middle" fill="#2d414b">正向：核对步骤是否足够、可行</text><rect x="155" y="318" width="670" height="86" rx="10" fill="#f8f2e9" stroke="#d1dde2"/><text x="490.0" y="353.5" font-size="23" text-anchor="middle" fill="#2d414b">观察视角可以转换，命题方向须另行检验</text><text x="490.0" y="384.5" font-size="23" text-anchor="middle" fill="#2d414b">由P→Q不能直接推出Q→P</text><text x="490" y="468" font-size="22" text-anchor="middle" fill="#2d414b">发现候选方案与证明方案成立，承担不同任务。</text></svg>