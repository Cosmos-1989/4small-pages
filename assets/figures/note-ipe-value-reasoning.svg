<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
<title id="title">公共选择中的事实、权利与理由</title><desc id="desc">三组问题联系事实与不确定性、受影响者与权利、方案与理由；公开说明并接受反馈可修订判断。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#63777b" stroke-width="1.4"/></marker></defs>
<style>text{font-family:"Songti SC",STSong,SimSun,serif;fill:#263f42;font-size:19px}.heading{font-size:22px;font-weight:600}.small{font-size:16px;fill:#596b6e}.line{fill:none;stroke:#63777b;stroke-width:1.6;marker-end:url(#arrow)}.box{stroke-width:1.3}.rule{stroke:#b8c6c6;stroke-width:1}</style>
<rect width="920" height="510" fill="#fff"/>
<text x="40" y="39" text-anchor="start" class="heading"><tspan x="40" dy="0">对一个具体的公共选择提出问题</tspan></text><path class="rule" d="M40 57H880"/><rect class="box" x="40" y="89" width="250" height="164" rx="7" fill="#edf4f5" stroke="#8daaad"/><text x="165.0" y="127" text-anchor="middle" class="heading"><tspan x="165.0" dy="0">事实与不确定性</tspan></text><text x="165.0" y="165" text-anchor="middle" class=""><tspan x="165.0" dy="0">发生了什么？</tspan><tspan x="165.0" dy="29">证据有多可靠？</tspan><tspan x="165.0" dy="29">还不知道什么？</tspan></text><rect class="box" x="335" y="89" width="250" height="164" rx="7" fill="#eff3ec" stroke="#a1b396"/><text x="460.0" y="127" text-anchor="middle" class="heading"><tspan x="460.0" dy="0">受影响者与权利</tspan></text><text x="460.0" y="165" text-anchor="middle" class=""><tspan x="460.0" dy="0">谁受益，谁承担代价？</tspan><tspan x="460.0" dy="29">哪些权利受到影响？</tspan><tspan x="460.0" dy="29">谁还没有被听见？</tspan></text><rect class="box" x="630" y="89" width="250" height="164" rx="7" fill="#f9f1e5" stroke="#cbb996"/><text x="755.0" y="127" text-anchor="middle" class="heading"><tspan x="755.0" dy="0">方案与理由</tspan></text><text x="755.0" y="165" text-anchor="middle" class=""><tspan x="755.0" dy="0">目标是否正当？</tspan><tspan x="755.0" dy="29">有无损害更小的办法？</tspan><tspan x="755.0" dy="29">成本与效果如何？</tspan></text><path class="line" d="M291 171H328"/><path class="line" d="M586 171H623"/><path class="line" d="M755 254V296H460V322"/><rect class="box" x="185" y="327" width="550" height="102" rx="7" fill="#f3f1f6" stroke="#b1a6bb"/><text x="460.0" y="365" text-anchor="middle" class="heading"><tspan x="460.0" dy="0">公开说明、实施与复核</tspan></text><text x="460.0" y="403" text-anchor="middle" class=""><tspan x="460.0" dy="0">说明选择的理由，保留监督、纠错和依法救济。</tspan></text><path class="line" d="M184 377H105V270"/><text x="110" y="309" text-anchor="middle" class="small"><tspan x="110" dy="0">反馈</tspan></text><text x="40" y="478" text-anchor="start" class="small"><tspan x="40" dy="0">分析框架；不按比例绘制，不保证得出唯一结论。</tspan></text>
</svg>