<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">替代假说与区分性证据</title><desc id="desc">从同一现象提出目标物质与替代机制的假说，设计能区分预测的观测，再据新证据更新支持程度。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="520" fill="white"/><rect x="25" y="80" width="220" height="95" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="135.0" y="119.0" font-size="22" text-anchor="middle" fill="#2b414d">观察到一个现象</text><text x="135.0" y="150.0" font-size="22" text-anchor="middle" fill="#2b414d">例如某条谱线</text><rect x="345" y="35" width="245" height="85" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="467.5" y="69.0" font-size="22" text-anchor="middle" fill="#2b414d">假说甲</text><text x="467.5" y="100.0" font-size="22" text-anchor="middle" fill="#2b414d">目标物质解释</text><rect x="345" y="175" width="245" height="85" rx="11" fill="#f8f2e8" stroke="#ccd8de"/><text x="467.5" y="209.0" font-size="22" text-anchor="middle" fill="#2b414d">假说乙</text><text x="467.5" y="240.0" font-size="22" text-anchor="middle" fill="#2b414d">其他分子或仪器效应</text><path d="M260 120 L332 80" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M260 145 L332 215" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="690" y="100" width="265" height="100" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="822.5" y="141.5" font-size="23" text-anchor="middle" fill="#2b414d">设计区分性观测</text><text x="822.5" y="172.5" font-size="23" text-anchor="middle" fill="#2b414d">比较各假说的预测</text><path d="M603 80 L677 140" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M603 215 L677 160" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="270" y="345" width="440" height="85" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="490.0" y="394.5" font-size="24" text-anchor="middle" fill="#2b414d">新证据改变相对支持程度</text><path d="M820 212V300H490V331" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="488" font-size="20" text-anchor="middle" fill="#2b414d">解释已有现象与预测新证据相结合；相容证据可能支持多个假说。</text></svg>