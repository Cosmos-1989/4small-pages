<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：径流深由总水量与流域面积换算</title><desc id="desc">同一时段流出流域的总径流体积除以流域面积，得到等效铺展水层厚度。</desc><defs>
