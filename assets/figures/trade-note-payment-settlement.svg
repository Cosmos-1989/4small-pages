<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" role="img" aria-labelledby="title desc">
<title id="title">人民币跨境付款的清算结算路径</title><desc id="desc">付款人经付款银行、CIPS和收款银行完成一笔人民币跨境付款。虚线表示指令传递，实线表示对应的资金处理关系；银行按直接参与简化，不表示所有付款都采用相同路径。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="490" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="490" y="46" font-size="27" text-anchor="middle" fill="#253e48">一笔人民币跨境付款的简化路径</text><rect x="32" y="135" width="148" height="120" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="106.0" y="186.0" font-size="22" text-anchor="middle" fill="#253e48">付款人</text><text x="106.0" y="220.0" font-size="22" text-anchor="middle" fill="#253e48">发起付款</text><rect x="224" y="135" width="148" height="120" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="298.0" y="186.0" font-size="22" text-anchor="middle" fill="#253e48">付款银行</text><text x="298.0" y="220.0" font-size="22" text-anchor="middle" fill="#253e48">处理客户指令</text><rect x="416" y="135" width="148" height="120" rx="8" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="490.0" y="169.0" font-size="22" text-anchor="middle" fill="#253e48">人民币跨境</text><text x="490.0" y="203.0" font-size="22" text-anchor="middle" fill="#253e48">支付系统</text><text x="490.0" y="237.0" font-size="22" text-anchor="middle" fill="#253e48">清算与结算</text><rect x="608" y="135" width="148" height="120" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="682.0" y="186.0" font-size="22" text-anchor="middle" fill="#253e48">收款银行</text><text x="682.0" y="220.0" font-size="22" text-anchor="middle" fill="#253e48">处理入账</text><rect x="800" y="135" width="148" height="120" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="874.0" y="186.0" font-size="22" text-anchor="middle" fill="#253e48">收款人</text><text x="874.0" y="220.0" font-size="22" text-anchor="middle" fill="#253e48">取得资金</text><path d="M180 160 H220" fill="none" stroke="#39798d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M180 235 H220" fill="none" stroke="#39798d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M372 160 H412" fill="none" stroke="#39798d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M372 235 H412" fill="none" stroke="#39798d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M564 160 H604" fill="none" stroke="#39798d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M564 235 H604" fill="none" stroke="#39798d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M756 160 H796" fill="none" stroke="#39798d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M756 235 H796" fill="none" stroke="#39798d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><line x1="145" y1="315" x2="205" y2="315" stroke="#39798d" stroke-width="2.2" stroke-dasharray="5 4"/><text x="222" y="323" font-size="23" text-anchor="start" fill="#253e48">指令传递</text><line x1="540" y1="315" x2="600" y2="315" stroke="#39798d" stroke-width="2.7"/><text x="617" y="323" font-size="23" text-anchor="start" fill="#253e48">资金处理关系</text><line x1="65" y1="365" x2="915" y2="365" stroke="#c9d7db" stroke-width="1.5"/><text x="490" y="408" font-size="22" text-anchor="middle" fill="#253e48">银行按直接参与简化；间接参与可能增加代理行等环节。</text><text x="490" y="451" font-size="23" text-anchor="middle" fill="#253e48">支付基础设施改善，不直接改变资本项目兑换规则。</text>
</g></svg>
