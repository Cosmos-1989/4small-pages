<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="title desc"><title id="title">幼根分区与初生生长</title><desc id="desc">根冠位于根的最前端，分裂区、伸长区、成熟区依次位于其后；根毛仅从成熟区表皮伸出。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#4b91ad"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#659b7a"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#c59a51"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#b87770"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, STSong, SimSun, serif" stroke-linecap="round" stroke-linejoin="round"><text x="42" y="38" font-size="22" fill="#334b55" text-anchor="start">生长端与细胞命运</text><text x="495" y="38" font-size="22" fill="#334b55" text-anchor="start">根的延长</text><path d="M235 67 C224 180 230 306 242 403 Q260 451 278 403 C290 306 296 180 285 67" stroke="#659b7a" stroke-width="3" fill="#edf4e9" /><path d="M242 381 Q260 413 278 381 M241 394 Q260 431 279 394" stroke="#659b7a" stroke-width="2" fill="#d4e6cc" /><path d="M235 70 L285 70" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 110 L285 110" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 150 L285 150" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 190 L285 190" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 232 L285 232" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 270 L285 270" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 292 L285 292" stroke="#659b7a" stroke-width="1" fill="none" /><path d="M235 311 L285 311" stroke