<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">西周政治联系</title><desc id="desc">王室与封国之间有册命赏赐和军役朝觐，封国间另有联姻盟结或竞争；非疆域图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="625" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">西周王室、封国与宗族的政治联系</text><rect x="353" y="112" width="294" height="117" rx="16" fill="#edf4f5" stroke="#cedcdb" stroke-width="1.5"/><text x="500.0" y="151" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">周王室</text><text x="500.0" y="189" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">王权、仪式与政治中心</text><rect x="100" y="364" width="300" height="119" rx="16" fill="#f2edf5" stroke="#cedcdb" stroke-width="1.5"/><text x="250.0" y="403" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">封国与地方宗族甲</text><text x="250.0" y="441" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">土地、人口及地方联系</text><rect x="600" y="364" width="300" height="119" rx="16" fill="#eef3e9" stroke="#cedcdb" stroke-width="1.5"/><text x="750.0" y="403" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">封国与地方宗族乙</text><text x="750.0" y="441" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">土地、人口及地方联系</text><path d="M390 230L242 356" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M277 358L421 236" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M610 230L758 356" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M723 358L579 236" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="155" y="271" font-size="20" fill="#42788f" text-anchor="start" font-weight="400">册命、赏赐</text><text x="345" y="331" font-size="20" fill="#886b95" text-anchor="start" font-weight="400">军役、朝觐</text><text x="700" y="271" font-size="20" fill="#42788f" text-anchor="start" font-weight="400">册命、赏赐</text><text x="545" y="331" font-size="20" fill="#5b8b79" text-anchor="start" font-weight="400">军役、朝觐</text><path d="M407 409H593" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6"/><text x="500" y="461" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">联姻、盟结或竞争</text><text x="60" y="548" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">此图概括联系类型，不是统一行政层级，也不复原某一年的所有封国。</text><text x="60" y="575" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">金文可核验具体册命与赏赐；宗族关系和政治控制随时期、地区而异。</text></g></svg>