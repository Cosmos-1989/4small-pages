<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 595" role="img" aria-labelledby="title desc"><title id="title">二分裂与芽孢数量变化</title><desc id="desc">二分裂产生两子细胞，芽孢形成和萌发前后通常仍为一细胞；用颜色突出耐受结构。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#596f79"/></marker></defs><rect width="1000" height="595" fill="#fffefa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><text x="35" y="42" font-size="28" fill="#5d8e78" text-anchor="start">二分裂</text><text x="35" y="303" font-size="28" fill="#d6ae61" text-anchor="start">芽孢形成与萌发</text><path d="M35 255H965" fill="none" stroke="#d9dedb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="71.0" y="116" width="78" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M92 142q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="285" y="116" width="130" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M307 142q10-15 20 0t12 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M365 142q10-15 20 0t12 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M350 117V167" fill="none" stroke="#5d8e78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="596.0" y="82" width="78" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M617 108q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="596.0" y="151" width="78" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M617 177q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M169 142H261" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M436 142H556" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="88" y="223" font-size="21" fill="#294451" text-anchor="start">1个细胞</text><text x="286" y="223" font-size="21" fill="#294451" text-anchor="start">复制、分配与隔膜</text><text x="595" y="223" font-size="21" fill="#5d8e78" text-anchor="start">2个子细胞</text><text x="790" y="145" font-size="24" fill="#5d8e78" text-anchor="start">数量增加</text><rect x="71.0" y="369" width="78" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M92 395q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="302.5" y="369" width="95" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M332 395q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="364" cy="395" rx="13" ry="19" fill="#f2e3b7" stroke="#d6ae61" stroke-width="3"/><ellipse cx="364" cy="395" rx="6" ry="10" fill="#d6ae61" stroke="none" stroke-width="2"/><ellipse cx="610" cy="395" rx="20" ry="30" fill="#f2e3b7" stroke="#d6ae61" stroke-width="3"/><ellipse cx="610" cy="395" rx="9" ry="18" fill="#d6ae61" stroke="none" stroke-width="2"/><rect x="806.0" y="369" width="78" height="52" rx="25" fill="#dcebe2" stroke="#5d8e78"/><path d="M827 395q12-15 24 0t15 0" fill="none" stroke="#5c8caf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M168 395H279" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M413 395H564" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M653 395H786" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="71" y="467" font-size="21" fill="#294451" text-anchor="start">营养细胞</text><text x="286" y="467" font-size="21" fill="#294451" text-anchor="start">细胞内形成芽孢</text><text x="561" y="467" font-size="21" fill="#294451" text-anchor="start">释放的芽孢</text><text x="806" y="467" font-size="21" fill="#294451" text-anchor="start">萌发恢复</text><text x="230" y="513" font-size="22" fill="#d6ae61" text-anchor="start">一个细胞 → 一个芽孢 → 一个细胞；不构成数量增殖</text><text x="35" y="560" font-size="20" fill="#687e83" text-anchor="start">未按大小、时长或耐受程度比例绘制；芽孢仅见于部分细菌。</text></g></svg>