<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc"><title id="title">汉代欧亚区域交换</title><desc id="desc">东部、河西、中亚和西亚间相邻转运，商品多次易手；不是精确地理或固定古道。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="585" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">汉代欧亚交换的区域转运</text><rect x="45" y="174" width="193" height="179" rx="16" fill="#edf4f5" stroke="#cedcdb" stroke-width="1.5"/><text x="141.5" y="213" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">东部城市与边地</text><text x="141.5" y="251" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">生产、馈赠与交易</text><text x="141.5" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">使节、军队及商人</text><rect x="284" y="174" width="193" height="179" rx="16" fill="#eef3e9" stroke="#cedcdb" stroke-width="1.5"/><text x="380.5" y="213" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">河西走廊</text><text x="380.5" y="251" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">城镇、关塞及邮传</text><text x="380.5" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">粮草和转运联系</text><rect x="523" y="174" width="193" height="179" rx="16" fill="#f2edf5" stroke="#cedcdb" stroke-width="1.5"/><text x="619.5" y="213" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">绿洲与中亚</text><text x="619.5" y="251" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">市场、水源及休整</text><text x="619.5" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">多种语言与政治体</text><rect x="762" y="174" width="193" height="179" rx="16" fill="#f5eee2" stroke="#cedcdb" stroke-width="1.5"/><text x="858.5" y="213" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">西亚及更远地区</text><text x="858.5" y="251" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">中间商与区域交换</text><text x="858.5" y="282" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">商品往往多次易手</text><path d="M242 244h32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M274 288h-32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M481 244h32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M513 288h-32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 244h32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M752 288h-32" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="419" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">相邻转运需要水源、粮草、牲畜及安全保障</text><text x="60" y="489" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">区域关系示意，不是古道地图；连接不表示直达外交或单人走完全程。</text><text x="60" y="516" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">节点大小、距离与箭头不表示贸易规模；实际路线随时期和政治条件改变。</text></g></svg>