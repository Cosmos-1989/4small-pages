<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" role="img" aria-label="氧十八同位素标记水和二氧化碳的对照实验" font-family="'Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC','SimSun',serif"><title>氧十八同位素标记水和二氧化碳的对照实验</title><desc>氧十八同位素标记水和二氧化碳的对照实验；文字、颜色与箭头标明结构和过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#2e3e43"/></marker><linearGradient id="chl" x2="1" y2="1"><stop stop-color="#f6faf5"/><stop offset="1" stop-color="#e8f3e9"/></linearGradient><linearGradient id="mem" x2="0" y2="1"><stop stop-color="#e0ebe0"/><stop offset=".5" stop-color="#f4f7ef"/><stop offset="1" stop-color="#dce9df"/></linearGradient></defs><rect x="0" y="0" width="900" height="492" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><text x="450" y="45" font-size="21" fill="#397b68" text-anchor="middle" font-weight="600">以氧-18 追踪放氧来源</text><line x1="450" y1="78" x2="450" y2="400" stroke="#dfe7e2" stroke-width="1.2" stroke-linecap="round"/><path d="M162 128 L162 230 C113 297 135 351 237 358 C339 351 361 297 312 230 L312 128" stroke="#477b99" stroke-width="2" fill="#f0f7f6" stroke-linecap="round" stroke-linejoin="round"/><line x1="162" y1="128" x2="312" y2="128" stroke="#477b99" stroke-width="2" stroke-linecap="round"/><g transform="translate(209 204) scale(0.62 0.65)"><path d="M0 0 C44 -45 99 -38 118 -14 C90 28 36 36 0 0 Z" fill="#9aca99" stroke="#397b68" stroke-width="2"/><path d="M2 0 C43 6 73 0 109 -15" fill="none" stroke="#397b68" stroke-width="1.8"/></g><path d="M589 128 L589 230 C540 297 562 351 664 358 C766 351 788 297 739 230 L739 128" stroke="#b57939" stroke-width="2" fill="#f9f6ed" stroke-linecap="round" stroke-linejoin="round"/><line x1="589" y1="128" x2="739" y2="128" stroke="#b57939" stroke-width="2" stroke-linecap="round"/><g transform="translate(636 204) scale(0.62 0.65)"><path d="M0 0 C44 -45 99 -38 118 -14 C90 28 36 36 0 0 Z" fill="#9aca99" stroke="#397b68" stroke-width="2"/><path d="M2 0 C43 6 73 0 109 -15" fill="none" stroke="#397b68" stroke-width="1.8"/></g><text x="237" y="104" font-size="17" fill="#477b99" text-anchor="middle" font-weight="600">给水中的氧作标记</text><text x="664" y="104" font-size="17" fill="#b57939" text-anchor="middle" font-weight="600">给 CO₂ 中的氧作标记</text><text x="237" y="267" font-size="18" fill="#2e3e43" text-anchor="middle" font-weight="400">H₂¹⁸O + CO₂</text><text x="664" y="267" font-size="18" fill="#2e3e43" text-anchor="middle" font-weight="400">H₂O + C¹⁸O₂</text><path d="M240 360 L240 389" stroke="#477b99" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M664 360 L664 389" stroke="#b57939" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="237" y="419" font-size="18" fill="#477b99" text-anchor="middle" font-weight="600">释放的 ¹⁸O₂</text><text x="664" y="419" font-size="18" fill="#b57939" text-anchor="middle" font-weight="600">短时放氧未见标记</text><text x="450" y="470" font-size="15" fill="#637276" text-anchor="middle" font-weight="400">对照两组标记去向，可判定放出的 O₂ 的氧原子来自水</text></svg>
