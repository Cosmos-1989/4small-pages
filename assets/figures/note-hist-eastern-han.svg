<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 662" role="img" aria-labelledby="title desc"><title id="title">东汉地方联系</title><desc id="desc">郡县、乡亭吏员、居民家庭与强势家族形成行政、申诉和社会联系，非固定阶层结构。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="662" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">东汉地方行政与社会联系</text><rect x="110" y="127" width="294" height="132" rx="16" fill="#edf4f5" stroke="#cedcdb" stroke-width="1.5"/><text x="257.0" y="166" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">郡县官署</text><text x="257.0" y="204" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">律令、案件与行政文书</text><text x="257.0" y="235" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">地方官员和属吏</text><rect x="596" y="127" width="294" height="132" rx="16" fill="#eef3e9" stroke="#cedcdb" stroke-width="1.5"/><text x="743.0" y="166" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">乡亭吏员</text><text x="743.0" y="204" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">调查、征发及传递文书</text><text x="743.0" y="235" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">本地人际联系</text><rect x="110" y="383" width="294" height="132" rx="16" fill="#f5eee2" stroke="#cedcdb" stroke-width="1.5"/><text x="257.0" y="422" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">居民家庭</text><text x="257.0" y="460" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">生产、税役及家庭纠纷</text><text x="257.0" y="491" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">申诉和情况报告</text><rect x="596" y="383" width="294" height="132" rx="16" fill="#f2edf5" stroke="#cedcdb" stroke-width="1.5"/><text x="743.0" y="422" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">地方强势家族</text><text x="743.0" y="460" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">土地、亲属及声望网络</text><text x="743.0" y="491" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">合作或利益冲突</text><path d="M412 176H586" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M586 224H412" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="157" font-size="19" fill="#596b74" text-anchor="middle" font-weight="400">行政与报告</text><path d="M219 267V373" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M295 373V267" fill="none" stroke="#6d8c93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="194" y="329" font-size="18" fill="#596b74" text-anchor="end" font-weight="400">税役</text><text x="319" y="329" font-size="18" fill="#596b74" text-anchor="start" font-weight="400">申诉</text><path d="M412 421H586" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M586 478H412" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="500" y="458" font-size="18" fill="#596b74" text-anchor="middle" font-weight="400">资源与依附</text><path d="M698 269V373" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M790 373V269" fill="none" stroke="#6d8c93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="744" y="330" font-size="18" fill="#596b74" text-anchor="middle" font-weight="400">人际联系</text><text x="60" y="581" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">只选取部分关系，不复原完整基层建制；协作与冲突均可能存在。</text><text x="60" y="608" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">五一广场简提供一县的具体材料，不能直接代表全帝国、全时期。</text></g></svg>