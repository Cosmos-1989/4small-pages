<line x1="48" y1="494" x2="1052" y2="494" stroke="#d5e2dd" stroke-width="2" />
<text x="50" y="527" font-size="18" fill="#526a72" text-anchor="start" font-weight="normal" >示意一种得水河情形；地下水方向取决于水力水头。</text>
