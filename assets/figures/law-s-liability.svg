<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">侵权归责与责任承担关系</title><desc id="desc">并列两类分析问题，左侧为归责依据，右侧为多人责任关系，不表示金额、大小或频率。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="1000" height="480" fill="#fff"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="42" y="42" font-size="27" text-anchor="start" fill="#293f47" font-weight="bold">侵权问题须分别回答两个层次</text><rect x="42" y="85" width="434" height="270" rx="12" fill="#edf4f5" stroke="#a6bfc3" stroke-width="1.6"/><text x="259" y="133" font-size="28" text-anchor="middle" fill="#293f47" font-weight="bold">责任为何成立？</text><text x="259" y="196" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">过错责任：依法证明过错</text><text x="259" y="232" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">过错推定：依法分配反证</text><text x="259" y="268" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">无过错责任：法定特别规则</text><rect x="524" y="85" width="434" height="270" rx="12" fill="#f8f1e4" stroke="#a6bfc3" stroke-width="1.6"/><text x="741" y="133" font-size="28" text-anchor="middle" fill="#293f47" font-weight="bold">多人怎样承担？</text><text x="741" y="196" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">按份：依法确定各自份额</text><text x="741" y="232" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">连带：须有法律或约定依据</text><text x="741" y="268" font-size="23" text-anchor="middle" fill="#293f47" font-weight="normal">补充：依特别规定及责任顺序</text><text x="500" y="405" font-size="24" text-anchor="middle" fill="#293f47" font-weight="normal">“补充责任”不是与“无过错责任”并列的归责原则。</text><text x="500" y="447" font-size="20" text-anchor="middle" fill="#60757b" font-weight="normal">构成要件、因果关系、抗辩和责任范围，仍须依具体法律事实判断。</text></g></svg>