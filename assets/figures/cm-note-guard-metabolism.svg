<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc"><title id="title">保卫细胞的能量、溶质与水分联系</title><desc id="desc">保卫细胞通过ATP驱动的膜运输、溶质积累及水分移动改变膨压。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#82969b"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="460" fill="white"/><rect x="30" y="55" width="260" height="102" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="160.0" y="99.5" text-anchor="middle" font-size="22" fill="#2d414b">线粒体</text><text x="160.0" y="128.5" text-anchor="middle" font-size="22" fill="#2d414b">呼吸供应ATP</text><rect x="360" y="55" width="260" height="102" rx="10" fill="#f5eee5" stroke="#cbd9dc"/><text x="490.0" y="99.5" text-anchor="middle" font-size="22" fill="#2d414b">细胞质</text><text x="490.0" y="128.5" text-anchor="middle" font-size="22" fill="#2d414b">ATP用于膜泵</text><rect x="690" y="55" width="260" height="102" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="820.0" y="99.5" text-anchor="middle" font-size="22" fill="#2d414b">叶绿体</text><text x="820.0" y="128.5" text-anchor="middle" font-size="22" fill="#2d414b">NTT输入ATP</text><path d="M 295 106 L 352 106" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 625 106 L 682 106" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="185" y="280" width="610" height="100" rx="10" fill="#edf5ef" stroke="#cbd9dc"/><text x="490.0" y="323.5" text-anchor="middle" font-size="22" fill="#2d414b">质膜H⁺泵与离子通道</text><text x="490.0" y="352.5" text-anchor="middle" font-size="22" fill="#2d414b">K⁺及其他溶质积累 → 水势下降 → 吸水</text><path d="M 490 165 L 490 270" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="490" y="415" text-anchor="middle" font-size="20" fill="#2d414b">保卫细胞膨压升高促进气孔开放；代谢贡献依物种与条件改变。</text></svg>