<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">叶片蒸发与木质部内聚张力</title><desc id="desc">根、茎木质部与叶片构成水分通路，叶片蒸发形成张力；局部放大示意凹形液面和水汽逸出。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#4b91ad"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#659b7a"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#c59a51"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#b87770"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, STSong, SimSun, serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="35" font-size="22" fill="#334b55" text-anchor="start">土壤—植物—大气连续体</text><rect x="40" y="318" width="290" height="90" rx="16" fill="#f4eee2" stroke="none" stroke-width="2"/><text x="65" y="388" font-size="19" fill="#334b55" text-anchor="start">土壤水</text><path d="M186 330 C158 354 148 374 102 373 M186 334 C219 361 241 372 285 372" stroke="#659b7a" stroke-width="7" fill="none" /><path d="M187 332 L187 155 C190 118 226 109 266 102" stroke="#659b7a" stroke-width="12" fill="none" /><path d="M266 102 C296 65 346 63 375 65 C370 102 329 123 266 102" stroke="#659b7a" stroke-width="2" fill="#dcebcf" /><path d="M181 335 L181 156 C183 119 224 112 268 103" stroke="#4b91ad" stroke-width="4" fill="none" /><path d="M118 365 C152 362 159 347 180 332" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M180 281 L180 213" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M202 127 L260 108" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M324 84 C346 48 374 44 404 47" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="412" y="50" font-size="18" fill="#4b91ad" text-anchor="start">水汽进入空气</text><text x="42" y="145" font-size="19" fill="#334b55" text-anchor="start">水势总体降低</text><path d="M82 280 L82 177" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="225" y="248" font-size="19" fill="#4b91ad" text-anchor="start">木质部负压</text><path d="M315 106 L465 152" stroke="#334b55" stroke-width="1" fill="none" stroke-dasharray="4 5"/><rect x="463" y="135" width="267" height="211" rx="14" fill="#fafbf7" stroke="#659b7a" stroke-width="2"/><text x="484" y="165" font-size="18" fill="#334b55" text-anchor="start">叶肉细胞壁的局部放大</text><path d="M502 191 L502 289 L687 289 L687 191" stroke="#659b7a" stroke-width="5" fill="none" /><path d="M507 224 Q594 266 682 224 L682 285 L507 285 Z" stroke="#4b91ad" stroke-width="2" fill="#dceef6" /><path d="M548 225 L541 192" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M636 225 L644 192" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="485" y="323" font-size="17" fill="#334b55" text-anchor="start">弯月面形成张力，传至水柱</text><text x="40" y="447" font-size="18" fill="#334b55" text-anchor="start">连续水柱传递张力；气穴可中断部分输水通路。</text></g></svg>