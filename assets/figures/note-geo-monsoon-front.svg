hor="start" >较冷空气</text><text x="450" y="116" fill="#283c46" font-size="23" font-weight="400" text-anchor="start" >云层与降水可能形成</text><path d="M628 127 L678 161" fill="none" stroke="#63757a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><text x="815" y="85" fill="#bd8553" font-size="22" font-weight="400" text-anchor="start" >太阳短波辐射</text><text x="710" y="365" fill="#63757a" font-size="20" font-weight="400" text-anchor="start" >云可削弱海面所收短波</text></g></svg>