<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">图甲：坡面覆盖影响雨蚀与输沙路径</title><desc id="desc">同坡度概念示意，覆盖使雨滴与裸土隔离，裸坡更易发生细沟汇流。</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#287e9c"/></marker>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#4d8b78"/></marker>
<marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#b77949"/></marker>
<marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#273b45"/></marker>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9eff0"/><stop offset="1" stop-color="#bedde4"/></linearGradient>
<linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7d2ad"/><stop offset="1" stop-color="#c9a981"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2ded0"/><stop offset="1" stop-color="#bcc1b9"/></linearGradient>
</defs>
<g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="1100" height="560" fill="#fcfdfa"/>
<text x="48" y="55" font-size="27" fill="#273b45" text-anchor="start" font-weight="bold" >坡面覆盖影响雨蚀与输沙路径</text>
<line x1="48" y1="76" x2="1052" y2="76" stroke="#d5e2dd" stroke-width="2" />
