e="#287e9c" stroke-width="3" marker-end="url(#blue)"/><path d="M390 137 L382 280" fill="none" stroke="#287e9c" stroke-width="3" marker-end="url(#blue)"/><path d="M647 263 C718 275 776 295 825 309 C895 331 950 351 1008 376" fill="none" stroke="#b77949" stroke-width="4" marker-end="url(#amber)"/><path d="M744 274 C764 304 794 325 830 345 M838 302 C850 329 870 346 894 357" fill="none" stroke="#9d6945" stroke-width="3" /><path d="M292 275 C353 291 409 316 480 348" fill="none" stroke="#8fa996" stroke-width="2.5" /><path d="M993 379 C1008 381 1020 389 1034 398" fill="none" stroke="#b77949" stroke-width="3" /><text x="289" y="192" font-size="22" fill="#4d8b78" text-anchor="middle" font-weight="normal" >植被覆盖坡面</text><text x="818" y="192" font-size="22" fill="#b77949" text-anchor="middle" font-weight="normal" >裸露坡面</text><line x1="384" y1="313" x2="264" y2="407" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="384" cy="313" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="78" y="421" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >覆盖减弱雨滴打击</text><line x1="809" y1="325" x2="685" y2="427" stroke="#8a9b9c" stroke-width="1.8" /><circle cx="809" cy="325" r="3" fill="#8a9b9c" stroke="none" stroke-width="1"/><text x="603" y="438" font-size="20" fill="#526a72" text-anchor="start" font-weight="normal" >细沟汇流并输沙</text>
<line x1="48" y1="494" x2="1052" y2="494" stroke="#d5e2dd" stroke-width="2" />
<text x="50" y="527" font-size="18" fill="#526a72" text-anchor="start" font-weight="normal" >定性对照；覆盖不意味着零侵蚀，实际风险需现场评价。</text>
