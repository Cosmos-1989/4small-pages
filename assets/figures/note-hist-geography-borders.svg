<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">历史地图需要区分的关系</title><desc id="desc">历史地图需要区分的关系；行政单位：地名与治所、隶属与等级、设置及撤并时间；实际治理：户籍与赋役、军事与交通、地方权力关系；对外联系：盟约与使节、朝贡与互市、交流及竞争</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">历史地图需要区分的关系</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">行政单位</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地名与治所</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">隶属与等级</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">设置及撤并时间</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">实际治理</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">户籍与赋役</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军事与交通</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地方权力关系</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">对外联系</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">盟约与使节</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">朝贡与互市</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">交流及竞争</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三栏为关系类型；不表示任何具体时期的疆界。</text></g></svg>