<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">国家制度的形成</title><desc id="desc">国家制度的形成；1949年9月：政协与《共同纲领》；1949年10月：中华人民共和国成立；1950年：土地与婚姻制度改革；1953年：经济转型展开；1954年9月：第一部宪法</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">国家制度的形成</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1949年9月</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">政协与《共同纲领》</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">确定过渡时期的国家组织及经济原则</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1949年10月</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">中华人民共和国成立</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">中央人民政府建立，接收与建政继续</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1950年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">土地与婚姻制度改革</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">财产关系及家庭权利的法律基础改变</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1953年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">经济转型展开</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">第一个五年计划与社会主义改造</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1954年9月</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">第一部宪法</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">全国人大、国务院等国家机构形成</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>