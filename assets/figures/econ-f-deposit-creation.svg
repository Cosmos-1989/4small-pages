<svg xmlns="http://www.w3.org/2000/svg" width="970" height="480" viewBox="0 0 970 480" role="img" aria-labelledby="title desc">
<title id="title">贷款形成的资产与负债</title><desc id="desc">在既有余额不变的前提下，新增100单位贷款同时记为银行的贷款资产和存款负债，客户的存款资产和借款负债也各增加100。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#36758a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family='"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif'><text x="250" y="46" font-size="26" text-anchor="middle" fill="#253f49" font-weight="normal">商业银行</text><rect x="40" y="70" width="420" height="225" rx="8" fill="white" stroke="#cad5d9" stroke-width="1.3"/><rect x="40" y="70" width="420" height="52" rx="8" fill="#edf3f5" stroke="#cad5d9" stroke-width="1.3"/><line x1="40" y1="122" x2="460" y2="122" stroke="#cad5d9" stroke-width="1.4"/><line x1="250" y1="70" x2="250" y2="295" stroke="#cad5d9" stroke-width="1.4"/><text x="145" y="105" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">资产变化</text><text x="355" y="105" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">负债变化</text><text x="145" y="172" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">贷款资产</text><text x="355" y="172" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">客户存款负债</text><text x="145" y="235" font-size="34" text-anchor="middle" fill="#36758a" font-weight="normal">＋100</text><text x="355" y="235" font-size="34" text-anchor="middle" fill="#b66d50" font-weight="normal">＋100</text><text x="720" y="46" font-size="26" text-anchor="middle" fill="#253f49" font-weight="normal">借款客户</text><rect x="510" y="70" width="420" height="225" rx="8" fill="white" stroke="#cad5d9" stroke-width="1.3"/><rect x="510" y="70" width="420" height="52" rx="8" fill="#edf3f5" stroke="#cad5d9" stroke-width="1.3"/><line x1="510" y1="122" x2="930" y2="122" stroke="#cad5d9" stroke-width="1.4"/><line x1="720" y1="70" x2="720" y2="295" stroke="#cad5d9" stroke-width="1.4"/><text x="615" y="105" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">资产变化</text><text x="825" y="105" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">负债变化</text><text x="615" y="172" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">银行存款资产</text><text x="825" y="172" font-size="22" text-anchor="middle" fill="#253f49" font-weight="normal">借款负债</text><text x="615" y="235" font-size="34" text-anchor="middle" fill="#36758a" font-weight="normal">＋100</text><text x="825" y="235" font-size="34" text-anchor="middle" fill="#b66d50" font-weight="normal">＋100</text><text x="250" y="335" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">贷款与存款同时增加</text><text x="720" y="335" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">存款与债务同时增加</text><line x1="80" y1="365" x2="890" y2="365" stroke="#cad5d9" stroke-width="1.2"/><text x="485" y="407" font-size="23" text-anchor="middle" fill="#253f49" font-weight="normal">新增支付能力伴随等额债务，客户净金融财富未增加100。</text><text x="485" y="451" font-size="19" text-anchor="middle" fill="#5c737c" font-weight="normal">只示新增记账；后续跨行支付仍需结算资金，贷款还本则通常同时减少贷款和存款。</text></g></svg>