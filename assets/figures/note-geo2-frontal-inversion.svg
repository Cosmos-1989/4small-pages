363 931 318 943 288 C960 254 996 239 1008 193" fill="none" stroke="#bb7057" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="892" y="141" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >气温剖面（定性）</text><text x="915" y="448" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >温度 →</text><text x="867" y="317" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" transform="rotate(-90 867 317)">高度</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >逆温只存在于具体层段；层高、温差与风切变均须探空资料判定。</text></svg>