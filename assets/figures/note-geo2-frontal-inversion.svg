<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：冷锋楔入与锋面逆温</title><desc id="desc">冷空气楔入暖空气下方，锋区垂向上可出现温度随高度升高的逆温层，且上下层风向可能不同。</desc><defs>
