<svg xmlns="http://www.w3.org/2000/svg" width="1195" height="312" viewBox="0 0 1195 312" role="img"><title>史籍记载校勘表</title><desc>列出爵位、籍贯和任职地的原文、其他文献和校勘意见。</desc><rect width="1195" height="312" fill="white"/><g font-family="Songti SC, SimSun, serif" font-size="18" fill="#202737"><rect x="0" y="4" width="1195" height="76" fill="#eef3f2" stroke="#9ba8ab"/><path d="M0 4v76" stroke="#b2bfc1"/><text x="8" y="43.0" font-size="18" dominant-baseline="middle">事例</text><path d="M110 4v76" stroke="#b2bfc1"/><text x="118" y="43.0" font-size="18" dominant-baseline="middle">《建康实录》</text><path d="M335 4v76" stroke="#b2bfc1"/><text x="343" y="43.0" font-size="18" dominant-baseline="middle">史料</text><path d="M765 4v76" stroke="#b2bfc1"/><text x="773" y="43.0" font-size="18" dominant-baseline="middle">校勘记</text><rect x="0" y="80" width="1195" height="76" fill="white" stroke="#9ba8ab"/><path d="M0 80v76" stroke="#b2bfc1"/><text x="8" y="119.0" font-size="18" dominant-baseline="middle">（1）爵位</text><path d="M110 80v76" stroke="#b2bfc1"/><text x="118" y="109.5" font-size="16" dominant-baseline="middle">徐孝嗣，年八岁，</text><text x="118" y="128.5" font-size="16" dominant-baseline="middle">袭爵枝江县侯。</text><path d="M335 80v76" stroke="#b2bfc1"/><text x="343" y="109.5" font-size="16" dominant-baseline="middle">《南齐书》“（徐孝嗣）八岁，袭爵</text><text x="343" y="128.5" font-size="16" dominant-baseline="middle">枝江县公”。《宋书》“枝江侯相”。</text><path d="M765 80v76" stroke="#b2bfc1"/><text x="773" y="109.5" font-size="16" dominant-baseline="middle">据《宋书》，《建康实录》“县侯”记载</text><text x="773" y="128.5" font-size="16" dominant-baseline="middle">无误；而《南齐书》“县公”当为“县侯”之误。</text><rect x="0" y="156" width="1195" height="76" fill="white" stroke="#9ba8ab"/><path d="M0 156v76" stroke="#b2bfc1"/><text x="8" y="195.0" font-size="18" dominant-baseline="middle">（2）籍贯</text><path d="M110 156v76" stroke="#b2bfc1"/><text x="118" y="185.5" font-size="16" dominant-baseline="middle">刘延孙，彭城吕梁</text><text x="118" y="204.5" font-size="16" dominant-baseline="middle">人也。</text><path d="M335 156v76" stroke="#b2bfc1"/><text x="343" y="176.0" font-size="16" dominant-baseline="middle">《宋书》“刘延孙，彭城吕人”。</text><text x="343" y="195.0" font-size="16" dominant-baseline="middle">《南史》“刘氏之居彭城者，分为三里”；</text><text x="343" y="214.0" font-size="16" dominant-baseline="middle">“延孙所居吕县”。</text><path d="M765 156v76" stroke="#b2bfc1"/><text x="773" y="195.0" font-size="18" dominant-baseline="middle"></text><rect x="0" y="232" width="1195" height="76" fill="white" stroke="#9ba8ab"/><path d="M0 232v76" stroke="#b2bfc1"/><text x="8" y="271.0" font-size="18" dominant-baseline="middle">（3）任职地</text><path d="M110 232v76" stroke="#b2bfc1"/><text x="118" y="271.0" font-size="18" dominant-baseline="middle">南昌太守孱陵侯蒙卒。</text><path d="M335 232v76" stroke="#b2bfc1"/><text x="343" y="261.5" font-size="16" dominant-baseline="middle">《三国志》“遂到南郡，士仁、麋芳皆降”；</text><text x="343" y="280.5" font-size="16" dominant-baseline="middle">“以蒙为南郡太守，封孱陵侯”。</text><path d="M765 232v76" stroke="#b2bfc1"/><text x="773" y="261.5" font-size="16" dominant-baseline="middle">《建康实录》“南昌”当为“南郡”之误，</text><text x="773" y="280.5" font-size="16" dominant-baseline="middle">因《三国志》的相关记述更加完整。</text></g></svg>