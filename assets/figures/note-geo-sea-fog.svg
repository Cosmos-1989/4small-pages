<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">两种海雾形成的温差条件</title><desc id="desc">暖湿空气越过冷海面可被冷却形成平流雾；冷空气越过暖水面时蒸发供湿、混合冷却可形成蒸发雾。</desc>
<defs><marker id="a-blue" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#3a84a5"/></marker><marker id="a-teal" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#397b70"/></marker><marker id="a-warm" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d07660"/></marker><marker id="a-ochre" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#bd8553"/></marker><marker id="a-ink" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#283c46"/></marker></defs>
<rect width="1100" height="620" fill="#ffffff"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><line x1="550" y1="76" x2="550" y2="550" stroke="#a6b8b7" stroke-width="2" stroke-linecap="round" /><rect x="45" y="388" width="470" height="160" rx="0" fill="#e7f3f5" /><path d="M45 389 Q160 378 280 389 T515 389" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="580" y="388" width="470" height="160" rx="0" fill="#e7f3f5" /><path d="M580 389 Q695 378 815 389 T1050 389" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="86" y="101" fill="#283c46" font-size="24" font-weight="600" text-anchor="start" >甲  暖湿气流经过较冷海面</text><path d="M94 204 C220 197 349 200 476 217" fill="none" stroke="#d07660" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-warm)" /><text x="96" y="185" fill="#d07660" font-size="21" font-weight="400" text-anchor="start" >暖湿空气</text><path d="M98 289 C210 275 327 292 479 286" fill="none" stroke="#a6b8b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M104 313 C233 299 351 320 489 307" fill="none" stroke="#a6b8b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10"/><path d="M323 241 C323 291 326 326 326 366" fill="none" stroke="#3a84a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" /><text x="113" y="363" fill="#366b89" font-size="20" font-weight="400" text-anchor="start" >空气冷却至饱和 → 平流雾</text><text x="122" y="489" fill="#3a84a5" font-size="25" font-weight="600" text-anchor="start" >冷海面</text><text x="615" y="101" fill="#283c46" font-size="24" font-weight="600" text-anchor="start" >乙  冷空气经过较暖海面</text><path d="M608 204 C751 193 879 202 1008 220" fill="none" stroke="#366b89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-ink)" /><text x="618" y="186" fill="#366b89" font-size="21" font-weight="400" text-anchor="start" >冷空气</text><path d="M630 291 C723 272 835 286 972 283" fill="none" stroke="#a6b8b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M632 317 C768 300 895 319 980 304" fill="none" stroke="#a6b8b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10"/><path d="M706 364 C710 337 717 319 721 297" fill="none" stroke="#397b70" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" /><path d="M826 364 C824 338 827 319 831 297" fill="none" stroke="#397b70" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" /><text x="621" y="363" fill="#397b70" font-size="20" font-weight="400" text-anchor="start" >蒸发供湿＋混合冷却 → 蒸发雾</text><text x="668" y="489" fill="#d07660" font-size="25" font-weight="600" text-anchor="start" >暖海面</text></g></svg>