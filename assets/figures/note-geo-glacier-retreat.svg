ill="#63757a" font-size="20" font-weight="400" text-anchor="middle" >冰川谷地横剖面</text><text x="115" y="583" fill="#63757a" font-size="19" font-weight="400" text-anchor="start" >虚线为较早冰面；岩块运动还取决于裂隙、冻融与坡度</text></g></svg>