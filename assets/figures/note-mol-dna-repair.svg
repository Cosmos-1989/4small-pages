<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">核苷酸切除修复</title><desc id="desc">受损DNA一条链经识别、双侧切除、以完整互补链为模板填补，再由连接酶封口。</desc><defs><marker id="arrb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#347b94"/></marker><marker id="arrc" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#d5735f"/></marker><marker id="arrm" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6 1 11Z" fill="#5c7280"/></marker></defs><rect width="1000" height="600" fill="#fffdfa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="67" text-anchor="start" font-size="26" fill="#263f4a" font-weight="bold" >局部损伤</text><text x="386" y="67" text-anchor="start" font-size="26" fill="#263f4a" font-weight="bold" >切除受损片段</text><text x="715" y="67" text-anchor="start" font-size="26" fill="#263f4a" font-weight="bold" >填补与封口</text><rect x="44" y="100" width="285" height="390" rx="20" fill="#f6f8f7" stroke="#d8e3e4" stroke-width="2" /><rect x="372" y="100" width="285" height="390" rx="20" fill="#f6f8f7" stroke="#d8e3e4" stroke-width="2" /><rect x="700" y="100" width="285" height="390" rx="20" fill="#f6f8f7" stroke="#d8e3e4" stroke-width="2" /><line x1="83" y1="214" x2="292" y2="214" stroke="#d5735f" stroke-width="6" stroke-linecap="round"  /><line x1="83" y1="291" x2="292" y2="291" stroke="#347b94" stroke-width="6" stroke-linecap="round"  /><path d="M171 214Q187 177 208 214" fill="none" stroke="#d5735f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="186" y="176" text-anchor="middle" font-size="22" fill="#d5735f" font-weight="normal" >局部畸变</text><text x="185" y="365" text-anchor="middle" font-size="22"