<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">文化大革命的主要阶段</title><desc id="desc">文化大革命的主要阶段；1966年：发动与群众动员；1967年：夺权与派性冲突；1968年：革命委员会与清查；1971年：林彪事件；1976年：文化大革命结束；1981年：历史决议</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">文化大革命的主要阶段</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1966年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">发动与群众动员</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">最高政治权威支持冲击既有机构</text><circle cx="253" cy="197.0" r="9" fill="#5b8b79"/><text x="224" y="205.0" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1967年</text><text x="285" y="205.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">夺权与派性冲突</text><text x="285" y="236.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">多地发生武斗，军队介入</text><circle cx="253" cy="283.0" r="9" fill="#886b95"/><text x="224" y="291.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1968年</text><text x="285" y="291.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">革命委员会与清查</text><text x="285" y="322.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">机构重建后，迫害和杀害仍继续</text><circle cx="253" cy="369.0" r="9" fill="#b68b4d"/><text x="224" y="377.0" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1971年</text><text x="285" y="377.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">林彪事件</text><text x="285" y="408.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">政治格局再次变化</text><circle cx="253" cy="455.0" r="9" fill="#b76759"/><text x="224" y="463.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1976年</text><text x="285" y="463.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">文化大革命结束</text><text x="285" y="494.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">毛泽东去世，江青等人随后被捕</text><circle cx="253" cy="541.0" r="9" fill="#42788f"/><text x="224" y="549.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1981年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">历史决议</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">全面否定运动，确认主要责任及制度教训</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">阶段按时间排列，间隔不代表历时比例；地方进程和暴力发生时间存在差异。</text></g></svg>