<svg xmlns="http://www.w3.org/2000/svg" width="830" height="268" viewBox="0 0 830 268" role="img"><title>非洲鼓相关材料表</title><desc>按讲义原题重新排版的非洲鼓相关材料。</desc><rect width="830" height="268" fill="white"/><g font-family="Songti SC, SimSun, serif" font-size="18" fill="#202737"><rect x="0" y="4" width="830" height="52" fill="#eef3f2" stroke="#9ba8ab"/><path d="M0 4v52" stroke="#b2bfc1"/><text x="8" y="31.0" font-size="18" dominant-baseline="middle">时间</text><path d="M140 4v52" stroke="#b2bfc1"/><text x="148" y="31.0" font-size="18" dominant-baseline="middle">使用场景</text><path d="M310 4v52" stroke="#b2bfc1"/><text x="318" y="31.0" font-size="18" dominant-baseline="middle">用途</text><rect x="0" y="56" width="830" height="52" fill="white" stroke="#9ba8ab"/><path d="M0 56v52" stroke="#b2bfc1"/><text x="8" y="83.0" font-size="18" dominant-baseline="middle">奴隶贸易前</text><path d="M140 56v52" stroke="#b2bfc1"/><text x="148" y="83.0" font-size="18" dominant-baseline="middle">非洲</text><path d="M310 56v52" stroke="#b2bfc1"/><text x="318" y="83.0" font-size="18" dominant-baseline="middle">庆祝节日，或用于战争场合。</text><rect x="0" y="108" width="830" height="52" fill="white" stroke="#9ba8ab"/><path d="M0 108v52" stroke="#b2bfc1"/><text x="8" y="135.0" font-size="18" dominant-baseline="middle">16～19世纪</text><path d="M140 108v52" stroke="#b2bfc1"/><text x="148" y="135.0" font-size="18" dominant-baseline="middle">运奴船</text><path d="M310 108v52" stroke="#b2bfc1"/><text x="318" y="125.5" font-size="16" dominant-baseline="middle">船主让奴隶随鼓点跳舞，</text><text x="318" y="144.5" font-size="16" dominant-baseline="middle">以保持身体健康。</text><rect x="0" y="160" width="830" height="52" fill="white" stroke="#9ba8ab"/><path d="M0 160v52" stroke="#b2bfc1"/><text x="8" y="187.0" font-size="18" dominant-baseline="middle">16～19世纪</text><path d="M140 160v52" stroke="#b2bfc1"/><text x="148" y="187.0" font-size="18" dominant-baseline="middle">美洲种植园</text><path d="M310 160v52" stroke="#b2bfc1"/><text x="318" y="177.5" font-size="16" dominant-baseline="middle">常被奴隶用作召集武装起义的工具，</text><text x="318" y="196.5" font-size="16" dominant-baseline="middle">被部分种植园主禁用。</text><rect x="0" y="212" width="830" height="52" fill="white" stroke="#9ba8ab"/><path d="M0 212v52" stroke="#b2bfc1"/><text x="8" y="239.0" font-size="18" dominant-baseline="middle">19世纪末</text><path d="M140 212v52" stroke="#b2bfc1"/><text x="148" y="239.0" font-size="18" dominant-baseline="middle">美国流行乐坛</text><path d="M310 212v52" stroke="#b2bfc1"/><text x="318" y="229.5" font-size="16" dominant-baseline="middle">非洲音乐的重要元素、后与欧洲音乐结合，</text><text x="318" y="248.5" font-size="16" dominant-baseline="middle">衍生出了爵士乐。</text></g></svg>