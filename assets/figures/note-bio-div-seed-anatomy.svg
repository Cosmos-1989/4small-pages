<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">菜豆与玉米的种子储备</title><desc id="desc">菜豆两片子叶富含储备，胚轴和胚芽胚根相连；玉米有胚乳和盾片，颖果外层为贴合的果皮与种皮。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#596f79"/></marker></defs><rect width="1000" height="540" fill="#fffefa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><text x="255" y="44" font-size="25" fill="#5d8e78" text-anchor="middle">菜豆种子（去一片子叶）</text><text x="755" y="44" font-size="28" fill="#5c8caf" text-anchor="middle">玉米颖果</text><path d="M500 68V470" fill="none" stroke="#d9dedb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="240" cy="250" rx="135" ry="170" fill="#ecdbb4" stroke="#d6ae61" stroke-width="5"/><path d="M240 99C154 99 122 180 122 258C122 340 164 402 240 402C318 402 357 331 357 251C357 168 315 99 240 99Z" fill="#cdddc4" stroke="#5d8e78" stroke-width="2"/><path d="M156 151C136 202 140 290 188 346" fill="none" stroke="#fffefa" stroke-width="22"/><path d="M156 180C146 205 151 239 160 263C166 291 177 318 188 339" fill="none" stroke="#bd7f79" stroke-width="13" stroke-linecap="round"/><path d="M156 180Q137 159 148 143Q168 153 165 173Q179 153 188 164Q181 185 159 193" fill="#8bae87" stroke="#5d8e78" stroke-width="2"/><text x="33" y="104" font-size="23" fill="#294451" text-anchor="start">种皮</text><path d="M85 100L145 120" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="224" font-size="23" fill="#294451" text-anchor="start">子叶</text><path d="M85 219L231 233" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="163" font-size="23" fill="#294451" text-anchor="start">胚芽</text><path d="M88 157L153 149" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="302" y="376" font-size="23" fill="#294451" text-anchor="start">胚根</text><path d="M298 368L190 337" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="43" y="457" font-size="22" fill="#5d8e78" text-anchor="start">储备主要位于两片子叶</text><path d="M760 94C832 90 882 148 900 242C918 344 876 409 787 416C717 421 661 361 661 258C660 167 697 101 760 94Z" fill="#e9d3ad" stroke="#b48d5b" stroke-width="5"/><path d="M760 107C825 106 869 155 884 244C900 332 864 393 790 401C759 404 747 369 747 313C747 228 729 164 760 107Z" fill="#f3e7be" stroke="#d6ae61" stroke-width="2"/><path d="M738 180C779 189 781 347 748 373C719 345 711 246 738 180Z" fill="#d2e3cd" stroke="#5d8e78" stroke-width="2"/><path d="M712 226C691 240 696 298 714 326" fill="none" stroke="#bd7f79" stroke-width="12" stroke-linecap="round"/><path d="M709 229Q687 209 704 193Q721 207 715 237" fill="#8bae87" stroke="#5d8e78" stroke-width="2"/><text x="618" y="102" font-size="22" fill="#294451" text-anchor="start">果皮与种皮</text><path d="M734 105L725 114" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="840" y="157" font-size="23" fill="#294451" text-anchor="start">胚乳</text><path d="M835 165L814 205" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="552" y="271" font-size="21" fill="#294451" text-anchor="start">盾片（一片子叶）</text><path d="M717 268L747 275" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="587" y="372" font-size="21" fill="#294451" text-anchor="start">胚轴与胚根</text><path d="M697 365L711 325" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="590" y="457" font-size="22" fill="#5c8caf" text-anchor="start">储备主要位于胚乳</text><text x="40" y="506" font-size="20" fill="#687e83" text-anchor="start">菜豆去一片子叶，玉米作纵剖示意；各组织大小不按比例。</text></g></svg>