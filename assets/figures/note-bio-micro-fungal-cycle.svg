<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">担子菌生活史的核相</title><desc id="desc">单倍体担孢子萌发为单核菌丝，质配后为双核菌丝，形成子实体；担子内核配后短暂二倍体，减数分裂产生单倍体核，再形成担孢子。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#596f79"/></marker></defs><rect width="1000" height="620" fill="#fffefa"/><g font-family="Songti SC, STSong, SimSun, Noto Serif CJK SC, serif"><text x="42" y="43" font-size="28" fill="#294451" text-anchor="start">担子菌型生活史</text><text x="620" y="43" font-size="19" fill="#687e83" text-anchor="start">蓝、紫为不同单倍体核；金色为融合核</text><ellipse cx="95" cy="125" rx="12" ry="17" fill="#f5f4ec" stroke="#5c8caf" stroke-width="2"/><circle cx="95" cy="125" r="4" fill="#5c8caf" /><ellipse cx="128" cy="169" rx="12" ry="17" fill="#f5f4ec" stroke="#92749d" stroke-width="2"/><circle cx="128" cy="169" r="4" fill="#92749d" /><text x="54" y="219" font-size="23" fill="#294451" text-anchor="start">担孢子 n</text><path d="M151 147H239" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M260 156C295 137 314 166 345 143M294 149L300 117" fill="none" stroke="#5d8e78" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="276" cy="151" r="4" fill="#5c8caf" /><circle cx="310" cy="150" r="4" fill="#5c8caf" /><path d="M260 185C290 169 317 200 345 183" fill="none" stroke="#5d8e78" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="276" cy="180" r="4" fill="#92749d" /><circle cx="310" cy="187" r="4" fill="#92749d" /><text x="248" y="244" font-size="23" fill="#294451" text-anchor="start">单核菌丝 n</text><path d="M371 168H479" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="398" y="139" font-size="22" fill="#294451" text-anchor="start">质配</text><path d="M500 164C539 144 567 183 610 160M553 165L567 129" fill="none" stroke="#5d8e78" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><circle cx="519" cy="159" r="3.8" fill="#5c8caf" /><circle cx="526" cy="164" r="3.8" fill="#92749d" /><circle cx="562" cy="163" r="3.8" fill="#5c8caf" /><circle cx="569" cy="168" r="3.8" fill="#92749d" /><circle cx="592" cy="162" r="3.8" fill="#5c8caf" /><circle cx="599" cy="167" r="3.8" fill="#92749d" /><text x="486" y="220" font-size="23" fill="#294451" text-anchor="start">双核菌丝 n+n</text><path d="M637 170C705 170 733 182 764 217" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M775 245C781 195 862 192 876 245Q825 267 775 245Z" fill="#c2a3bc" stroke="#92749d" stroke-width="2"/><path d="M817 252L810 329Q829 339 845 328L837 252" fill="#e6d9e4" stroke="#92749d" stroke-width="2"/><text x="747" y="373" font-size="23" fill="#294451" text-anchor="start">子实体 n+n</text><path d="M790 391C759 423 733 434 700 437" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="785" y="418" font-size="21" fill="#294451" text-anchor="start">担子内核配</text><rect x="621" y="404" width="41" height="85" rx="17" fill="#e7e8d8" stroke="#5d8e78"/><circle cx="642" cy="448" r="12" fill="#d6ae61" /><text x="596" y="526" font-size="23" fill="#294451" text-anchor="start">二倍体核 2n</text><path d="M588 448H451" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="466" y="418" font-size="21" fill="#294451" text-anchor="start">减数分裂</text><rect x="351" y="402" width="56" height="90" rx="20" fill="#e7e8d8" stroke="#5d8e78"/><circle cx="367" cy="427" r="5" fill="#5c8caf" /><circle cx="388" cy="427" r="5" fill="#92749d" /><circle cx="367" cy="462" r="5" fill="#92749d" /><circle cx="388" cy="462" r="5" fill="#5c8caf" /><text x="311" y="526" font-size="23" fill="#294451" text-anchor="start">四个单倍体核 n</text><path d="M312 447C216 447 122 409 115 255" fill="none" stroke="#596f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="180" y="350" font-size="20" fill="#294451" text-anchor="start">形成与散布孢子</text><text x="42" y="581" font-size="20" fill="#687e83" text-anchor="start">以常见担子菌型为例；n+n是两核并存，2n是核融合后的二倍体状态。</text></g></svg>