<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" role="img" aria-labelledby="title desc"><title id="title">改革试点的评价与反馈</title><desc id="desc">从问题与合法授权到试行、评价和调整，保留失败与重新评估的路径，不画必然成功的箭头。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","SimSun",serif}</style><rect width="980" height="450" fill="white"/><rect x="25" y="70" width="185" height="95" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="117.5" y="109.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">识别问题</text><text x="117.5" y="139.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">调查与明确目标</text><rect x="270" y="70" width="185" height="95" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="362.5" y="109.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">合法授权</text><text x="362.5" y="139.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">限定试行范围</text><rect x="515" y="70" width="185" height="95" rx="10" fill="#f8f2e9" stroke="#cdd8dc"/><text x="607.5" y="109.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">实施与观察</text><text x="607.5" y="139.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">成本、收益、风险</text><rect x="760" y="70" width="195" height="95" rx="10" fill="#f5eef3" stroke="#cdd8dc"/><text x="857.5" y="109.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">比较与评价</text><text x="857.5" y="139.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">适用条件、替代解释</text><path d="M215 118 L259 118" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M460 118 L504 118" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M705 118 L749 118" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="270" y="267" width="430" height="95" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="485.0" y="306.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">调整方案或有条件推广</text><text x="485.0" y="336.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">效果不明时继续检验</text><path d="M857 177V225H597V255" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M270 316H119V178" fill="none" stroke="#71858e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="490" y="418" font-size="20" fill="#2e414c" text-anchor="middle" font-weight="400">试点选择可能有偏差；局部成功不自动证明全国推广仍有同样效果。</text></svg>