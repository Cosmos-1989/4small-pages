<svg xmlns="http://www.w3.org/2000/svg" width="980" height="578" viewBox="0 0 980 578" role="img" aria-labelledby="title desc"><title id="title">理论成果与党章节点</title><desc id="desc">四项理论成果及写入党章的相关年份；将形成过程与正式文件节点区分，不是按比例时间轴。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","SimSun",serif}</style><rect width="980" height="578" fill="white"/><text x="490" y="36" font-size="25" fill="#2e414c" text-anchor="middle" font-weight="600">改革开放以来相关理论成果的形成与正式命名</text><rect x="40" y="70" width="300" height="77" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="190.0" y="100.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">邓小平理论</text><text x="190.0" y="130.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">改革开放与社会主义建设</text><path d="M350 108 L395 108" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="410" y="70" width="530" height="77" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="675.0" y="115.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">1997年十五大写入党章</text><rect x="40" y="170" width="300" height="77" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="190.0" y="200.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">“三个代表”重要思想</text><text x="190.0" y="230.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">发展、文化与党的建设</text><path d="M350 208 L395 208" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="410" y="170" width="530" height="77" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="675.0" y="215.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">2002年十六大写入党章</text><rect x="40" y="270" width="300" height="77" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="190.0" y="300.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">科学发展观</text><text x="190.0" y="330.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">发展方式与人的发展</text><path d="M350 308 L395 308" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="410" y="270" width="530" height="77" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="675.0" y="315.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">2007年写入党章；2012年列为指导思想</text><rect x="40" y="370" width="300" height="77" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="190.0" y="400.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">习近平新时代</text><text x="190.0" y="430.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">中国特色社会主义思想</text><path d="M350 408 L395 408" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="410" y="370" width="530" height="77" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="675.0" y="415.5" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">2017年十九大写入党章</text><text x="490" y="511" font-size="20" fill="#2e414c" text-anchor="middle" font-weight="400">年份表示正式文件节点；理论形成与政策探索可能更早。</text><text x="490" y="547" font-size="19" fill="#2e414c" text-anchor="middle" font-weight="400">毛泽东思想另列为指导思想，不能直接并入改革开放以来同一概念范围。</text></svg>