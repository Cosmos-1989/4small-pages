<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">良渚与二里头的考古证据</title><desc id="desc">良渚与二里头的考古证据；良渚：长江下游：城址与外围水利设施、等级墓葬与玉礼器、稻作及公共劳动组织、遗存显示复杂政治组织；二里头：伊洛地区：道路与宫殿建筑区、铜器及绿松石器作坊、区域资源集中与流动、夏王朝名号须独立论证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">良渚与二里头的考古证据</text><rect x="60.0" y="108" width="420.0" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">良渚：长江下游</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">城址与外围水利设施</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">等级墓葬与玉礼器</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">稻作及公共劳动组织</text><text x="82.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">遗存显示复杂政治组织</text><rect x="500.0" y="108" width="420.0" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="522.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">二里头：伊洛地区</text><text x="522.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">道路与宫殿建筑区</text><text x="522.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">铜器及绿松石器作坊</text><text x="522.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">区域资源集中与流动</text><text x="522.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">夏王朝名号须独立论证</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">两地处于不同地区和时段；并列不表示王朝相承、疆域或文化等级。</text></g></svg>