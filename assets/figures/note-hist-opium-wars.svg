<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">战争与条约制度</title><desc id="desc">战争与条约制度；1839年：广州禁烟；1842年：《南京条约》；1843—1844年：补充条约与其他条约；1856—1860年：第二次鸦片战争；1860年：《北京条约》</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">战争与条约制度</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1839年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">广州禁烟</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">英国政府随后决定采取军事行动</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1842年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">《南京条约》</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">五口通商、香港岛割让与赔款</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1843—1844年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">补充条约与其他条约</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">关税、领事裁判权及最惠国安排扩展</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1856—1860年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">第二次鸦片战争</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">英法以武力扩大在华权益</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1860年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">《北京条约》</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">确认和扩大此前条约安排</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>