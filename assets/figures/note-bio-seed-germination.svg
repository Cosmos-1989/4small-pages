<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">萌发与幼苗建立的阶段区别</title><desc id="desc">三个阶段依次为吸水后恢复代谢、胚根突破覆盖组织以及幼苗继续伸根和形成地上器官；不是固定时间进程。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#4b91ad"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#659b7a"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#c59a51"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#b87770"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, STSong, SimSun, serif" stroke-linecap="round" stroke-linejoin="round"><text x="38" y="36" font-size="22" fill="#334b55" text-anchor="start">吸水、胚根伸出与幼苗建立</text><path d="M79 149 C64 95 121 85 163 118 C208 164 172 213 126 212 C96 209 85 188 79 149 Z" stroke="#c59a51" stroke-width="3" fill="#eed9ac" /><path d="M104 137 C108 115 151 119 159 144 C166 179 136 192 111 177" stroke="#659b7a" stroke-width="3" fill="#dce8c4" /><path d="M333 149 C318 95 375 85 417 118 C462 164 426 213 380 212 C350 209 339 188 333 149 Z" stroke="#c59a51" stroke-width="3" fill="#eed9ac" /><path d="M358 137 C362 115 405 119 413 144 C420 179 390 192 365 177" stroke="#659b7a" stroke-width="3" fill="#dce8c4" /><path d="M585 149 C570 95 627 85 669 118 C714 164 678 213 632 212 C602 209 591 188 585 149 Z" stroke="#c59a51" stroke-width="3" fill="#eed9ac" /><path d="M610 137 C614 115 657 119 665 144 C672 179 642 192 617 177" stroke="#659b7a" stroke-width="3" fill="#dce8c4" /><path d="M45 226 L87 189" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="45" y="254" font-size="19" fill="#4b91ad" text-anchor="start">水</text><path d="M390 183 C393 227 410 248 403 280 C395 297 388 313 392 331" stroke="#659b7a" stroke-width="7" fill="none" /><path d="M643 180 C642 223 658 248 649 292 M648 253 L620 279 M648 277 L676 298" stroke="#659b7a" stroke-width="6" fill="none" /><path d="M635 140 C627 103 628 70 648 62 C672 64 680 84 666 107" stroke="#659b7a" stroke-width="5" fill="none" /><path d="M649 89 C681 69 711 85 721 105 C690 114 668 108 649 89" stroke="#659b7a" stroke-width="2" fill="#d6e6bf" /><path d="M210 174 L285 174" stroke="#659b7a" stroke-width="3" fill="none" marker-end="url(#g)"/><path d="M465 174 L538 174" stroke="#659b7a" stroke-width="3" fill="none" marker-end="url(#g)"/><text x="129" y="364" font-size="19" fill="#334b55" text-anchor="middle">吸胀与代谢恢复</text><text x="383" y="364" font-size="19" fill="#334b55" text-anchor="middle">胚根突破覆盖组织</text><text x="635" y="364" font-size="19" fill="#334b55" text-anchor="middle">幼苗继续生长</text><text x="383" y="401" font-size="17" fill="#4b91ad" text-anchor="middle">萌发终点的常用判据</text><text x="40" y="447" font-size="17" fill="#334b55" text-anchor="start">形态序列为概括；种皮、储备位置与出土方式随植物种类变化。</text></g></svg>