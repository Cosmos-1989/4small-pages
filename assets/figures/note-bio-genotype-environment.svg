<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">基因型与环境互作：反应规范</title><desc id="desc">两种基因型的表型响应线斜率不同并相交，表现型排序随环境梯度改变。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="650" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">基因型与环境互作：反应规范</text><path d="M160 510L870 510" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M160 510L160 140" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><text x="510" y="574" font-size="28" fill="#294451" text-anchor="middle">环境梯度</text><text x="60" y="130" font-size="25" fill="#294451" text-anchor="start">表型相对水平</text><path d="M210 448L820 205" fill="none" stroke="#3f7d96" stroke-width="5"/><path d="M210 235L820 420" fill="none" stroke="#bb695c" stroke-width="5"/><circle cx="210" cy="448" r="7" fill="#3f7d96" stroke="none" stroke-width="2"/><circle cx="820" cy="205" r="7" fill="#3f7d96" stroke="none" stroke-width="2"/><circle cx="210" cy="235" r="7" fill="#bb695c" stroke="none" stroke-width="2"/><circle cx="820" cy="420" r="7" fill="#bb695c" stroke="none" stroke-width="2"/><text x="833" y="207" font-size="27" fill="#3f7d96" text-anchor="start">甲</text><text x="833" y="429" font-size="27" fill="#bb695c" text-anchor="start">乙</text><text x="210" y="544" font-size="23" fill="#687e83" text-anchor="middle">环境一</text><text x="820" y="544" font-size="23" fill="#687e83" text-anchor="middle">环境二</text><text x="530" y="474" font-size="23" fill="#92749d" text-anchor="start">排序随环境改变</text><text x="50" y="624" font-size="20" fill="#687e83" text-anchor="start">甲、乙为假想基因型；相对坐标仅表示响应关系，不是观测数据。</text></g></svg>