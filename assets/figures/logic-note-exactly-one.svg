<svg xmlns="http://www.w3.org/2000/svg" width="980" height="495" viewBox="0 0 980 495" role="img" aria-labelledby="title desc"><title id="title">恰一真约束下的相容赋值</title><desc id="desc">四种P、Q赋值中，真假的组合与假假的组合均使两个陈述恰一真，约束不保证唯一世界。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="495" fill="white"/><text x="490" y="40" font-size="25" text-anchor="middle" fill="#2b414d">约束：P ∨ Q 与 P → Q 中恰有一真</text><text x="100" y="105" font-size="23" text-anchor="middle" fill="#2b414d">P</text><text x="280" y="105" font-size="23" text-anchor="middle" fill="#2b414d">Q</text><text x="490" y="105" font-size="23" text-anchor="middle" fill="#2b414d">P ∨ Q</text><text x="715" y="105" font-size="23" text-anchor="middle" fill="#2b414d">P → Q</text><text x="885" y="105" font-size="23" text-anchor="middle" fill="#2b414d">满足约束</text><text x="100" y="158" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="280" y="158" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="490" y="158" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="715" y="158" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="885" y="158" font-size="23" text-anchor="middle" fill="#2b414d">否</text><rect x="32" y="195" width="916" height="48" rx="7" fill="#edf5f1"/><text x="100" y="224" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="280" y="224" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="490" y="224" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="715" y="224" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="885" y="224" font-size="23" text-anchor="middle" fill="#2b414d">是</text><text x="100" y="290" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="280" y="290" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="490" y="290" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="715" y="290" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="885" y="290" font-size="23" text-anchor="middle" fill="#2b414d">否</text><rect x="32" y="327" width="916" height="48" rx="7" fill="#edf5f1"/><text x="100" y="356" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="280" y="356" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="490" y="356" font-size="23" text-anchor="middle" fill="#2b414d">假</text><text x="715" y="356" font-size="23" text-anchor="middle" fill="#2b414d">真</text><text x="885" y="356" font-size="23" text-anchor="middle" fill="#2b414d">是</text><text x="490" y="463" font-size="21" text-anchor="middle" fill="#2b414d">有两个相容赋值；“恰一真”本身不保证唯一解。</text></svg>