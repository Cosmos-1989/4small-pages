<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">辽、金、西夏：多种治理安排</title><desc id="desc">辽、金、西夏：多种治理安排；辽：南北官的分工、五京与四时捺钵、农牧、城市与贸易；金：猛安谋克组织、州县与官僚机构、迁徙及政策调整；西夏：官署、文字和法律、城市、水利与农业、佛教与多方文化联系</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">辽、金、西夏：多种治理安排</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">辽</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">南北官的分工</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">五京与四时捺钵</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">农牧、城市与贸易</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">金</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">猛安谋克组织</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">州县与官僚机构</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">迁徙及政策调整</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">西夏</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">官署、文字和法律</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">城市、水利与农业</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">佛教与多方文化联系</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">按制度特征并列；不作文化等级或数量规模比较。</text></g></svg>