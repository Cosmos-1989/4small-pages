<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">葡萄糖两条途径的气体与底物收支</title><desc id="desc">呼吸商比较二氧化碳释放和氧气消耗；分解混合代谢通量须先明确底物与化学计量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#82969b"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="470" fill="white"/><rect x="40" y="50" width="390" height="100" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="235.0" y="79.0" text-anchor="middle" font-size="22" fill="#2d414b">葡萄糖完全有氧氧化</text><text x="235.0" y="108.0" text-anchor="middle" font-size="22" fill="#2d414b">1 葡萄糖 → 6 CO₂</text><text x="235.0" y="137.0" text-anchor="middle" font-size="22" fill="#2d414b">同时消耗 6 O₂</text><rect x="550" y="50" width="390" height="100" rx="10" fill="#f5eee5" stroke="#cbd9dc"/><text x="745.0" y="79.0" text-anchor="middle" font-size="22" fill="#2d414b">葡萄糖乙醇发酵</text><text x="745.0" y="108.0" text-anchor="middle" font-size="22" fill="#2d414b">1 葡萄糖 → 2 CO₂</text><text x="745.0" y="137.0" text-anchor="middle" font-size="22" fill="#2d414b">不消耗 O₂</text><rect x="40" y="245" width="390" height="100" rx="10" fill="#edf4f5" stroke="#cbd9dc"/><text x="235.0" y="288.5" text-anchor="middle" font-size="22" fill="#2d414b">假设 O₂ 吸收 0.2</text><text x="235.0" y="317.5" text-anchor="middle" font-size="22" fill="#2d414b">葡萄糖消耗 0.2 ÷ 6</text><rect x="550" y="245" width="390" height="100" rx="10" fill="#f5eee5" stroke="#cbd9dc"/><text x="745.0" y="288.5" text-anchor="middle" font-size="22" fill="#2d414b">余下 CO₂ 释放 0.2</text><text x="745.0" y="317.5" text-anchor="middle" font-size="22" fill="#2d414b">葡萄糖消耗 0.2 ÷ 2</text><path d="M 235 157 L 235 237" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 745 157 L 745 237" stroke="#82969b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="490" y="395" text-anchor="middle" font-size="21" fill="#2d414b">相同气体产量下，按葡萄糖消耗计的发酵与有氧之比为 3∶1。</text><text x="490" y="435" text-anchor="middle" font-size="20" fill="#2d414b">气体速率单位：μmol·g⁻¹·min⁻¹；假设总 CO₂ 释放为 0.4。</text></svg>