<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">双受精产物与母体种皮的谱系</title><desc id="desc">两个精细胞分别与卵细胞、含两个极核的中央细胞融合，合子通常二倍体，初生胚乳核通常三倍体，种皮来自二倍体母体珠被。</desc><defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#4b91ad"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#659b7a"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#c59a51"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#b87770"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Songti SC, STSong, SimSun, serif" stroke-linecap="round" stroke-linejoin="round"><text x="43" y="34" font-size="22" fill="#334b55" text-anchor="start">双受精：两个精细胞的不同去向</text><path d="M125 82 C125 113 112 128 132 142" stroke="#c59a51" stroke-width="15" fill="none" /><text x="43" y="67" font-size="18" fill="#c59a51" text-anchor="start">花粉管</text><circle cx="132" cy="170" r="9" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="131" cy="197" r="9" fill="#c59a51" stroke="none" stroke-width="1.5"/><text x="45" y="238" font-size="18" fill="#334b55" text-anchor="start">精细胞 n</text><path d="M230 86 C313 51 425 74 450 154 C478 234 438 345 347 357 C253 358 205 282 209 187 C210 143 215 111 230 86 Z" stroke="#659b7a" stroke-width="3" fill="#eff4e6" /><text x="248" y="390" font-size="18" fill="#334b55" text-anchor="start">胚珠（母体组织包围）</text><rect x="266" y="117" width="110" height="83" rx="35" fill="#edf5fb" stroke="#4b91ad" stroke-width="2"/><circle cx="321" cy="158" r="11" fill="#4b91ad" stroke="none" stroke-width="1.5"/><text x="287" y="225" font-size="18" fill="#4b91ad" text-anchor="start">卵细胞 n</text><rect x="252" y="241" width="138" height="88" rx="36" fill="#f8ecd4" stroke="#c59a51" stroke-width="2"/><circle cx="297" cy="283" r="11" fill="#c59a51" stroke="none" stroke-width="1.5"/><circle cx="346" cy="283" r="11" fill="#c59a51" stroke="none" stroke-width="1.5"/><text x="321" y="317" font-size="17" fill="#c59a51" text-anchor="middle">中央细胞 n＋n</text><path d="M150 173 C187 171 216 159 253 159" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><path d="M148 203 C185 246 210 283 241 283" stroke="#c59a51" stroke-width="3" fill="none" marker-end="url(#o)"/><path d="M388 159 L502 159" stroke="#4b91ad" stroke-width="3" fill="none" marker-end="url(#b)"/><text x="522" y="154" font-size="21" fill="#4b91ad" text-anchor="start">合子 2n</text><text x="522" y="185" font-size="18" fill="#334b55" text-anchor="start">发育为胚</text><path d="M403 283 L502 283" stroke="#c59a51" stroke-width="3" fill="none" marker-end="url(#o)"/><text x="522" y="276" font-size="21" fill="#c59a51" text-anchor="start">初生胚乳核 3n</text><text x="522" y="308" font-size="18" fill="#334b55" text-anchor="start">发育为胚乳</text><path d="M441 106 L505 79" stroke="#659b7a" stroke-width="1.5" fill="none" /><text x="515" y="75" font-size="19" fill="#659b7a" text-anchor="start">珠被 2n</text><text x="515" y="103" font-size="18" fill="#334b55" text-anchor="start">形成种皮</text><text x="44" y="447" font-size="17" fill="#334b55" text-anchor="start">常见蓼型胚囊的核组成；未画全部配子体细胞。</text></g></svg>