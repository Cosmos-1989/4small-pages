<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">技术学习与自强事业</title><desc id="desc">技术学习与自强事业；军工与海军：制造局与船政、舰船、武器和训练、材料工艺及后勤；民用企业：航运、煤矿、电报、官办与官督商办、资本、成本与市场；教育与知识：新式学堂及留学、工程人才与翻译、知识进入社会领域</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">技术学习与自强事业</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">军工与海军</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">制造局与船政</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">舰船、武器和训练</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">材料工艺及后勤</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">民用企业</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">航运、煤矿、电报</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">官办与官督商办</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">资本、成本与市场</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">教育与知识</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">新式学堂及留学</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">工程人才与翻译</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">知识进入社会领域</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三个领域相互联系；技术引进需要人才和制度支撑，栏宽不表示产业占比。</text></g></svg>