<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
<title id="title">环境决策中的分配、参与与代际责任</title><desc id="desc">一个环境方案分别接受分配、参与程序和代际影响三类问题的检验；各类问题需要事实调查。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#63777b" stroke-width="1.4"/></marker></defs>
<style>text{font-family:"Songti SC",STSong,SimSun,serif;fill:#263f42;font-size:19px}.heading{font-size:22px;font-weight:600}.small{font-size:16px;fill:#596b6e}.line{fill:none;stroke:#63777b;stroke-width:1.6;marker-end:url(#arrow)}.box{stroke-width:1.3}.rule{stroke:#b8c6c6;stroke-width:1}</style>
<rect width="920" height="510" fill="#fff"/>
<text x="40" y="39" text-anchor="start" class="heading"><tspan x="40" dy="0">环境决策需要回答的三类正义问题</tspan></text><path class="rule" d="M40 57H880"/><rect x="300" y="85" width="320" height="62" rx="7" fill="#e9f0ed" stroke="#83a396" stroke-width="1.4"/><text x="460" y="124" text-anchor="middle" class="heading"><tspan x="460" dy="0">一项资源利用或环境治理方案</tspan></text><path class="line" d="M460 148V175H170V205"/><path class="line" d="M460 148V175H460V205"/><path class="line" d="M460 148V175H750V205"/><rect class="box" x="40" y="210" width="260" height="168" rx="7" fill="#edf4f5" stroke="#8daaad"/><text x="170.0" y="248" text-anchor="middle" class="heading"><tspan x="170.0" dy="0">分配</tspan></text><text x="170.0" y="286" text-anchor="middle" class=""><tspan x="170.0" dy="0">谁获得收益？</tspan><tspan x="170.0" dy="29">谁承受污染与风险？</tspan><tspan x="170.0" dy="29">谁支付治理成本？</tspan></text><rect class="box" x="330" y="210" width="260" height="168" rx="7" fill="#f9f1e5" stroke="#cbb996"/><text x="460.0" y="248" text-anchor="middle" class="heading"><tspan x="460.0" dy="0">参与与程序</tspan></text><text x="460.0" y="286" text-anchor="middle" class=""><tspan x="460.0" dy="0">谁能够表达意见？</tspan><tspan x="460.0" dy="29">信息是否可以取得？</tspan><tspan x="460.0" dy="29">有无申诉与救济？</tspan></text><rect class="box" x="620" y="210" width="260" height="168" rx="7" fill="#f3f1f6" stroke="#b1a6bb"/><text x="750.0" y="248" text-anchor="middle" class="heading"><tspan x="750.0" dy="0">代际影响</tspan></text><text x="750.0" y="286" text-anchor="middle" class=""><tspan x="750.0" dy="0">资源能否延续？</tspan><tspan x="750.0" dy="29">损害能否恢复？</tspan><tspan x="750.0" dy="29">后代的需要如何保障？</tspan></text><text x="460" y="422" text-anchor="middle" class=""><tspan x="460" dy="0">结合环境过程、群体处境与替代方案的证据作出判断。</tspan></text><text x="40" y="478" text-anchor="start" class="small"><tspan x="40" dy="0">概念图；框的大小不表示人数、风险或补偿比例。</tspan></text>
</svg>