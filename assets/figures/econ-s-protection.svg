<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390"><title>社会保障的制度关系</title><desc>三个相联系的制度部分；交叉和衔接不等于相同的个人资格。</desc><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718f99"/></marker></defs><g font-family="&quot;Songti SC&quot;, &quot;STSong&quot;, &quot;SimSun&quot;, serif"><text x="450" y="34" text-anchor="middle" font-size="25" fill="#294752">风险分担、基本生活与公共服务</text><rect x="35" y="88" width="250" height="155" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="160.0" y="143.5" text-anchor="middle" font-size="20" fill="#294752">社会保险</text><text x="160.0" y="172.5" text-anchor="middle" font-size="20" fill="#294752">法定参保与风险给付</text><text x="160.0" y="201.5" text-anchor="middle" font-size="20" fill="#294752">缴费、补助及统筹</text><rect x="325" y="88" width="250" height="155" rx="12" fill="#f7f2e9" stroke="#aec4ca"/><text x="450.0" y="143.5" text-anchor="middle" font-size="20" fill="#294752">社会救助</text><text x="450.0" y="172.5" text-anchor="middle" font-size="20" fill="#294752">困难处境与基本需要</text><text x="450.0" y="201.5" text-anchor="middle" font-size="20" fill="#294752">财政支持、确认与服务</text><rect x="615" y="88" width="250" height="155" rx="12" fill="#f0f0f7" stroke="#aec4ca"/><text x="740.0" y="143.5" text-anchor="middle" font-size="20" fill="#294752">福利与公共服务</text><text x="740.0" y="172.5" text-anchor="middle" font-size="20" fill="#294752">照护、教育、健康等</text><text x="740.0" y="201.5" text-anchor="middle" font-size="20" fill="#294752">普遍或分类提供</text><path d="M285,162h40" fill="none" stroke="#718f99" stroke-width="2.3" marker-start="url(#a)" marker-end="url(#a)"/><path d="M575,162h40" fill="none" stroke="#718f99" stroke-width="2.3" marker-start="url(#a)" marker-end="url(#a)"/><text x="450" y="300" text-anchor="middle" font-size="20" fill="#294752">资格、覆盖与服务相衔接；具体类别和给付规则依制度而定</text><text x="450" y="350" text-anchor="middle" font-size="20" fill="#294752">筹资可持续性　　待遇适足性　　实际可获得性</text></g></svg>