<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">早期农业的三类证据</title><desc id="desc">早期农业的三类证据；植物遗存：稻谷与粟黍种子、稻小穗基部形态、栽培与驯化进程、注意取样与保存；食物同位素：人和动物骨胶原、食物进入食物链、饮食来源的变化、不能独证驯化；田地与聚落：田地及灌排设施、粮食储存与工具、生产空间与定居、须与植物相互印证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">早期农业的三类证据</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">植物遗存</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">稻谷与粟黍种子</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">稻小穗基部形态</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">栽培与驯化进程</text><text x="82.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">注意取样与保存</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">食物同位素</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">人和动物骨胶原</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">食物进入食物链</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">饮食来源的变化</text><text x="375.3333333333333" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">不能独证驯化</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">田地与聚落</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">田地及灌排设施</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">粮食储存与工具</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">生产空间与定居</text><text x="668.6666666666666" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">须与植物相互印证</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">比较观察对象与解释范围；栏宽不表示证据数量，也不排列文化高低。</text></g></svg>