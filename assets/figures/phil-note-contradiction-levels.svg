<svg xmlns="http://www.w3.org/2000/svg" width="980" height="385" viewBox="0 0 980 385" role="img" aria-labelledby="title desc"><title id="title">主要矛盾与矛盾主要方面的层次区别</title><desc id="desc">左侧在多个矛盾中比较主要和次要矛盾，右侧在同一矛盾内部比较两方面的地位。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="385" fill="white"/><text x="246" y="40" font-size="25" fill="#577991" text-anchor="middle" font-weight="600">多组矛盾之间</text><text x="734" y="40" font-size="25" fill="#956e81" text-anchor="middle" font-weight="600">一组矛盾内部</text><rect x="30" y="78" width="170" height="75" rx="12" fill="#eaf1f7" stroke="#cdd8dc" stroke-width="1.5"/><text x="115.0" y="122.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">主要矛盾</text><rect x="30" y="178" width="170" height="75" rx="12" fill="#f7f8f9" stroke="#cdd8dc" stroke-width="1.5"/><text x="115.0" y="222.5" font-size="20" fill="#273c48" text-anchor="middle" font-weight="600">次要矛盾甲</text><rect x="251" y="178" width="200" height="75" rx="12" fill="#f7f8f9" stroke="#cdd8dc" stroke-width="1.5"/><text x="351.0" y="222.5" font-size="20" fill="#273c48" text-anchor="middle" font-weight="600">次要矛盾乙</text><path d="M115 162 V167 H350 V172" fill="none" stroke="#71858e" stroke-width="2" stroke-dasharray="6 5"/><rect x="530" y="78" width="190" height="85" rx="12" fill="#f4eaf0" stroke="#cdd8dc" stroke-width="1.5"/><text x="625.0" y="127.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">主要方面</text><rect x="756" y="78" width="194" height="85" rx="12" fill="#f7f8f9" stroke="#cdd8dc" stroke-width="1.5"/><text x="853.0" y="127.5" font-size="22" fill="#273c48" text-anchor="middle" font-weight="600">次要方面</text><path d="M725 120 L747 120" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M749 139 L727 139" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="215" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">双方在具体条件中相互依存、作用</text><text x="246" y="297" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">问题：哪一组关系支配全局？</text><text x="734" y="297" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">问题：同一关系中哪一方居主导？</text><path d="M490 20 L490 318" fill="none" stroke="#71858e" stroke-width="2" stroke-dasharray="6 5"/><text x="490" y="354" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">层次与判断对象不同；条件变化后，原有主次地位可以转化。</text></svg>