<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">蛋糕损害案证据与证明目的表</title><desc id="desc">两列三行，给出鉴定意见书示例，购物小票的证明目的及损失凭证名称留作填空。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="1000" height="460" fill="#fff"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="42" y="43" font-size="27" text-anchor="start" fill="#293f47" font-weight="bold">证据名称与证明目的</text><rect x="42" y="82" width="916" height="300" rx="6" fill="#fff" stroke="#9ab1b8" stroke-width="1.5"/><path d="M42 145H958M42 224H958M42 303H958M380 82V382" fill="none" stroke="#b6c7cc" stroke-width="1.4"/><path d="M48 83H952V144H48Z" fill="#edf4f5"/><path d="M380 83V145" fill="none" stroke="#b6c7cc" stroke-width="1.4"/><text x="211" y="124" font-size="26" text-anchor="middle" fill="#293f47" font-weight="bold">证据名称</text><text x="669" y="124" font-size="26" text-anchor="middle" fill="#293f47" font-weight="bold">证明目的</text><text x="211" y="191" font-size="24" text-anchor="middle" fill="#293f47" font-weight="normal">鉴定意见书</text><text x="669" y="181" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">蛋糕质量不符合</text><text x="669" y="216" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">食品安全国家标准</text><text x="211" y="271" font-size="24" text-anchor="middle" fill="#293f47" font-weight="normal">蛋糕店购物小票</text><text x="669" y="271" font-size="29" text-anchor="middle" fill="#293f47" font-weight="normal">①</text><text x="211" y="353" font-size="29" text-anchor="middle" fill="#293f47" font-weight="normal">②</text><text x="669" y="339" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">证明徐某等4人因食用蛋糕</text><text x="669" y="374" font-size="22" text-anchor="middle" fill="#293f47" font-weight="normal">产生的实际损失数额</text></g></svg>