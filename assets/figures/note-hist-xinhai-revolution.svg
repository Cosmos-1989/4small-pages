<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">从革命组织到共和建制</title><desc id="desc">从革命组织到共和建制；1894年：兴中会成立；1905年：同盟会成立；1911年10月：武昌起义；1912年1—2月：共和政府与清帝退位；1912年3月：《临时约法》公布</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">从革命组织到共和建制</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1894年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">兴中会成立</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">孙中山在檀香山组织兴中会</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1905年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">同盟会成立</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">革命团体在东京汇合</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1911年10月</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">武昌起义</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">各省陆续宣布脱离清廷</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1912年1—2月</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">共和政府与清帝退位</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">南京临时政府成立，南北谈判促成退位</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1912年3月</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">《临时约法》公布</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">规定国民主权、参议院及国务员责任</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>