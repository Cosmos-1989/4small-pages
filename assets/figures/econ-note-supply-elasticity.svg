<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">供给弹性的三个模型</title><desc id="desc">固定数量的竖直供给线、通过原点的单位弹性供给线及给定价格的水平供给极限。均为抽象模型，不是市场实测曲线。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="470" fill="white"/><text x="165" y="42" font-size="24" text-anchor="middle" fill="#2b414d">完全无弹性</text><path d="M45 335 L290 335" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M45 335 L45 82" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><text x="52" y="83" font-size="20" text-anchor="start" fill="#2b414d">价格 P</text><text x="294" y="343" font-size="21" text-anchor="start" fill="#2b414d">Q</text><text x="37" y="360" font-size="19" text-anchor="end" fill="#2b414d">0</text><path d="M165 335 L165 100" stroke="#557d98" stroke-width="3" fill="none"/><text x="165" y="384" font-size="23" text-anchor="middle" fill="#2b414d">弹性为0</text><text x="485" y="42" font-size="24" text-anchor="middle" fill="#2b414d">单位弹性</text><path d="M365 335 L610 335" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M365 335 L365 82" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><text x="372" y="83" font-size="20" text-anchor="start" fill="#2b414d">价格 P</text><text x="614" y="343" font-size="21" text-anchor="start" fill="#2b414d">Q</text><text x="357" y="360" font-size="19" text-anchor="end" fill="#2b414d">0</text><path d="M365 335 L588 112" stroke="#528579" stroke-width="3" fill="none"/><text x="485" y="384" font-size="23" text-anchor="middle" fill="#2b414d">弹性为1</text><text x="805" y="42" font-size="24" text-anchor="middle" fill="#2b414d">完全弹性极限</text><path d="M685 335 L930 335" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M685 335 L685 82" stroke="#2b414d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><text x="692" y="83" font-size="20" text-anchor="start" fill="#2b414d">价格 P</text><text x="934" y="343" font-size="21" text-anchor="start" fill="#2b414d">Q</text><text x="677" y="360" font-size="19" text-anchor="end" fill="#2b414d">0</text><path d="M685 206 L916 206" stroke="#a36973" stroke-width="3" fill="none"/><text x="805" y="384" font-size="23" text-anchor="middle" fill="#2b414d">水平供给线</text><text x="490" y="438" font-size="20" text-anchor="middle" fill="#2b414d">抽象供给模型；中图在P、Q为正时讨论弹性，图间不比较金额或斜率。</text></svg>