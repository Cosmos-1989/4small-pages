<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">环境适宜性与扩散可达性共同制约物种分布</title><desc id="desc">环境适宜区和物种能够到达的区域仅部分重合；重合是定居的必要条件之一，现实分布仍受种间作用与历史过程影响。</desc>
<defs>
  <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfcf7"/><stop offset="1" stop-color="#f5f7f9"/></linearGradient>
  <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#6b8d7c"/></marker>
  <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#68859e"/></marker>
</defs>
<style>text{font-family:'Songti SC',STSong,SimSun,'Noto Serif CJK SC',serif;fill:#283e48}.head{font-size:24px;font-weight:600}.label{font-size:20px}.small{font-size:19px;fill:#536871}.note{font-size:20px;fill:#4b606a}.lead1{fill:none;stroke:#6b8d7c;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a1)}.lead2{fill:none;stroke:#68859e;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a2)}</style>
<rect width="1000" height="560" fill="url(#paper)"/>
