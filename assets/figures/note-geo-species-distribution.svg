<text x="277" y="242" class="head" text-anchor="middle">环境适宜</text>
<text x="277" y="270" class="small" text-anchor="middle">气候 · 土壤 · 生境</text>
<text x="728" y="242" class="head" text-anchor="middle">能够到达</text>
<text x="728" y="270" class="small" text-anchor="middle">扩散能力 · 地形障碍</text>
