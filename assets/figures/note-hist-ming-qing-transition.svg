<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">明清易代：持续数十年的竞争</title><desc id="desc">明清易代：持续数十年的竞争；1616年：后金建立；1636年：采用清国号；1644年：北京政权更替；1662年：永历帝被杀；1681—1683年：三藩战争结束、郑氏降清</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">明清易代：持续数十年的竞争</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1616年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">后金建立</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">东北军事与政治联盟发展</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1636年</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">采用清国号</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">国家组织与政治称号调整</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1644年</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">北京政权更替</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">李自成入京，清军随后进入北京</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1662年</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">永历帝被杀</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">郑氏等力量继续活动</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1681—1683年</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">三藩战争结束、郑氏降清</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">军事与行政整合仍在持续</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">点间距离不代表历时；1644年并非所有战争的终点。</text></g></svg>