<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370" role="img" aria-labelledby="title desc"><title id="title">文化传承与创新的实践环节</title><desc id="desc">传承资源与现实实践共同进入选择、阐释与创造，经社会使用和接受形成反馈。图不预设所有创新都会成功。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="370" fill="white"/><rect x="28" y="52" width="220" height="81" rx="12" fill="#f7f0e9" stroke="#cdd8dc" stroke-width="1.5"/><text x="138.0" y="84.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">传承的资源</text><text x="138.0" y="114.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">技艺、文本与记忆</text><rect x="28" y="189" width="220" height="81" rx="12" fill="#edf3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="138.0" y="221.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">现实的实践</text><text x="138.0" y="251.5" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">新问题、技术与需要</text><rect x="370" y="111" width="240" height="102" rx="12" fill="#edf5f2" stroke="#cdd8dc" stroke-width="1.5"/><text x="490.0" y="154.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">选择、阐释与创造</text><text x="490.0" y="184.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">保留、调整和重组</text><rect x="733" y="111" width="220" height="102" rx="12" fill="#f6f0f5" stroke="#cdd8dc" stroke-width="1.5"/><text x="843.0" y="154.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">使用与接受</text><text x="843.0" y="184.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">参与者和受众评价</text><path d="M255 92 H311 V140 H361" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 229 H311 V187 H361" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 162 L724 162" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M842 222 V286 H490 V222" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="663" y="275" font-size="19" fill="#273c48" text-anchor="middle" font-weight="400">反馈：效果、争议与修订</text><text x="490" y="339" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">更新形式与使用场景，并不自动证明作品优秀；保护还须有传承者参与。</text></svg>