<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="t d"><title id="t">血糖调节的主要负反馈关系</title><desc id="d">血糖升高触发β细胞与胰岛素调节肝产糖和外周摄取；降低触发α细胞与胰高血糖素促进肝输出，两条回路抵消各自偏离。</desc><defs><marker id="a28434b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#28434b"/></marker><marker id="a467d9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#467d9b"/></marker><marker id="a548c7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#548c7d"/></marker><marker id="ab18a4d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b18a4d"/></marker><marker id="a8b709d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#8b709d"/></marker><marker id="abd7067" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#bd7067"/></marker><marker id="a637780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#637780"/></marker></defs><rect width="1000" height="665" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="55" y="58" font-size="30" fill="#28434b" text-anchor="start">两条回路分别抵消血糖的不同偏离</text><text x="275" y="125" font-size="27" fill="#467d9b" text-anchor="middle">血糖升高</text><path d="M275 145L275 190" fill="none" stroke="#467d9b" stroke-width="3" marker-end="url(#a467d9b)"/><circle cx="275" cy="228" r="35" fill="#eee8ef" stroke="#8b709d" stroke-width="2.5"/><circle cx="283" cy="224" r="9" fill="#8b709d" stroke="none" stroke-width="2"/><text x="329" y="233" font-size="23" fill="#8b709d" text-anchor="start">β 细胞</text><path d="M275 265L275 309" fill="none" stroke="#467d9b" stroke-width="3" marker-end="url(#a467d9b)"/><text x="249" y="298" font-size="24" fill="#467d9b" text-anchor="end">胰岛素</text><g transform="translate(220 380) scale(0.8)"><path d="M-85 -21Q-62 -64 15 -51Q74 -47 90 -6Q85 28 38 39L-14 24Q-63 44 -85 -21Z" fill="#e7c1b4" stroke="#bd7067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 -45Q-5 -8 -14 24" fill="none" stroke="#bd7067" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="320" y="354" width="87" height="15" rx="7" fill="#d9e7ea" stroke="#467d9b" stroke-width="2"/><rect x="320" y="377" width="87" height="15" rx="7" fill="#d9e7ea" stroke="#467d9b" stroke-width="2"/><rect x="320" y="400" width="87" height="15" rx="7" fill="#d9e7ea" stroke="#467d9b" stroke-width="2"/><text x="242" y="461" font-size="23" fill="#467d9b" text-anchor="end">肝产糖↓</text><text x="314" y="461" font-size="23" fill="#467d9b" text-anchor="start">肌肉等摄取↑</text><path d="M275 480Q275 527 120 527Q83 527 83 335V178Q83 125 192 125" fill="none" stroke="#467d9b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a467d9b)"/><text x="160" y="566" font-size="24" fill="#467d9b" text-anchor="middle">抵消升高</text><text x="750" y="125" font-size="27" fill="#b18a4d" text-anchor="middle">血糖降低</text><path d="M750 145L750 190" fill="none" stroke="#b18a4d" stroke-width="3" marker-end="url(#ab18a4d)"/><circle cx="750" cy="228" r="35" fill="#eee8ef" stroke="#8b709d" stroke-width="2.5"/><circle cx="758" cy="224" r="9" fill="#8b709d" stroke="none" stroke-width="2"/><text x="804" y="233" font-size="23" fill="#8b709d" text-anchor="start">α 细胞</text><path d="M750 265L750 309" fill="none" stroke="#b18a4d" stroke-width="3" marker-end="url(#ab18a4d)"/><text x="724" y="298" font-size="24" fill="#b18a4d" text-anchor="end">胰高血糖素</text><g transform="translate(750 380) scale(1)"><path d="M-85 -21Q-62 -64 15 -51Q74 -47 90 -6Q85 28 38 39L-14 24Q-63 44 -85 -21Z" fill="#e7c1b4" stroke="#bd7067" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 -45Q-5 -8 -14 24" fill="none" stroke="#bd7067" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="750" y="461" font-size="24" fill="#b18a4d" text-anchor="middle">肝葡萄糖输出↑</text><path d="M750 480Q750 527 595 527Q558 527 558 335V178Q558 125 667 125" fill="none" stroke="#b18a4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab18a4d)"/><text x="635" y="566" font-size="24" fill="#b18a4d" text-anchor="middle">抵消降低</text><text x="55" y="620" font-size="21" fill="#637780" text-anchor="start">胰岛细胞兼有感受和分泌功能；图省略其他激素及神经调节。</text></g></svg>