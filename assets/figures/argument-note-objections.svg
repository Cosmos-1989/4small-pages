<svg xmlns="http://www.w3.org/2000/svg" width="980" height="530" viewBox="0 0 980 530" role="img" aria-labelledby="title desc"><title id="title">异议的检验与主张的修订</title><desc id="desc">准确重述、检查支持关系，再依据理由反驳、限定、修改或撤回。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="530" fill="white"/><rect x="305" y="28" width="370" height="88" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="490.0" y="64.5" font-size="23" text-anchor="middle" fill="#2d414b">准确重述异议</text><text x="490.0" y="95.5" font-size="23" text-anchor="middle" fill="#2d414b">它针对哪一项理由？</text><path d="M490 122 L490 176" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="305" y="185" width="370" height="88" rx="10" fill="#f8f2e9" stroke="#d1dde2"/><text x="490.0" y="221.5" font-size="23" text-anchor="middle" fill="#2d414b">检查事实、概念和推论</text><text x="490.0" y="252.5" font-size="23" text-anchor="middle" fill="#2d414b">异议是否改变支持关系？</text><path d="M490 280 L169 337" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="345" width="290" height="90" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="169.0" y="382.5" font-size="23" text-anchor="middle" fill="#2d414b">异议不成立</text><text x="169.0" y="413.5" font-size="23" text-anchor="middle" fill="#2d414b">给出核对和反驳</text><path d="M490 280 L490 337" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="345" y="345" width="290" height="90" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="490.0" y="382.5" font-size="23" text-anchor="middle" fill="#2d414b">部分成立</text><text x="490.0" y="413.5" font-size="23" text-anchor="middle" fill="#2d414b">承认并限定范围</text><path d="M490 280 L811 337" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="666" y="345" width="290" height="90" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="811.0" y="382.5" font-size="23" text-anchor="middle" fill="#2d414b">关键理由失效</text><text x="811.0" y="413.5" font-size="23" text-anchor="middle" fill="#2d414b">修改或撤回主张</text><text x="490" y="495" font-size="21" text-anchor="middle" fill="#2d414b">回应的结论由理由决定，不预设必须维护原来的看法。</text></svg>