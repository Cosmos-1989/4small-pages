<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc"><title id="title">用自然频数理解证据更新</title><desc id="desc">假设1000件产品中10件次品，检出8；990件合格中误报99。107件阳性中8件是真次品，约7.5%。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="600" fill="white"/><rect x="300" y="25" width="380" height="70" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="490.0" y="67.0" font-size="25" text-anchor="middle" fill="#2b414d">假设：1000件产品</text><rect x="35" y="155" width="420" height="95" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="245.0" y="194.0" font-size="24" text-anchor="middle" fill="#2b414d">次品10件</text><text x="245.0" y="225.0" font-size="24" text-anchor="middle" fill="#2b414d">检出8件；漏检2件</text><rect x="525" y="155" width="420" height="95" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="735.0" y="194.0" font-size="23" text-anchor="middle" fill="#2b414d">合格990件</text><text x="735.0" y="225.0" font-size="23" text-anchor="middle" fill="#2b414d">误报99件；正确排除891件</text><path d="M390 103 L245 143" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M590 103 L735 143" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M245 262 L375 330" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M735 262 L605 330" stroke="#b4c4cc" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="215" y="343" width="550" height="120" rx="11" fill="#f8f2e8" stroke="#ccd8de"/><text x="490.0" y="394.5" font-size="25" text-anchor="middle" fill="#2b414d">阳性报告共107件</text><text x="490.0" y="425.5" font-size="25" text-anchor="middle" fill="#2b414d">其中实际次品8件</text><text x="490" y="518" font-size="26" text-anchor="middle" fill="#2b414d">P（次品｜阳性）＝8／107 ≈ 7.5％</text><text x="490" y="565" font-size="20" text-anchor="middle" fill="#2b414d">基率1％、灵敏度80％、误报率10％；全部为假设值。</text></svg>