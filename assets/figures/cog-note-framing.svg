<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">相同后果的不同框架</title><desc id="desc">假设600件产品待修复，每一行的两种说法表示同一个结果分布。确定方案与概率方案的期望修复数量相同，风险分布不同。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="520" fill="white"/><text x="248" y="42" font-size="25" text-anchor="middle" fill="#2b414d">以修复表述</text><text x="733" y="42" font-size="25" text-anchor="middle" fill="#2b414d">以未修复表述</text><rect x="30" y="90" width="435" height="100" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="247.5" y="131.5" font-size="24" text-anchor="middle" fill="#2b414d">确定方案</text><text x="247.5" y="162.5" font-size="24" text-anchor="middle" fill="#2b414d">600件中修好200件</text><rect x="515" y="90" width="435" height="100" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="732.5" y="131.5" font-size="24" text-anchor="middle" fill="#2b414d">同一个确定方案</text><text x="732.5" y="162.5" font-size="24" text-anchor="middle" fill="#2b414d">600件中400件未修好</text><rect x="30" y="235" width="435" height="155" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="247.5" y="288.5" font-size="23" text-anchor="middle" fill="#2b414d">概率方案</text><text x="247.5" y="319.5" font-size="23" text-anchor="middle" fill="#2b414d">1/3概率600件全修好</text><text x="247.5" y="350.5" font-size="23" text-anchor="middle" fill="#2b414d">2/3概率600件全未修好</text><rect x="515" y="235" width="435" height="155" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="732.5" y="288.5" font-size="23" text-anchor="middle" fill="#2b414d">同一个概率方案</text><text x="732.5" y="319.5" font-size="23" text-anchor="middle" fill="#2b414d">1/3概率无未修好件</text><text x="732.5" y="350.5" font-size="23" text-anchor="middle" fill="#2b414d">2/3概率600件全未修好</text><text x="490" y="448" font-size="21" text-anchor="middle" fill="#2b414d">各行结果分布相同；确定方案与概率方案的风险不同。</text><text x="490" y="487" font-size="20" text-anchor="middle" fill="#2b414d">表述可改变选择，具体效应需在任务与人群中检验。</text></svg>