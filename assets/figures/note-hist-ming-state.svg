<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">明中后期章奏的处理关系</title><desc id="desc">官员章奏、内阁票拟、皇帝御批与六部执行相联系；皇帝可以发回改拟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="63" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">明中后期章奏的处理关系</text><rect x="60" y="211" width="190" height="142" rx="16" fill="#eef3e9" stroke="#d3dddc" stroke-width="1.5"/><text x="155.0" y="249" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">官员章奏</text><text x="155.0" y="290" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">上报政务</text><rect x="290" y="211" width="190" height="142" rx="16" fill="#eaf2f4" stroke="#d3dddc" stroke-width="1.5"/><text x="385.0" y="249" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">内阁票拟</text><text x="385.0" y="290" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">提出批答意见</text><rect x="520" y="211" width="190" height="142" rx="16" fill="#f2edf5" stroke="#d3dddc" stroke-width="1.5"/><text x="615.0" y="249" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">皇帝决定</text><text x="615.0" y="290" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">采纳或改拟</text><rect x="750" y="211" width="190" height="142" rx="16" fill="#f5eee2" stroke="#d3dddc" stroke-width="1.5"/><text x="845.0" y="249" font-size="25" fill="#283e49" text-anchor="middle" font-weight="600">执行机构</text><text x="845.0" y="290" font-size="21" fill="#596b74" text-anchor="middle" font-weight="400">六部等办理</text><path d="M252 282H274" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M482 282H504" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M712 282H734" fill="none" stroke="#6d8c93" stroke-width="2.8" marker-end="url(#arrow)"/><text x="815" y="394" font-size="21" fill="#886b95" text-anchor="middle" font-weight="400">御批／批红</text><text x="815" y="424" font-size="18" fill="#596b74" text-anchor="middle" font-weight="400">部分时期司礼监代行</text><path d="M615 210V138H385V196" fill="none" stroke="#6d8c93" stroke-width="2.8" stroke-dasharray="6 7" marker-end="url(#arrow)"/><text x="500" y="122" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">不同意可发回重拟</text><text x="60" y="534" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">常见文书关系；皇帝也可面议或暂不处理，实际权力随时期变化。</text></g></svg>