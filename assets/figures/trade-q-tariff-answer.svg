<svg xmlns="http://www.w3.org/2000/svg" width="980" height="585" viewBox="0 0 980 585" role="img" aria-labelledby="title desc"><title id="title">征税后的价格、数量与税楔</title><desc id="desc">纵轴价格、横轴数量，需求向下，供给向上。税后消费者价格上升、交易量下降，税楔区分消费者支付与供给者净收入。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","SimSun",serif}</style><rect width="980" height="585" fill="white"/><path d="M110 470 L850 470" fill="none" stroke="#2e414c" stroke-width="2" marker-end="url(#arrow)"/><path d="M110 470 L110 50" fill="none" stroke="#2e414c" stroke-width="2" marker-end="url(#arrow)"/><text x="93" y="51" font-size="22" fill="#2e414c" text-anchor="end" font-weight="400">价格 P</text><text x="857" y="478" font-size="22" fill="#2e414c" text-anchor="start" font-weight="400">数量 Q</text><path d="M160 78 L750 403" fill="none" stroke="#597c98" stroke-width="3"/><text x="762" y="409" font-size="23" fill="#597c98" text-anchor="start" font-weight="400">D</text><path d="M160 367.5 L750 102" fill="none" stroke="#4c8a80" stroke-width="3"/><text x="760" y="110" font-size="23" fill="#4c8a80" text-anchor="start" font-weight="400">S</text><text x="905" y="465" font-size="20" fill="#2e414c" text-anchor="start" font-weight="400"></text><path d="M160 287.5 L690 49" fill="none" stroke="#a57076" stroke-width="3"/><text x="712" y="62" font-size="23" fill="#a57076" text-anchor="start" font-weight="400">S＋税</text><path d="M110 193 L370 193" fill="none" stroke="#a57076" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M370 193 L370 470" fill="none" stroke="#a57076" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M110 237 L450 237" fill="none" stroke="#2e414c" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M450 237 L450 470" fill="none" stroke="#2e414c" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M110 273 L370 273" fill="none" stroke="#4c8a80" stroke-width="1.2" stroke-dasharray="6 5"/><text x="97" y="198" font-size="21" fill="#a57076" text-anchor="end" font-weight="400">P消</text><text x="97" y="244" font-size="21" fill="#2e414c" text-anchor="end" font-weight="400">P₀</text><text x="97" y="281" font-size="21" fill="#4c8a80" text-anchor="end" font-weight="400">P净</text><text x="370" y="502" font-size="21" fill="#a57076" text-anchor="middle" font-weight="400">Q税</text><text x="450" y="502" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">Q₀</text><path d="M385 196 L385 271" fill="none" stroke="#a57076" stroke-width="2"/><text x="403" y="292" font-size="21" fill="#a57076" text-anchor="start" font-weight="400">税楔</text><text x="490" y="552" font-size="19" fill="#2e414c" text-anchor="middle" font-weight="400">局部均衡示意：竞争性市场、需求不变、从量税、其他条件不变。</text></svg>