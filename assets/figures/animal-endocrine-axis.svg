<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc"><title id="title">下丘脑、垂体前叶与甲状腺轴</title><desc id="desc">TRH促进TSH释放，TSH刺激甲状腺，T3和T4产生组织效应并负反馈作用前叶和下丘脑，反馈使用平端线。</desc><defs><marker id="a354c59" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#354c59"/></marker><marker id="a587f9e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#587f9e"/></marker><marker id="abd6b68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6b68"/></marker><marker id="a528d85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#528d85"/></marker><marker id="ab9904b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b9904b"/></marker><marker id="a94749e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94749e"/></marker></defs><g font-family="Songti SC,STSong,SimSun,serif"><rect x="245" y="23" width="270" height="66" rx="9" fill="#eef3f7" stroke="#587f9e" stroke-width="1.7"/><text x="380" y="66" font-size="24" text-anchor="middle" fill="#354c59">下丘脑</text><rect x="245" y="155" width="270" height="66" rx="9" fill="#f0edf5" stroke="#94749e" stroke-width="1.7"/><text x="380" y="197" font-size="24" text-anchor="middle" fill="#354c59">垂体前叶</text><rect x="245" y="287" width="270" height="66" rx="9" fill="#edf4f0" stroke="#528d85" stroke-width="1.7"/><text x="380" y="329" font-size="24" text-anchor="middle" fill="#354c59">甲状腺</text><rect x="245" y="420" width="270" height="58" rx="9" fill="#faf3e8" stroke="#b9904b" stroke-width="1.7"/><text x="380" y="458" font-size="22" text-anchor="middle" fill="#354c59">靶组织效应</text><path d="M380 91V149" fill="none" stroke="#587f9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a587f9e)"/><text x="424" y="127" font-size="19" text-anchor="start" fill="#587f9e">TRH</text><path d="M380 223V280" fill="none" stroke="#94749e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a94749e)"/><text x="424" y="260" font-size="19" text-anchor="start" fill="#94749e">TSH</text><path d="M380 355V413" fill="none" stroke="#528d85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a528d85)"/><text x="424" y="392" font-size="19" text-anchor="start" fill="#528d85">T₃、T₄</text><path d="M380 383H140V55H230" fill="none" stroke="#bd6b68" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 42V68" fill="none" stroke="#bd6b68" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 188H230" fill="none" stroke="#bd6b68" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 175V201" fill="none" stroke="#bd6b68" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="123" y="265" font-size="20" text-anchor="end" fill="#bd6b68">负反馈</text><text x="621" y="174" font-size="18" text-anchor="middle" fill="#354c59">箭头：促进</text><text x="621" y="213" font-size="18" text-anchor="middle" fill="#354c59">平端线：抑制</text></g></svg>