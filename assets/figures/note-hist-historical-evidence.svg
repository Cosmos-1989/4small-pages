<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">从材料到历史解释</title><desc id="desc">从材料到历史解释；材料来源：形成与保存情境；内容分析：立场与记录目的；相互校验：独立证据的比较；历史解释：范围与不确定性</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="520" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="65" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">从材料到历史解释</text><rect x="55.0" y="205" width="188.5" height="146" rx="18" fill="#eaf2f4" stroke="#c9d8d8" stroke-width="2"/><text x="149.25" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">材料来源</text><text x="149.25" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">形成与保存情境</text><path d="M247.5 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="277.5" y="205" width="188.5" height="146" rx="18" fill="#eef3e9" stroke="#c9d8d8" stroke-width="2"/><text x="371.75" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">内容分析</text><text x="371.75" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">立场与记录目的</text><path d="M470.0 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="500.0" y="205" width="188.5" height="146" rx="18" fill="#f2edf5" stroke="#c9d8d8" stroke-width="2"/><text x="594.25" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">相互校验</text><text x="594.25" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">独立证据的比较</text><path d="M692.5 277h25" stroke="#6d8c93" stroke-width="3" marker-end="url(#arrow)"/><rect x="722.5" y="205" width="188.5" height="146" rx="18" fill="#f5eee2" stroke="#c9d8d8" stroke-width="2"/><text x="816.75" y="256" font-size="24" fill="#283e49" text-anchor="middle" font-weight="600">历史解释</text><text x="816.75" y="301" font-size="20" fill="#596b74" text-anchor="middle" font-weight="400">范围与不确定性</text><text x="60" y="442" font-size="19" fill="#63747a" text-anchor="start" font-weight="400">箭头表示研究步骤；新材料可能使解释得到修订。</text></g></svg>