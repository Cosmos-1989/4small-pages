<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">无穷远校正显微镜的前级成像</title><desc id="d">一个离轴物点通过物镜后形成倾斜平行束，经管镜会聚成倒置中间像，未画目镜。</desc><defs><marker id="a28434b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#28434b"/></marker><marker id="a467d9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#467d9b"/></marker><marker id="a548c7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#548c7d"/></marker><marker id="ab18a4d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b18a4d"/></marker><marker id="a8b709d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#8b709d"/></marker><marker id="abd7067" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#bd7067"/></marker><marker id="a637780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#637780"/></marker></defs><rect width="1000" height="620" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="55" y="58" font-size="30" fill="#28434b" text-anchor="start">物镜与管镜共同形成中间像</text><path d="M65 270L925 270" fill="none" stroke="#b5c4c7" stroke-width="1" stroke-dasharray="6 6"/><path d="M270 160 Q246 270 270 390 Q294 270 270 160" fill="#e9f2f5" stroke="#467d9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="125" font-size="26" fill="#467d9b" text-anchor="middle">物镜</text><path d="M550 160 Q526 270 550 390 Q574 270 550 160" fill="#e9f2f5" stroke="#467d9b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="125" font-size="26" fill="#467d9b" text-anchor="middle">管镜</text><path d="M170 270L170 240" fill="none" stroke="#548c7d" stroke-width="5" marker-end="url(#a548c7d)"/><path d="M750 270L750 330" fill="none" stroke="#8b709d" stroke-width="5" marker-end="url(#a8b709d)"/><path d="M170 240L270 240L550 324L750 330" fill="none" stroke="#b18a4d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 240L270 270L550 354L750 330" fill="none" stroke="#bd7067" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="435" font-size="24" fill="#548c7d" text-anchor="middle">标本上的物点</text><text x="750" y="435" font-size="24" fill="#8b709d" text-anchor="middle">倒置的中间像</text><text x="404" y="190" font-size="23" fill="#637780" text-anchor="middle">同一物点：平行光束</text><text x="55" y="520" font-size="23" fill="#28434b" text-anchor="start">不同物点对应不同倾角；不是所有光线都平行于主轴。</text><text x="55" y="565" font-size="20" fill="#637780" text-anchor="start">近轴薄透镜示意；图中省略目镜及像差。</text></g></svg>