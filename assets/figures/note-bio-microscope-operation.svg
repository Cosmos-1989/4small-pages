<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">柯勒照明的视场光阑调整</title><desc id="d">圆形观察视场内的八角形光阑像依次缩小、合焦对中，再打开到视场外，未画样本。</desc><defs><marker id="a28434b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#28434b"/></marker><marker id="a467d9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#467d9b"/></marker><marker id="a548c7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#548c7d"/></marker><marker id="ab18a4d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b18a4d"/></marker><marker id="a8b709d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#8b709d"/></marker><marker id="abd7067" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#bd7067"/></marker><marker id="a637780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#637780"/></marker><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter><clipPath id="clip0"><circle cx="180" cy="305" r="124"/></clipPath><clipPath id="clip1"><circle cx="500" cy="305" r="124"/></clipPath><clipPath id="clip2"><circle cx="820" cy="305" r="124"/></clipPath></defs><rect width="1000" height="650" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="55" y="58" font-size="30" fill="#28434b" text-anchor="start">从视场光阑的像建立均匀照明</text><text x="180" y="128" font-size="24" fill="#28434b" text-anchor="middle">缩小视场光阑</text><circle cx="180" cy="305" r="124" fill="#e9e8dc" stroke="#c2c7bf" stroke-width="2"/><g clip-path="url(#clip0)" filter="url(#blur)"><path d="M288.0 315.2L245.2 358.0L184.8 358.0L142.0 315.2L142.0 254.8L184.8 212.0L245.2 212.0L288.0 254.8Z" fill="#fff9d9" stroke="#b18a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="180" cy="305" r="124" fill="none" stroke="#839b9d" stroke-width="2"/><text x="180" y="475" font-size="21" fill="#637780" text-anchor="middle">边缘可见但偏心</text><text x="500" y="128" font-size="24" fill="#28434b" text-anchor="middle">合焦并对中</text><circle cx="500" cy="305" r="124" fill="#e9e8dc" stroke="#c2c7bf" stroke-width="2"/><g clip-path="url(#clip1)"><path d="M573.0 335.2L530.2 378.0L469.8 378.0L427.0 335.2L427.0 274.8L469.8 232.0L530.2 232.0L573.0 274.8Z" fill="#fff9d9" stroke="#b18a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="500" cy="305" r="124" fill="none" stroke="#839b9d" stroke-width="2"/><text x="500" y="475" font-size="21" fill="#637780" text-anchor="middle">边缘清晰、位于中央</text><text x="820" y="128" font-size="24" fill="#28434b" text-anchor="middle">打开至刚出视野</text><circle cx="820" cy="305" r="124" fill="#e9e8dc" stroke="#c2c7bf" stroke-width="2"/><g clip-path="url(#clip2)"><path d="M945.6 357.0L872.0 430.6L768.0 430.6L694.4 357.0L694.4 253.0L768.0 179.4L872.0 179.4L945.6 253.0Z" fill="#fff9d9" stroke="#b18a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="820" cy="305" r="124" fill="none" stroke="#839b9d" stroke-width="2"/><text x="820" y="475" font-size="21" fill="#637780" text-anchor="middle">照明区域覆盖视场</text><text x="55" y="550" font-size="23" fill="#28434b" text-anchor="start">视场光阑限制照明范围；孔径光阑另行匹配反差与数值孔径。</text><text x="55" y="595" font-size="20" fill="#637780" text-anchor="start">前提是标本已经合焦；具体部件与调节方式依机型而定。</text></g></svg>