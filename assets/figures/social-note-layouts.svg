<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" role="img" aria-labelledby="title desc"><title id="title">总体布局与战略布局</title><desc id="desc">五位一体按五个建设领域展开，四个全面按战略部署展开，两个概括不具有逐项对应关系。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","SimSun",serif}</style><rect width="980" height="490" fill="white"/><text x="490" y="38" font-size="25" fill="#597c98" text-anchor="middle" font-weight="600">五位一体 · 事业建设的领域</text><rect x="22" y="79" width="180" height="75" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="112.0" y="123.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">经济建设</text><rect x="215" y="79" width="180" height="75" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="305.0" y="123.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">政治建设</text><rect x="408" y="79" width="180" height="75" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="498.0" y="123.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">文化建设</text><rect x="601" y="79" width="180" height="75" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="691.0" y="123.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">社会建设</text><rect x="794" y="79" width="180" height="75" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="884.0" y="123.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">生态文明建设</text><text x="490" y="196" font-size="20" fill="#2e414c" text-anchor="middle" font-weight="400">2012年十八大已明确；各领域相互联系，不能化约为部门清单。</text><path d="M35 225 L945 225" fill="none" stroke="#aab9c0" stroke-width="1.4" stroke-dasharray="6 5"/><text x="490" y="268" font-size="25" fill="#4c8a80" text-anchor="middle" font-weight="600">四个全面 · 当前战略部署</text><rect x="25" y="310" width="225" height="100" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="137.5" y="352.0" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">全面建设社会主义</text><text x="137.5" y="382.0" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">现代化国家</text><rect x="265" y="310" width="225" height="100" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="377.5" y="367.0" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">全面深化改革</text><rect x="505" y="310" width="225" height="100" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="617.5" y="367.0" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">全面依法治国</text><rect x="745" y="310" width="225" height="100" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="857.5" y="367.0" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">全面从严治党</text><text x="490" y="458" font-size="19" fill="#2e414c" text-anchor="middle" font-weight="400">首项曾为全面建成小康社会；阶段变化与其余三项的功能需分别理解。</text></svg>