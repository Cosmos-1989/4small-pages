<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 380" role="img" aria-labelledby="title desc"><title id="title">产品价值中的旧价值与新价值</title><desc id="desc">假设产品价值为120：本期生产资料价值转移80，活劳动形成40，其中再生产劳动力价值20、剩余价值20。宽度依数值成比例。</desc><rect width="970" height="380" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#607984"/></marker></defs><g font-family="'Songti SC','STSong','Noto Serif CJK SC',SimSun,serif" fill="#253d48">
<text x="65" y="43" font-size="25" text-anchor="start" fill="#253d48">产品价值：120个价值单位（假设）</text><rect x="65" y="85" width="560" height="100" rx="0" fill="#dce8ed" stroke="#b6c8ce"/><rect x="625" y="85" width="140" height="100" rx="0" fill="#dfede5" stroke="#b6c8ce"/><rect x="765" y="85" width="140" height="100" rx="0" fill="#f5e6d3" stroke="#b6c8ce"/><text x="345" y="125" font-size="24" text-anchor="middle" fill="#253d48">生产资料转移的价值</text><text x="345" y="160" font-size="25" text-anchor="middle" fill="#253d48">c＝80</text><text x="695" y="125" font-size="21" text-anchor="middle" fill="#253d48">劳动力价值</text><text x="695" y="160" font-size="25" text-anchor="middle" fill="#253d48">v＝20</text><text x="835" y="125" font-size="21" text-anchor="middle" fill="#253d48">剩余价值</text><text x="835" y="160" font-size="25" text-anchor="middle" fill="#253d48">s＝20</text><path d="M65 204 V221 H625 V204" fill="none" stroke="#607984" stroke-width="2.5"/><text x="345" y="256" font-size="24" text-anchor="middle" fill="#253d48">旧价值：80</text><path d="M625 204 V221 H905 V204" fill="none" stroke="#607984" stroke-width="2.5"/><text x="765" y="256" font-size="24" text-anchor="middle" fill="#253d48">新形成价值：40</text><text x="65" y="309" font-size="21" text-anchor="start" fill="#253d48">c为本期耗费并转入产品的价值；不等于机器的全部预付购置额。</text><text x="65" y="343" font-size="21" text-anchor="start" fill="#253d48">条段宽度按例示数值绘制，未表示任何企业的实际生产或分配比例。</text>
</g></svg>