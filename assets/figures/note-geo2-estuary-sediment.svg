<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：潮汐河口的沙坎与航道</title><desc id="desc">河流供沙与涨落潮的反复侵蚀、再沉积可形成沙坎和冲刷槽；沙坎与潮位变化影响可通航水深。</desc><defs>
<marker id="ab" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#3384a2"/></marker>
<marker id="ad" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#23627d"/></marker>
<marker id="ag" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#668a76"/></marker>
<marker id="ar" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#bb7057"/></marker>
<marker id="am" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#526872"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cce9ed"/><stop offset="1" stop-color="#e7f4f3"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcc7"/><stop offset="1" stop-color="#c8ab88"/></linearGradient>
</defs><rect width="1100" height="560" fill="#fbfcfa"/><text x="45" y="57" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="25" fill="#243842" font-weight="700" text-anchor="start" >潮汐河口 · 沙坎与冲刷槽</text><line x1="45" y1="73" x2="1055" y2="73" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><path d="M78 218 C261 212 400 221 548 215 C705 209 866 216 1023 211 L1023 451 L78 451Z" fill="url(#water)" stroke="#628ca0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M78 350 C212 347 301 342 390 326 C461 315 501 329 552 354 C640 393 728 398 817 370 C886 348 939 354 1023 359 L1023 453 H78Z" fill="#d9c5a5" stroke="#9a7859" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M79 350 C211 347 301 342 390 326 C462 315 501 329 552 354 C639 393 728 398 817 370 C886 348 939 354 1023 359" fill="none" stroke="#9d7b60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M396 325 C469 308 523 330 554 353" fill="none" stroke="#c4a077" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M140 255 C285 251 382 264 477 288" fill="none" stroke="#3384a2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><path d="M925 280 C784 279 662 268 580 260" fill="none" stroke="#23627d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ad)"/><text x="142" y="180" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#3384a2" font-weight="700" text-anchor="start" >河流来沙</text><text x="867" y="178" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#23627d" font-weight="700" text-anchor="start" >涨、落潮往复</text><line x1="448" y1="323" x2="407" y2="155" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="448" cy="323" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="209" y="159" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >沙坎：局地水深较浅</text><line x1="699" y1="391" x2="748" y2="152" stroke="#78909a" stroke-width="2" stroke-linecap="round" /><circle cx="699" cy="391" r="3" fill="#78909a" stroke="none" stroke-width="2"/><text x="756" y="156" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="21" fill="#243842" font-weight="400" text-anchor="start" >冲刷槽：局地较深</text><text x="535" y="245" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >通航水深受潮位和河床共同影响</text><line x1="45" y1="489" x2="1055" y2="489" stroke="#d6e2df" stroke-width="2" stroke-linecap="round" /><text x="48" y="524" font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif" font-size="18" fill="#526872" font-weight="400" text-anchor="start" >剖面无实测刻度；不能据此估算吃水深度或沙坎迁移速率。</text></svg>