<svg xmlns="http://www.w3.org/2000/svg" width="980" height="475" viewBox="0 0 980 475" role="img" aria-labelledby="title desc">
<title id="title">直接投资流量与头寸的联系</title><desc id="desc">期初直接投资头寸，加本期金融交易，再加价格、汇率和其他非交易变化，得到期末头寸。不同色块区分时点存量、期间交易流量和非交易调整，框形面积不表示数量。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="475" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="490" y="46" font-size="27" text-anchor="middle" fill="#253e48">从期初头寸到期末头寸</text><rect x="35" y="140" width="178" height="115" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="124.0" y="188.5" font-size="22" text-anchor="middle" fill="#253e48">期初头寸</text><text x="124.0" y="222.5" font-size="22" text-anchor="middle" fill="#253e48">时点持有价值</text><text x="238" y="207" font-size="32" text-anchor="middle" fill="#253e48">＋</text><rect x="264" y="140" width="190" height="115" rx="8" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="359.0" y="188.5" font-size="22" text-anchor="middle" fill="#253e48">本期金融交易</text><text x="359.0" y="222.5" font-size="22" text-anchor="middle" fill="#253e48">期间交易额</text><text x="480" y="207" font-size="32" text-anchor="middle" fill="#253e48">＋</text><rect x="505" y="140" width="220" height="115" rx="8" fill="#f6eee2" stroke="#c9d7db" stroke-width="1.3"/><text x="615.0" y="188.5" font-size="22" text-anchor="middle" fill="#253e48">估值及其他变化</text><text x="615.0" y="222.5" font-size="22" text-anchor="middle" fill="#253e48">价格、汇率等</text><text x="751" y="207" font-size="32" text-anchor="middle" fill="#253e48">＝</text><rect x="776" y="140" width="169" height="115" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="860.5" y="188.5" font-size="22" text-anchor="middle" fill="#253e48">期末头寸</text><text x="860.5" y="222.5" font-size="22" text-anchor="middle" fill="#253e48">时点持有价值</text><text x="124" y="302" font-size="24" text-anchor="middle" fill="#39798d">存量</text><text x="359" y="302" font-size="24" text-anchor="middle" fill="#557d66">交易流量</text><text x="615" y="302" font-size="24" text-anchor="middle" fill="#5f747d">非交易调整</text><text x="860" y="302" font-size="24" text-anchor="middle" fill="#39798d">存量</text><line x1="55" y1="350" x2="925" y2="350" stroke="#c9d7db" stroke-width="1.5"/><text x="490" y="393" font-size="25" text-anchor="middle" fill="#253e48">头寸变化不等于投资流量。</text><text x="490" y="436" font-size="22" text-anchor="middle" fill="#5f747d">即使没有新增交易，价格和汇率变化也可能改变持有价值。</text>
</g></svg>
