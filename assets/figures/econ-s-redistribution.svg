<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"><title>从市场收入到可支配收入与公共服务</title><desc>可支配收入表示现金口径的加减关系；公共服务另列，避免与现金给付混同。</desc><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718f99"/></marker></defs><g font-family="&quot;Songti SC&quot;, &quot;STSong&quot;, &quot;SimSun&quot;, serif"><text x="450" y="35" text-anchor="middle" font-size="25" fill="#294752">现金资源与公共服务分开核算</text><rect x="20" y="95" width="185" height="100" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="112.5" y="152.0" text-anchor="middle" font-size="20" fill="#294752">市场收入</text><rect x="245" y="95" width="185" height="100" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="337.5" y="152.0" text-anchor="middle" font-size="20" fill="#294752">加：现金转移</text><rect x="470" y="95" width="185" height="100" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="562.5" y="137.5" text-anchor="middle" font-size="20" fill="#294752">减：直接税</text><text x="562.5" y="166.5" text-anchor="middle" font-size="20" fill="#294752">及社会缴费</text><rect x="695" y="95" width="185" height="100" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="787.5" y="152.0" text-anchor="middle" font-size="20" fill="#294752">可支配收入</text><path d="M205,145 L245,145" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M430,145 L470,145" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M655,145 L695,145" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><rect x="245" y="275" width="410" height="90" rx="12" fill="#f7f2e9" stroke="#aec4ca"/><text x="450.0" y="327.0" text-anchor="middle" font-size="20" fill="#294752">教育、医疗等实物公共服务</text><text x="450" y="246" text-anchor="middle" font-size="20" fill="#294752">另行观察覆盖、质量与可达性</text><text x="450" y="410" text-anchor="middle" font-size="20" fill="#294752">实物服务可改善生活，但不等于家庭可自由支出的现金</text></g></svg>