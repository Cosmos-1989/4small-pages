<text x="55" y="88" class="label">地震源</text><text x="55" y="116" class="minor">断层突然滑动</text>
<text x="339" y="235" class="minor" text-anchor="end">传播路径</text>
<text x="810" y="86" class="label">局地场地</text><text x="810" y="115" class="minor">沉积层可改变震动</text>
<text x="753" y="478" class="minor">沉积层</text><text x="138" y="470" class="minor">基岩</text>
<text x="266" y="157" class="small" text-anchor="middle">建筑结构影响损害</text>
<text x="500" y="539" class="small" text-anchor="middle">震动强弱不能仅凭岩性判断，须结合震源、频率与场地参数</text>
