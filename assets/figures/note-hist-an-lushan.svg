<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">唐代军事财政的变化</title><desc id="desc">唐代军事财政的变化；早期唐代：府兵轮番宿卫、生产与军事义务联系、租庸调提供资源；长期边防扩大：长服役边军增加、边镇掌握更多兵力、转运与财政需求扩大；安史之乱后：地方驻军长期存在、中央与藩镇多次博弈、两税、盐利等支撑军费</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">唐代军事财政的变化</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">早期唐代</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">府兵轮番宿卫</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">生产与军事义务联系</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">租庸调提供资源</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">长期边防扩大</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">长服役边军增加</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">边镇掌握更多兵力</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">转运与财政需求扩大</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">安史之乱后</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地方驻军长期存在</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">中央与藩镇多次博弈</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">两税、盐利等支撑军费</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">制度变化相互交叠；并非所有藩镇都脱离中央。</text></g></svg>