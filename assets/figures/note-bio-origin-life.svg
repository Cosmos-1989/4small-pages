<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">原始细胞模型的三类耦合功能</title><desc id="desc">脂质样边界包围可遗传的RNA体系和反应网络，外界原料与内部有物质交换。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="660" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">原始细胞模型的三类耦合功能</text><ellipse cx="500" cy="345" rx="265" ry="205" fill="#edf5ef" stroke="#8fb4a3" stroke-width="8"/><ellipse cx="500" cy="345" rx="251" ry="191" fill="none" stroke="#bad0c4" stroke-width="3"/><path d="M365 322C405 266 430 380 473 330S535 292 566 340" fill="none" stroke="#92749d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M365 348C405 292 430 406 473 356S535 318 566 366" fill="none" stroke="#3f7d96" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="468" y="271" font-size="25" fill="#92749d" text-anchor="middle">可遗传的复制体系</text><text x="466" y="420" font-size="24" fill="#5d8e78" text-anchor="middle">反应网络与能量转换</text><circle cx="397" cy="455" r="16" fill="#b78e49" stroke="none" stroke-width="2"/><circle cx="483" cy="455" r="16" fill="#bb695c" stroke="none" stroke-width="2"/><circle cx="575" cy="455" r="16" fill="#5d8e78" stroke="none" stroke-width="2"/><path d="M417 455L459 455" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><path d="M504 455L551 455" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><circle cx="130" cy="270" r="12" fill="#b78e49" stroke="none" stroke-width="2"/><circle cx="160" cy="400" r="12" fill="#bb695c" stroke="none" stroke-width="2"/><circle cx="825" cy="220" r="12" fill="#b78e49" stroke="none" stroke-width="2"/><circle cx="865" cy="350" r="12" fill="#5d8e78" stroke="none" stroke-width="2"/><path d="M156 285L257 325" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="229" font-size="25" fill="#294451" text-anchor="start">外部原料</text><path d="M782 350L877 405" fill="none" stroke="#687e83" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="454" font-size="25" fill="#294451" text-anchor="start">交换产物</text><text x="620" y="159" font-size="27" fill="#5d8e78" text-anchor="start">选择性边界</text><path d="M687 177L688 205" fill="none" stroke="#5d8e78" stroke-width="2"/><text x="500" y="590" font-size="27" fill="#294451" text-anchor="middle">边界、反应与遗传需要相互协调</text><text x="50" y="634" font-size="20" fill="#687e83" text-anchor="start">原始细胞的一类理论模型；分子与边界均不按尺度，不能视作已确认的起源场景。</text></g></svg>