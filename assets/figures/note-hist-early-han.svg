<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">汉初秩序重建的三个方面</title><desc id="desc">汉初秩序重建的三个方面；政治整合：郡与王国并存、官职及权限调整、控制军事联盟、处理王国与朝廷关系；生产恢复：鼓励农业及返乡、减轻部分征发、恢复交通与供给、税役仍因身份而异；法律调整：延续律令与文书、修订刑罚规则、管理户籍和继承、规范不等同于执行</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">汉初秩序重建的三个方面</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">政治整合</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">郡与王国并存</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">官职及权限调整</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">控制军事联盟</text><text x="82.0" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">处理王国与朝廷关系</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">生产恢复</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">鼓励农业及返乡</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">减轻部分征发</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">恢复交通与供给</text><text x="375.3333333333333" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">税役仍因身份而异</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">法律调整</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">延续律令与文书</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">修订刑罚规则</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">管理户籍和继承</text><text x="668.6666666666666" y="386" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">规范不等同于执行</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三个方面同时存在且彼此联系；不表示先后阶段或居民待遇一致。</text></g></svg>