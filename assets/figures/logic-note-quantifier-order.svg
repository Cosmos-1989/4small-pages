<svg xmlns="http://www.w3.org/2000/svg" width="980" height="505" viewBox="0 0 980 505" role="img" aria-labelledby="title desc"><title id="title">量词次序与见证对象</title><desc id="desc">左图每人各有一本书但没有人人共有的书，右图同一本书被所有人拥有，展示全称与存在量词次序差异。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="505" fill="white"/><text x="250" y="42" font-size="25" text-anchor="middle" fill="#2b414d">∀x ∃y：每人有某本书</text><text x="735" y="42" font-size="25" text-anchor="middle" fill="#2b414d">∃y ∀x：某本书人人都有</text><rect x="28" y="100" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="78.0" y="134.5" font-size="24" text-anchor="middle" fill="#2b414d">甲</text><rect x="28" y="190" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="78.0" y="224.5" font-size="24" text-anchor="middle" fill="#2b414d">乙</text><rect x="28" y="280" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="78.0" y="314.5" font-size="24" text-anchor="middle" fill="#2b414d">丙</text><rect x="340" y="140" width="110" height="60" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="395.0" y="177.0" font-size="22" text-anchor="middle" fill="#2b414d">书一</text><rect x="340" y="285" width="110" height="60" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="395.0" y="322.0" font-size="22" text-anchor="middle" fill="#2b414d">书二</text><path d="M139 127 L329 170" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M139 217 L329 315" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M139 307 L329 170" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="518" y="100" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="568.0" y="134.5" font-size="24" text-anchor="middle" fill="#2b414d">甲</text><rect x="518" y="190" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="568.0" y="224.5" font-size="24" text-anchor="middle" fill="#2b414d">乙</text><rect x="518" y="280" width="100" height="55" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="568.0" y="314.5" font-size="24" text-anchor="middle" fill="#2b414d">丙</text><rect x="830" y="140" width="110" height="60" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="885.0" y="177.0" font-size="22" text-anchor="middle" fill="#2b414d">书一</text><rect x="830" y="285" width="110" height="60" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="885.0" y="322.0" font-size="22" text-anchor="middle" fill="#2b414d">书二</text><path d="M629 127 L819 170" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M629 217 L819 170" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M629 307 L819 170" stroke="#557d98" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M490 70 L490 385" stroke="#b4c4cc" stroke-width="1.5" fill="none" stroke-dasharray="6 5"/><text x="250" y="421" font-size="21" text-anchor="middle" fill="#2b414d">不同的人可以对应不同书</text><text x="735" y="421" font-size="21" text-anchor="middle" fill="#2b414d">同一本书对应所有人</text><text x="490" y="474" font-size="20" text-anchor="middle" fill="#2b414d">对象域中的三个人与两本书均已给定；左右量词次序不等价。</text></svg>