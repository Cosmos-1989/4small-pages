<svg xmlns="http://www.w3.org/2000/svg" width="980" height="435" viewBox="0 0 980 435" role="img" aria-labelledby="title desc"><title id="title">工作记忆与推理步骤外化</title><desc id="desc">左边保持前提并操作，右边分步记录P到Q再到R的肯定前件推理。外化降低保持负担但不自动保证正确。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="435" fill="white"/><text x="247" y="42" font-size="25" text-anchor="middle" fill="#2b414d">在脑中持续保持与操作</text><text x="735" y="42" font-size="25" text-anchor="middle" fill="#2b414d">把中间步骤外化</text><rect x="35" y="90" width="425" height="180" rx="11" fill="#edf3f7" stroke="#ccd8de"/><text x="247.5" y="156.0" font-size="24" text-anchor="middle" fill="#2b414d">前提：P → Q，Q → R，P</text><text x="247.5" y="187.0" font-size="24" text-anchor="middle" fill="#2b414d">保持词项及条件方向</text><text x="247.5" y="218.0" font-size="24" text-anchor="middle" fill="#2b414d">同时推导中间结论</text><rect x="520" y="90" width="425" height="59" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="732.5" y="126.5" font-size="23" text-anchor="middle" fill="#2b414d">1．P 与 P → Q，所以 Q</text><rect x="520" y="166" width="425" height="59" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="732.5" y="202.5" font-size="23" text-anchor="middle" fill="#2b414d">2．Q 与 Q → R，所以 R</text><rect x="520" y="242" width="425" height="59" rx="11" fill="#edf5f1" stroke="#ccd8de"/><text x="732.5" y="278.5" font-size="23" text-anchor="middle" fill="#2b414d">3．回查每步使用的前提</text><text x="490" y="398" font-size="20" text-anchor="middle" fill="#2b414d">纸笔、图表与分步记录可以减轻保持负担，仍需检查推理本身。</text></svg>