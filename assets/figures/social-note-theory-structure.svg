<svg xmlns="http://www.w3.org/2000/svg" width="980" height="465" viewBox="0 0 980 465" role="img" aria-labelledby="title desc"><title id="title">理论认识、基本方略与历史总结</title><desc id="desc">2017年八个明确与十四个坚持，2021年十个明确与十三方面成就，按年份及功能并列。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","SimSun",serif}</style><rect width="980" height="465" fill="white"/><text x="255" y="40" font-size="25" fill="#597c98" text-anchor="middle" font-weight="600">2017年 · 十九大报告</text><text x="735" y="40" font-size="25" fill="#4c8a80" text-anchor="middle" font-weight="600">2021年 · 历史决议</text><rect x="35" y="85" width="440" height="115" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="255.0" y="134.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">八个明确</text><text x="255.0" y="164.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">理论认识与基本判断</text><rect x="505" y="85" width="440" height="115" rx="10" fill="#edf5f1" stroke="#cdd8dc"/><text x="725.0" y="134.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">十个明确</text><text x="725.0" y="164.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">发展后的理论概括</text><path d="M480 143 L497 143" fill="none" stroke="#aab9c0" stroke-width="1.4" marker-end="url(#arrow)"/><text x="490" y="232" font-size="21" fill="#2e414c" text-anchor="middle" font-weight="400">需逐条比较增补、调整与延续</text><rect x="35" y="270" width="440" height="115" rx="10" fill="#f0f5f8" stroke="#cdd8dc"/><text x="255.0" y="319.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">十四个坚持</text><text x="255.0" y="349.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">基本方略与行动方向</text><rect x="505" y="270" width="440" height="115" rx="10" fill="#f8f2e9" stroke="#cdd8dc"/><text x="725.0" y="319.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">十三个方面成就</text><text x="725.0" y="349.5" font-size="22" fill="#2e414c" text-anchor="middle" font-weight="400">历史总结与评价</text><text x="490" y="430" font-size="20" fill="#2e414c" text-anchor="middle" font-weight="400">概括对象与功能不同，不是互相替换的同一份数字清单。</text></svg>