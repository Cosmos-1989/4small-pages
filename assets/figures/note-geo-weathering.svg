<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">裂隙风化与碎屑迁移的边界</title><desc id="desc">左右两个岩面分别示意冻融裂隙扩张与含二氧化碳水的水岩反应，坡下碎屑被移动后才是侵蚀搬运。</desc>
<defs>
