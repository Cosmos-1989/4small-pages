<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">抗日战争的阶段与终点</title><desc id="desc">抗日战争的阶段与终点；1931年：九一八事变；1936年12月：西安事变；1937年7月：全面抗战开始；1941年12月：战争进一步国际化；1945年8—9月：日本投降与中国战区受降</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="650" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="62" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">抗日战争的阶段与终点</text><path d="M253 109V540.0" stroke="#b8cdd0" stroke-width="3"/><circle cx="253" cy="111.0" r="9" fill="#42788f"/><text x="224" y="119.0" font-size="23" fill="#42788f" text-anchor="end" font-weight="600">1931年</text><text x="285" y="119.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">九一八事变</text><text x="285" y="150.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">日本侵占东北，局部抗战开始</text><circle cx="253" cy="218.5" r="9" fill="#5b8b79"/><text x="224" y="226.5" font-size="23" fill="#5b8b79" text-anchor="end" font-weight="600">1936年12月</text><text x="285" y="226.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">西安事变</text><text x="285" y="257.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">和平解决推动停止内战、联合抗日</text><circle cx="253" cy="326.0" r="9" fill="#886b95"/><text x="224" y="334.0" font-size="23" fill="#886b95" text-anchor="end" font-weight="600">1937年7月</text><text x="285" y="334.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">全面抗战开始</text><text x="285" y="365.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">卢沟桥事变后战争扩大</text><circle cx="253" cy="433.5" r="9" fill="#b68b4d"/><text x="224" y="441.5" font-size="23" fill="#b68b4d" text-anchor="end" font-weight="600">1941年12月</text><text x="285" y="441.5" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">战争进一步国际化</text><text x="285" y="472.5" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">中国战场与太平洋战争相联系</text><circle cx="253" cy="541.0" r="9" fill="#b76759"/><text x="224" y="549.0" font-size="23" fill="#b76759" text-anchor="end" font-weight="600">1945年8—9月</text><text x="285" y="549.0" font-size="24" fill="#283e49" text-anchor="start" font-weight="600">日本投降与中国战区受降</text><text x="285" y="580.0" font-size="19" fill="#596b74" text-anchor="start" font-weight="400">8月15日宣布；9月2日签署；9月9日在华受降</text><text x="60" y="634" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">事件按时间先后排列，间隔不代表历时比例。</text></g></svg>