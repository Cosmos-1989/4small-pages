<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">主张、资料与推理根据</title><desc id="desc">图尔敏模型的功能示意：资料经推理根据支持主张；根据有自己的支持，主张有范围与例外。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#81929a"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="480" fill="white"/><rect x="28" y="75" width="240" height="105" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="148.0" y="120.0" font-size="23" text-anchor="middle" fill="#2d414b">资料</text><text x="148.0" y="151.0" font-size="23" text-anchor="middle" fill="#2d414b">可核对的事实或理由</text><rect x="368" y="75" width="240" height="105" rx="10" fill="#edf3f6" stroke="#d1dde2"/><text x="488.0" y="120.0" font-size="23" text-anchor="middle" fill="#2d414b">推理根据</text><text x="488.0" y="151.0" font-size="23" text-anchor="middle" fill="#2d414b">为何能从此到彼</text><rect x="708" y="75" width="240" height="105" rx="10" fill="#edf5f1" stroke="#d1dde2"/><text x="828.0" y="120.0" font-size="23" text-anchor="middle" fill="#2d414b">主张</text><text x="828.0" y="151.0" font-size="23" text-anchor="middle" fill="#2d414b">拟支持的判断</text><path d="M273 127 L360 127" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M613 127 L700 127" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368" y="280" width="240" height="88" rx="10" fill="#f8f2e9" stroke="#d1dde2"/><text x="488.0" y="316.5" font-size="23" text-anchor="middle" fill="#2d414b">根据的支持</text><text x="488.0" y="347.5" font-size="23" text-anchor="middle" fill="#2d414b">规则、研究或解释</text><path d="M488 273 L488 188" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="708" y="280" width="240" height="88" rx="10" fill="#f6edf0" stroke="#d1dde2"/><text x="828.0" y="316.5" font-size="23" text-anchor="middle" fill="#2d414b">限定与例外</text><text x="828.0" y="347.5" font-size="23" text-anchor="middle" fill="#2d414b">范围、力度、条件</text><path d="M828 273 L828 188" fill="none" stroke="#b1c1c9" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="490" y="442" font-size="22" text-anchor="middle" fill="#2d414b">支持关系需要说明和检验；图式本身不保证结论真实。</text></svg>