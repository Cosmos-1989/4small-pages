<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">怎样比较赋役制度</title><desc id="desc">怎样比较赋役制度；计征依据：丁口与户等、田亩与财产、交易及专卖；实际缴纳：实物与货币、劳役及折纳、附加与运输成本；财政用途：军费及行政、仓储与救济、水利及交通</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">怎样比较赋役制度</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">计征依据</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">丁口与户等</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">田亩与财产</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">交易及专卖</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">实际缴纳</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">实物与货币</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">劳役及折纳</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">附加与运输成本</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">财政用途</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">军费及行政</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">仓储与救济</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">水利及交通</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">比较前须限定地区、时期、税项及资料口径。</text></g></svg>