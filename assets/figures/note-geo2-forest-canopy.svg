<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">图甲：高层冠盖对林下光照的遮蔽</title><desc id="desc">高层乔木冠盖可截获一部分入射光，使林下幼苗和草本获得的光减少；不同高度层的盖度可以重叠。</desc><defs>
