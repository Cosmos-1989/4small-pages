<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">大气温度层结</title><desc id="desc">由下至上依次为对流层、平流层、中间层和热层，典型平均温度随高度下降、上升、下降、上升。</desc><defs>
