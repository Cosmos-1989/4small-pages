<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">mRNA降解路径</title><desc id="desc">mRNA的polyA尾缩短后，一条路径经去帽自5撇到3撇降解，另一条自3撇到5撇降解。</desc><style>text{font-family:Songti SC,STSong,SimSun,Noto Serif CJK SC,serif;paint-order:stroke fill;stroke:#fff;stroke-width:0.5px}</style><defs>
      <marker id="arw-147d9b" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#147d9b"/></marker>
      <marker id="arw-d98756" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d98756"/></marker>
      <marker id="arw-8261a3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8261a3"/></marker>
      <marker id="arw-459274" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#459274"/></marker>
      <marker id="arw-bd5a5d" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bd5a5d"/></marker>
    </defs><rect x="4" y="4" width="952" height="492" rx="18" fill="#fff" stroke="#e2e9eb" stroke-width="1"/><text x="480" y="63" font-size="22" fill="#263744" text-anchor="middle" font-weight="normal">有帽、有尾的成熟 mRNA</text><circle cx="171" cy="150" r="25" fill="#f3eef8" stroke="#8261a3" stroke-width="2"/><text x="171" y="157" font-size="16" fill="#8261a3" text-anchor="middle" font-weight="normal">帽</text><line x1="197" y1="150" x2="744" y2="150" stroke="#147d9b" stroke-width="5" stroke-linecap="round"/><path d="M748 150 C769 133 781 168 799 150 C817 132 829 168 849 150" fill="none" stroke="#d98756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="208" font-size="18" fill="#263744" text-anchor="middle" font-weight="normal">5′</text><text x="854" y="207" font-size="18" fill="#263744" text-anchor="middle" font-weight="normal">3′</text><text x="804" y="117" font-size="17" fill="#d98756" text-anchor="middle" font-weight="normal">poly(A) 尾</text><line x1="480" y1="179" x2="480" y2="239" stroke="#147d9b" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-147d9b)"/><text x="552" y="223" font-size="18" fill="#147d9b" text-anchor="start" font-weight="normal">常见起点：去腺苷酸化</text><circle cx="171" cy="280" r="25" fill="#f3eef8" stroke="#8261a3" stroke-width="2"/><text x="171" y="287" font-size="16" fill="#8261a3" text-anchor="middle" font-weight="normal">帽</text><line x1="197" y1="280" x2="744" y2="280" stroke="#147d9b" stroke-width="5" stroke-linecap="round"/><path d="M747 280 L773 280" fill="none" stroke="#d98756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="803" y="286" font-size="17" fill="#d98756" text-anchor="start" font-weight="normal">尾缩短</text><path d="M387 302 C305 330 257 344 238 363" fill="none" stroke="#8261a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-8261a3)"/><path d="M574 302 C649 330 701 344 724 363" fill="none" stroke="#459274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-459274)"/><rect x="73" y="374" width="336" height="80" rx="12" fill="#f3eef8" stroke="#8261a3" stroke-width="2"/><text x="241" y="409" font-size="19" fill="#8261a3" text-anchor="middle" font-weight="normal">去帽 → 5′→3′ 降解</text><text x="241" y="437" font-size="15" fill="#657682" text-anchor="middle" font-weight="normal">外切核酸酶从暴露的 5′ 端进入</text><rect x="551" y="374" width="336" height="80" rx="12" fill="#e9f5ee" stroke="#459274" stroke-width="2"/><text x="719" y="409" font-size="19" fill="#459274" text-anchor="middle" font-weight="normal">3′→5′ 降解</text><text x="719" y="437" font-size="15" fill="#657682" text-anchor="middle" font-weight="normal">降解复合物从 3′ 端推进</text><text x="480" y="482" font-size="16" fill="#657682" text-anchor="middle" font-weight="normal">两条路径是常见可能性；未表示特定 mRNA 的半衰期</text></svg>