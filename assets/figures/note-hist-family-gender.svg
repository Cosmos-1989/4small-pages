<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">理解家庭与性别的三个层面</title><desc id="desc">理解家庭与性别的三个层面；法律规定：婚姻及继承、财产与身份、诉讼和责任；伦理规范：家训与礼仪、亲属及性别秩序、典范与表彰；生活实践：劳动及经营、分家与嫁妆、协商和地方差异</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">理解家庭与性别的三个层面</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">法律规定</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">婚姻及继承</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">财产与身份</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">诉讼和责任</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">伦理规范</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">家训与礼仪</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">亲属及性别秩序</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">典范与表彰</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">生活实践</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">劳动及经营</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">分家与嫁妆</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">协商和地方差异</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">规范、权利与经验须由不同材料互相参照。</text></g></svg>