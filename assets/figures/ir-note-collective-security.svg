<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
<title id="title">安全困境与集体安全</title><desc id="desc">左侧表示防御行动在意图不明时可能引发威胁感知与反制；右侧表示联合国集体安全的事实认定、宪章程序及执行。箭头不表示必然结果，框形不表示数量。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="620" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="245" y="43" font-size="27" text-anchor="middle" fill="#253e48">安全困境</text><text x="735" y="43" font-size="27" text-anchor="middle" fill="#253e48">集体安全</text><line x1="490" y1="75" x2="490" y2="520" stroke="#c9d7db" stroke-width="1.5"/><rect x="50" y="90" width="390" height="85" rx="8" fill="#f5e8e2" stroke="#c9d7db" stroke-width="1.3"/><text x="245.0" y="123.5" font-size="23" text-anchor="middle" fill="#253e48">一方增加防御能力</text><text x="245.0" y="157.5" font-size="23" text-anchor="middle" fill="#253e48">希望降低自身风险</text><rect x="50" y="250" width="390" height="85" rx="8" fill="#f5e8e2" stroke="#c9d7db" stroke-width="1.3"/><text x="245.0" y="283.5" font-size="23" text-anchor="middle" fill="#253e48">另一方感到受威胁</text><text x="245.0" y="317.5" font-size="23" text-anchor="middle" fill="#253e48">担心突袭或意图变化</text><rect x="50" y="410" width="390" height="85" rx="8" fill="#f5e8e2" stroke="#c9d7db" stroke-width="1.3"/><text x="245.0" y="443.5" font-size="23" text-anchor="middle" fill="#253e48">反制与猜疑相互强化</text><text x="245.0" y="477.5" font-size="23" text-anchor="middle" fill="#253e48">可能降低共同安全</text><rect x="540" y="90" width="390" height="85" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="735.0" y="123.5" font-size="23" text-anchor="middle" fill="#253e48">识别和平威胁等情势</text><text x="735.0" y="157.5" font-size="23" text-anchor="middle" fill="#253e48">调查与事实判断</text><rect x="540" y="250" width="390" height="85" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="735.0" y="283.5" font-size="23" text-anchor="middle" fill="#253e48">安理会依宪章作出决定</text><text x="735.0" y="317.5" font-size="23" text-anchor="middle" fill="#253e48">授权范围与程序约束</text><rect x="540" y="410" width="390" height="85" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="735.0" y="443.5" font-size="23" text-anchor="middle" fill="#253e48">执行、监督与政治解决</text><text x="735.0" y="477.5" font-size="23" text-anchor="middle" fill="#253e48">需要成员合作和资源</text><path d="M245 175 V240" fill="none" stroke="#b56c52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="265" y="213" font-size="21" text-anchor="start" fill="#5f747d">攻防与意图难辨</text><path d="M245 335 V400" fill="none" stroke="#b56c52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="265" y="373" font-size="21" text-anchor="start" fill="#5f747d">不确定性持续累积</text><path d="M735 175 V240" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="755" y="213" font-size="21" text-anchor="start" fill="#5f747d">共同规则和法定职权</text><path d="M735 335 V400" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="755" y="373" font-size="21" text-anchor="start" fill="#5f747d">决议与成员执行</text><line x1="55" y1="540" x2="925" y2="540" stroke="#c9d7db" stroke-width="1.5"/><text x="490" y="582" font-size="23" text-anchor="middle" fill="#253e48">共同利益不保证合作；法定授权也需要有效执行。</text>
</g></svg>
