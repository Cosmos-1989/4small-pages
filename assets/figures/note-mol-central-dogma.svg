<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">遗传信息表达路径</title><desc id="desc">DNA复制，DNA经转录到RNA，经翻译到多肽；特定情况下RNA可逆转录为DNA。</desc><style>text{font-family:Songti SC,STSong,SimSun,Noto Serif CJK SC,serif;paint-order:stroke fill;stroke:#fff;stroke-width:0.5px}</style><defs>
