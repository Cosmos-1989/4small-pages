    </defs><rect x="4" y="4" width="952" height="492" rx="18" fill="#fff" stroke="#e2e9eb" stroke-width="1"/><rect x="75" y="170" width="210" height="124" rx="18" fill="#e8f5f6" stroke="#147d9b" stroke-width="2.5"/><text x="180" y="222" font-size="30" fill="#147d9b" text-anchor="middle" font-weight="600">DNA</text><text x="180" y="258" font-size="18" fill="#657682" text-anchor="middle" font-weight="normal">储存序列信息</text><rect x="375" y="170" width="210" height="124" rx="18" fill="#e9f5ee" stroke="#459274" stroke-width="2.5"/><text x="480" y="222" font-size="30" fill="#459274" text-anchor="middle" font-weight="600">RNA</text><text x="480" y="258" font-size="18" fill="#657682" text-anchor="middle" font-weight="normal">传递或执行功能</text><rect x="675" y="170" width="210" height="124" rx="18" fill="#fff0e2" stroke="#d98756" stroke-width="2.5"/><text x="780" y="222" font-size="30" fill="#d98756" text-anchor="middle" font-weight="600">多肽</text><text x="780" y="258" font-size="18" fill="#657682" text-anchor="middle" font-weight="normal">折叠与修饰</text><line x1="294" y1="232" x2="365" y2="232" stroke="#147d9b" stroke-width="4" stroke-linecap="round" marker-end="url(#arw-147d9b)"/><text x="330" y="208" font-size="19" fill="#147d9b" text-anchor="middle" font-weight="normal">转录</text><line x1="594" y1="232" x2="665" y2="232" stroke="#459274" stroke-width="4" stroke-linecap="round" marker-end="url(#arw-459274)"/><text x="630" y="208" font-size="19" fill="#459274" text-anchor="middle" font-weight="normal">翻译</text><path d="M112 154 C75 98 254 78 252 153" fill="none" stroke="#147d9b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw-147d9b)"/><text x="181" y="102" font-size="19" fill="#147d9b" text-anchor="middle" font-weight="normal">复制</text><path d="M425 304 C405 389 222 389 221 304" fill="none" stroke="#8261a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arw-8261a3)"/><text x="325" y="378" font-size="18" fill="#8261a3" text-anchor="middle" font-weight="normal">逆转录（特定机制）</text><line x1="480" y1="298" x2="480" y2="364" stroke="#459274" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="480" cy="393" r="27" fill="#e9f5ee" stroke="#459274" stroke-width="2"/><text x="480" y="400" font-size="15" fill="#459274" text-anchor="middle" font-weight="normal">RNA</text><text x="480" y="446" font-size="18" fill="#459274" text-anchor="middle" font-weight="normal">非编码 RNA 可直接起作用</text><text x="785" y="355" font-size="18" fill="#d98756" text-anchor="middle" font-weight="normal">N 端 → C 端</text><text x="780" y="440" font-size="16" fill="#657682" text-anchor="middle" font-weight="normal">箭头仅表序列信息方向</text></svg>