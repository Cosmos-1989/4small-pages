<svg xmlns="http://www.w3.org/2000/svg" width="980" height="750" viewBox="0 0 980 750" role="img" aria-labelledby="title desc">
<title id="title">原产地规则与协定优惠</title><desc id="desc">成员原产材料可在协定规定范围内累积，非原产材料须按产品特定规则处理。成员内生产加工后，还须符合原产资格和证明申报等条件，方可申请协定优惠。条件不符不能仅凭发货地享惠。箭头不表示数量。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#39798d"/></marker>
<marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b56c52"/></marker>
</defs>
<rect width="980" height="750" fill="white"/>
<g font-family='"Songti SC","STSong","Noto Serif CJK SC",SimSun,serif'>
<text x="490" y="43" font-size="27" text-anchor="middle" fill="#253e48">生产来源与优惠待遇</text><rect x="55" y="90" width="340" height="90" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="225.0" y="126.0" font-size="23" text-anchor="middle" fill="#253e48">成员原产材料</text><text x="225.0" y="160.0" font-size="23" text-anchor="middle" fill="#253e48">按协定范围适用累积</text><rect x="585" y="90" width="340" height="90" rx="8" fill="#f6eee2" stroke="#c9d7db" stroke-width="1.3"/><text x="755.0" y="126.0" font-size="23" text-anchor="middle" fill="#253e48">非原产材料</text><text x="755.0" y="160.0" font-size="23" text-anchor="middle" fill="#253e48">按产品特定规则判定</text><path d="M225 180 V225 H400 V260" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M755 180 V225 H580 V260" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="305" y="270" width="370" height="85" rx="8" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="490.0" y="303.5" font-size="23" text-anchor="middle" fill="#253e48">成员内生产或加工</text><text x="490.0" y="337.5" font-size="23" text-anchor="middle" fill="#253e48">核对适用的产品特定规则</text><path d="M490 355 V412" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="305" y="425" width="370" height="90" rx="8" fill="#e7f0f3" stroke="#c9d7db" stroke-width="1.3"/><text x="490.0" y="461.0" font-size="22" text-anchor="middle" fill="#253e48">原产资格符合要求</text><text x="490.0" y="495.0" font-size="22" text-anchor="middle" fill="#253e48">履行证明、申报等相关条件</text><path d="M490 515 V572" fill="none" stroke="#39798d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="305" y="585" width="370" height="75" rx="8" fill="#e9f1eb" stroke="#c9d7db" stroke-width="1.3"/><text x="490.0" y="630.5" font-size="24" text-anchor="middle" fill="#253e48">申请适用协定优惠税率</text><path d="M675 310 H790 V425" fill="none" stroke="#b56c52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="804" y="347" font-size="22" text-anchor="start" fill="#b56c52">条件不符</text><rect x="735" y="435" width="205" height="80" rx="8" fill="#f5e8e2" stroke="#c9d7db" stroke-width="1.3"/><text x="837.5" y="466.0" font-size="22" text-anchor="middle" fill="#253e48">不能自动</text><text x="837.5" y="500.0" font-size="22" text-anchor="middle" fill="#253e48">享受该项优惠</text><text x="490" y="712" font-size="23" text-anchor="middle" fill="#253e48">发货地、品牌或企业国籍，均不能替代原产资格判定。</text>
</g></svg>
