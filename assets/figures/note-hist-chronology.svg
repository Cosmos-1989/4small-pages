<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">公元纪年与年代精度</title><desc id="desc">逐年关系没有零年，三类年代证据各有适用条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="65" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">公元纪年与年代精度</text><path d="M80 198H917" stroke="#90a9ad" stroke-width="3" marker-end="url(#arrow)"/><circle cx="170" cy="198" r="7" fill="#597e89"/><text x="170" y="159" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">公元前 2 年</text><circle cx="410" cy="198" r="7" fill="#597e89"/><text x="410" y="159" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">公元前 1 年</text><circle cx="650" cy="198" r="7" fill="#597e89"/><text x="650" y="159" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">公元 1 年</text><circle cx="880" cy="198" r="7" fill="#597e89"/><text x="880" y="159" font-size="23" fill="#283e49" text-anchor="middle" font-weight="400">公元 2 年</text><text x="530" y="247" font-size="23" fill="#b76759" text-anchor="middle" font-weight="600">公元纪年没有 0 年</text><rect x="60" y="310" width="260" height="205" rx="16" fill="#edf3f3"/><text x="84" y="354" font-size="25" fill="#283e49" text-anchor="start" font-weight="600">文献纪年</text><text x="84" y="413" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">年号、王年、干支</text><text x="84" y="457" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">须与具体历法对应</text><rect x="370" y="310" width="260" height="205" rx="16" fill="#edf3f3"/><text x="394" y="354" font-size="25" fill="#283e49" text-anchor="start" font-weight="600">考古分期</text><text x="394" y="413" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">地层与器物序列</text><text x="394" y="457" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">通常给出相对先后</text><rect x="680" y="310" width="260" height="205" rx="16" fill="#edf3f3"/><text x="704" y="354" font-size="25" fill="#283e49" text-anchor="start" font-weight="600">测年结果</text><text x="704" y="413" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">校准后的时间范围</text><text x="704" y="457" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">须注明误差与样本</text><text x="60" y="563" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">上方为逐年关系；下方列出不同材料可提供的年代信息。</text></g></svg>