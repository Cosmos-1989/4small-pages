<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">思想与宗教的不同层次</title><desc id="desc">思想与宗教的不同层次；文本与解释：经典和注疏、翻译及传播、辩论与知识论证；组织与制度：学校与寺观、人员及经济资源、国家支持及限制；礼仪与生活：祭祀与修行、家庭及地方信仰、图像和物质实践</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#6d8c93"/></marker></defs><rect width="1000" height="600" fill="#fffdf9"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="60" y="64" font-size="30" fill="#283e49" text-anchor="start" font-weight="600">思想与宗教的不同层次</text><rect x="60.0" y="108" width="273.3333333333333" height="361" rx="18" fill="#edf4f5" stroke="#d6dedc"/><text x="82.0" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">文本与解释</text><text x="82.0" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">经典和注疏</text><text x="82.0" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">翻译及传播</text><text x="82.0" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">辩论与知识论证</text><rect x="353.3333333333333" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4edf5" stroke="#d6dedc"/><text x="375.3333333333333" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">组织与制度</text><text x="375.3333333333333" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">学校与寺观</text><text x="375.3333333333333" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">人员及经济资源</text><text x="375.3333333333333" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">国家支持及限制</text><rect x="646.6666666666666" y="108" width="273.3333333333333" height="361" rx="18" fill="#f4f0e7" stroke="#d6dedc"/><text x="668.6666666666666" y="153" font-size="26" fill="#283e49" text-anchor="start" font-weight="600">礼仪与生活</text><text x="668.6666666666666" y="215" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">祭祀与修行</text><text x="668.6666666666666" y="272" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">家庭及地方信仰</text><text x="668.6666666666666" y="329" font-size="21" fill="#283e49" text-anchor="start" font-weight="400">图像和物质实践</text><text x="60" y="538" font-size="18" fill="#63747a" text-anchor="start" font-weight="400">三栏为研究层次；不把多种传统归为单一信仰体系。</text></g></svg>