<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 650" role="img" aria-labelledby="title desc"><title id="title">MHCⅠ与MHCⅡ的常规抗原呈递路径</title><desc id="desc">并列显示胞质蛋白和内吞蛋白的加工、MHC呈递及CD8或CD4 T细胞识别；省略交叉呈递。</desc><defs><marker id="a5286a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5286a0"/></marker><marker id="a608e7e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#608e7e"/></marker><marker id="ab98b4f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b98b4f"/></marker><marker id="a9783aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9783aa"/></marker><marker id="abc7b75" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bc7b75"/></marker><marker id="a35464d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#35464d"/></marker></defs><rect width="1220" height="650" fill="#fcfcfa"/><g font-family="Songti SC, STSong, SimSun, serif"><text x="60" y="60" font-size="30" fill="#35464d" text-anchor="start">抗原加工与T细胞识别</text><circle cx="215" cy="326" r="145" fill="#edf3f0" stroke="#608e7e" stroke-width="2.5"/><circle cx="173" cy="370" r="42" fill="#ece7f0" stroke="#9783aa" stroke-width="2.5"/><circle cx="493" cy="326" r="59" fill="#e6eff4" stroke="#5286a0" stroke-width="2.5"/><circle cx="486" cy="330" r="23" fill="#eee8f1" stroke="#9783aa" stroke-width="2.5"/><path d="M360 346v-40q15 15 30 0v40" stroke="#9783aa" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M369 300q7 -11 15 0" stroke="#b98b4f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M433 326h-19m7 0l-13 -16m13 16l-13 16" stroke="#5286a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="493" y="421" font-size="23" fil