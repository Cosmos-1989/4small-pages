<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="t d"><title id="t">酶催化与自由能</title><desc id="d">有酶和无酶反应的起终态自由能相同，酶路径峰值更低，反应总体自由能变化保持不变。</desc><defs><marker id="a28434b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#28434b"/></marker><marker id="a467d9b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#467d9b"/></marker><marker id="a548c7d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#548c7d"/></marker><marker id="ab18a4d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#b18a4d"/></marker><marker id="a8b709d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#8b709d"/></marker><marker id="abd7067" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#bd7067"/></marker><marker id="a637780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#637780"/></marker></defs><rect width="1000" height="665" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="55" y="58" font-size="30" fill="#28434b" text-anchor="start">相同起终态，不同反应路径</text><path d="M115 525L920 525" fill="none" stroke="#28434b" stroke-width="2" marker-end="url(#a28434b)"/><path d="M115 525L115 105" fill="none" stroke="#28434b" stroke-width="2" marker-end="url(#a28434b)"/><text x="55" y="100" font-size="23" fill="#28434b" text-anchor="start">吉布斯自由能 G</text><path d="M175 399C300 399 324 143 480 143S671 463 853 463" fill="none" stroke="#8b709d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 399C312 399 352 296 480 296S678 463 853 463" fill="none" stroke="#548c7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 399L900 399" fill="none" stroke="#b2bec1" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M853 463L900 463" fill="none" stroke="#b2bec1" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M480 399L480 298" fill="none" stroke="#548c7d" stroke-width="2" marker-end="url(#a548c7d)"/><text x="496" y="363" font-size="22" fill="#548c7d" text-anchor="start">催化能垒</text><path d="M384 399L384 143" fill="none" stroke="#8b709d" stroke-width="2" marker-end="url(#a8b709d)"/><path d="M384 143L480 143" fill="none" stroke="#8b709d" stroke-width="1.5" stroke-dasharray="5 5"/><text x="325" y="270" font-size="23" fill="#8b709d" text-anchor="end">无酶</text><path d="M894 399L894 460" fill="none" stroke="#b18a4d" stroke-width="2" marker-end="url(#ab18a4d)"/><text x="909" y="439" font-size="21" fill="#b18a4d" text-anchor="start">ΔG＜0</text><text x="178" y="437" font-size="24" fill="#28434b" text-anchor="start">反应物</text><text x="780" y="501" font-size="24" fill="#28434b" text-anchor="start">产物</text><path d="M680 132L725 132" fill="none" stroke="#8b709d" stroke-width="4"/><text x="740" y="140" font-size="22" fill="#8b709d" text-anchor="start">无酶路径</text><path d="M680 177L725 177" fill="none" stroke="#548c7d" stroke-width="4"/><text x="740" y="185" font-size="22" fill="#548c7d" text-anchor="start">酶催化路径</text><text x="500" y="573" font-size="24" fill="#28434b" text-anchor="middle">反应进程（不是时间）</text><text x="55" y="625" font-size="21" fill="#637780" text-anchor="start">示意路径无定量能量刻度；真实酶反应可含多个中间体。</text></g></svg>