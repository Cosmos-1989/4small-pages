<svg xmlns="http://www.w3.org/2000/svg" width="980" height="344" viewBox="0 0 980 344" role="img" aria-labelledby="title desc"><title id="title">文化表达、媒介与受众理解</title><desc id="desc">文化表达经媒介与翻译进入受众的解释过程，可能带来认同、协商或拒绝。传播量、理解、赞同和行动不能相互等同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#71858e"/></marker></defs><style>text{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif}</style><rect width="980" height="344" fill="white"/><rect x="28" y="74" width="200" height="100" rx="12" fill="#edf3f8" stroke="#cdd8dc" stroke-width="1.5"/><text x="128.0" y="116.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">文化表达</text><text x="128.0" y="146.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">内容、形式与语境</text><rect x="271" y="74" width="200" height="100" rx="12" fill="#edf5f2" stroke="#cdd8dc" stroke-width="1.5"/><text x="371.0" y="116.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">媒介与翻译</text><text x="371.0" y="146.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">选择、再现与传播</text><rect x="514" y="74" width="200" height="100" rx="12" fill="#f8f2e9" stroke="#cdd8dc" stroke-width="1.5"/><text x="614.0" y="116.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">受众理解</text><text x="614.0" y="146.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">经验、期待与解释</text><rect x="757" y="74" width="200" height="100" rx="12" fill="#f6eff4" stroke="#cdd8dc" stroke-width="1.5"/><text x="857.0" y="116.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="600">态度与行动</text><text x="857.0" y="146.0" font-size="21" fill="#273c48" text-anchor="middle" font-weight="400">认同、协商或拒绝</text><path d="M233 124 L263 124" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M476 124 L506 124" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M719 124 L749 124" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><path d="M855 184 V253 H128 V184" fill="none" stroke="#71858e" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="241" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">反馈与对话：重新说明、回应质疑、调整表达</text><text x="490" y="311" font-size="20" fill="#273c48" text-anchor="middle" font-weight="400">传播量不等于理解程度；理解不等于赞同，赞同也不必然转化为行动。</text></svg>