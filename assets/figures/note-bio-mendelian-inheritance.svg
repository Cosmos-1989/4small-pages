<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">单基因杂合体自交：Aa × Aa</title><desc id="desc">两个亲本各形成A和a两类配子，四个等概率组合得到1AA、2Aa、1aa。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#687e83"/></marker></defs><rect width="1000" height="650" fill="#fffefa"/><g font-family="Songti SC,STSong,SimSun,Noto Serif CJK SC,serif"><text x="50" y="58" font-size="32" fill="#294451" text-anchor="start" font-weight="600">单基因杂合体自交：Aa × Aa</text><text x="126" y="156" font-size="24" fill="#294451" text-anchor="start">另一亲本的配子</text><text x="475" y="120" font-size="27" fill="#3f7d96" text-anchor="middle">A（½）</text><text x="710" y="120" font-size="27" fill="#bb695c" text-anchor="middle">a（½）</text><text x="165" y="270" font-size="27" fill="#3f7d96" text-anchor="start">A（½）</text><text x="165" y="438" font-size="27" fill="#bb695c" text-anchor="start">a（½）</text><rect x="355" y="175" width="225" height="155" rx="15" fill="#eef4f4" stroke="#d5e0e0" stroke-width="2"/><text x="467" y="245" font-size="42" fill="#294451" text-anchor="middle" font-weight="600">AA</text><text x="467" y="296" font-size="25" fill="#687e83" text-anchor="middle">概率 ¼</text><rect x="590" y="175" width="225" height="155" rx="15" fill="#eef4f4" stroke="#d5e0e0" stroke-width="2"/><text x="702" y="245" font-size="42" fill="#294451" text-anchor="middle" font-weight="600">Aa</text><text x="702" y="296" font-size="25" fill="#687e83" text-anchor="middle">概率 ¼</text><rect x="355" y="343" width="225" height="155" rx="15" fill="#eef4f4" stroke="#d5e0e0" stroke-width="2"/><text x="467" y="413" font-size="42" fill="#294451" text-anchor="middle" font-weight="600">Aa</text><text x="467" y="464" font-size="25" fill="#687e83" text-anchor="middle">概率 ¼</text><rect x="590" y="343" width="225" height="155" rx="15" fill="#f6eae7" stroke="#d5e0e0" stroke-width="2"/><text x="702" y="413" font-size="42" fill="#294451" text-anchor="middle" font-weight="600">aa</text><text x="702" y="464" font-size="25" fill="#687e83" text-anchor="middle">概率 ¼</text><text x="145" y="550" font-size="28" fill="#294451" text-anchor="start">基因型：1 AA ∶ 2 Aa ∶ 1 aa</text><text x="145" y="590" font-size="24" fill="#687e83" text-anchor="start">完全显性时，表型预期为 3∶1</text><text x="50" y="624" font-size="20" fill="#687e83" text-anchor="start">正常分离与随机受精的理论概率；有限后代不必恰好符合该比例。</text></g></svg>