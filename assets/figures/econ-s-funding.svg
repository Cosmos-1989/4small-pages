<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"><title>现收现付与积累筹资</title><desc>两条筹资路径不按箭头长短表示时间，未暗示资产收益有保证。</desc><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718f99"/></marker></defs><g font-family="&quot;Songti SC&quot;, &quot;STSong&quot;, &quot;SimSun&quot;, serif"><text x="450" y="35" text-anchor="middle" font-size="25" fill="#294752">两种养老筹资逻辑</text><text x="450" y="75" text-anchor="middle" font-size="21" fill="#294752">现收现付：当期收入支持当期待遇</text><rect x="40" y="105" width="230" height="80" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="155.0" y="152.0" text-anchor="middle" font-size="20" fill="#294752">当期收入</text><rect x="335" y="105" width="230" height="80" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="450.0" y="152.0" text-anchor="middle" font-size="20" fill="#294752">缴费与税收</text><rect x="630" y="105" width="230" height="80" rx="12" fill="#eef5f5" stroke="#aec4ca"/><text x="745.0" y="152.0" text-anchor="middle" font-size="20" fill="#294752">当期养老金</text><path d="M270,145 L335,145" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M565,145 L630,145" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="450" y="237" text-anchor="middle" font-size="21" fill="#294752">积累筹资：过去储蓄经资产支持未来给付</text><rect x="40" y="265" width="230" height="80" rx="12" fill="#f7f2e9" stroke="#aec4ca"/><text x="155.0" y="312.0" text-anchor="middle" font-size="20" fill="#294752">过去缴费</text><rect x="335" y="265" width="230" height="80" rx="12" fill="#f7f2e9" stroke="#aec4ca"/><text x="450.0" y="312.0" text-anchor="middle" font-size="20" fill="#294752">资产积累与收益</text><rect x="630" y="265" width="230" height="80" rx="12" fill="#f7f2e9" stroke="#aec4ca"/><text x="745.0" y="312.0" text-anchor="middle" font-size="20" fill="#294752">未来养老金</text><path d="M270,305 L335,305" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><path d="M565,305 L630,305" stroke="#718f99" stroke-width="2.3" fill="none" marker-end="url(#a)"/><text x="450" y="398" text-anchor="middle" font-size="19" fill="#294752">现实制度可以混合；人口、就业、工资、市场与治理风险各不相同</text></g></svg>